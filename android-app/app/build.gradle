plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.nsu.fp'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.nsu.fp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
