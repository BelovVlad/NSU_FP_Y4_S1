name: Restructure site into docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restructure-site.yml'

permissions:
  contents: write

jobs:
  restructure:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move site files under docs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/pdfjs docs/search-index .github

          cp materials.html docs/materials.html
          cp pdfjs/viewer.html docs/pdfjs/viewer.html
          cp -a search-index/. docs/search-index/
          cp _config.yml docs/_config.yml
          mv README.md .github/README.md

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/materials.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'^---\n---\n', '', s, count=1)
          s = re.sub(
              r"  const FILES=\[.*?\.filter\(p=>!p\.includes\('/LaTeX/'\)&&ORDER\.includes\(p\.split\('/'\)\[0\]\)\);",
              "  let FILES=[];",
              s,
              count=1,
              flags=re.S,
          )
          old = "fileMetaMap=new Map((data.files||[]).map(x=>[x.path,x]));return fileMetaMap"
          new = "fileMetaMap=new Map((data.files||[]).map(x=>[x.path,x]));FILES=[...fileMetaMap.keys()].filter(p=>!p.includes('/LaTeX/')&&ORDER.includes(p.split('/')[0]));return fileMetaMap"
          if old not in s:
              raise SystemExit('metadata initializer pattern not found')
          s = s.replace(old, new, 1)

          s = re.sub(
              r"async function resolvePreviewPdfUrl\(path\)\{.*?\}\n  async function getPreviewDocument",
              "async function resolvePreviewPdfUrl(path){await loadFileMetadata();const version=fileMetaMap.get(path)?.version||'',u=new URL(`https://media.githubusercontent.com/media/${OWNER}/${REPO}/${BRANCH}/${enc(path)}`);if(version)u.searchParams.set('v',version);return u.href}\n  async function getPreviewDocument",
              s,
              count=1,
              flags=re.S,
          )

          init_old = "const fromHash=location.hash.startsWith('#subject=')?decodeURIComponent(location.hash.slice(9)):null;if(fromHash&&ORDER.includes(fromHash))current=fromHash;else if(!subjectFiles(current).length)current=ORDER.find(s=>subjectFiles(s).length)||'ФиХАиМ';renderNav();renderSubject(current);void loadFileMetadata();"
          init_new = "loadFileMetadata().then(()=>{const fromHash=location.hash.startsWith('#subject=')?decodeURIComponent(location.hash.slice(9)):null;if(fromHash&&ORDER.includes(fromHash))current=fromHash;else if(!subjectFiles(current).length)current=ORDER.find(s=>subjectFiles(s).length)||'ФиХАиМ';renderNav();renderSubject(current)}).catch(()=>{content.innerHTML='<div class=\"empty\">Не удалось загрузить список материалов.</div>'});"
          if init_old not in s:
              raise SystemExit('startup pattern not found')
          s = s.replace(init_old, init_new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('docs/pdfjs/viewer.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r"async function resolvePdfUrl\(path\)\{.*?\n\}",
              "async function resolvePdfUrl(path){const u=new URL(`https://media.githubusercontent.com/media/${OWNER}/${REPO}/${BRANCH}/${encPath(path)}`);if(versionParam)u.searchParams.set('v',versionParam);return u.href\n}",
              s,
              count=1,
              flags=re.S,
          )
          p.write_text(s, encoding='utf-8')

          Path('docs/_config.yml').write_text('title: "ФФ НГУ — 4 курс, 1 семестр"\nencoding: utf-8\n', encoding='utf-8')
          Path('index.html').write_text('''<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=docs/index.html"><title>ФФ НГУ</title><script>location.replace('docs/index.html'+location.hash)</script></head><body></body></html>\n''', encoding='utf-8')
          PY

          rm -f map.html materials.html _config.yml
          rm -rf pdfjs search-index
          rm -f .github/workflows/restructure-site.yml

      - name: Commit restructuring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move website files under docs"
          git pull --rebase origin main
          git push origin HEAD:main
