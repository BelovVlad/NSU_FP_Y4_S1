name: Viewer regression tests

on:
  push:
    branches: [main]
    paths:
      - 'site/web/index.html'
      - 'site/web/secret-dashboard.*'
      - 'site/web/app.*'
      - 'site/web/app-core.js'
      - 'site/web/annotations-store.js'
      - 'site/web/offline-resources.json'
      - 'site/web/sw.js'
      - 'site/web/particles/**'
      - 'site/root/**'
      - 'site/web/manifest.webmanifest'
      - 'site/web/assets/app-*.png'
      - 'site/web/search-worker.js'
      - 'site/web/giscus-config.json'
      - 'site/web/search-index/**'
      - 'site/web/secret-dashboard*'
      - 'site/web/Karma/**'
      - 'site/web/Overseer/**'
      - 'site/scripts/build_app_bundle.py'
      - 'site/scripts/build_site.py'
      - 'site/scripts/build_search_index.py'
      - 'site/scripts/build_karma_history.py'
      - 'site/web/pdfjs/**'
      - 'site/web/notebook/**'
      - '**/*.ipynb'
      - 'site/tests/**'
      - '.github/workflows/viewer-tests.yml'
  pull_request:
    paths:
      - 'site/web/index.html'
      - 'site/web/secret-dashboard.*'
      - 'site/web/app.*'
      - 'site/web/app-core.js'
      - 'site/web/annotations-store.js'
      - 'site/web/offline-resources.json'
      - 'site/web/sw.js'
      - 'site/web/particles/**'
      - 'site/root/**'
      - 'site/web/manifest.webmanifest'
      - 'site/web/assets/app-*.png'
      - 'site/web/search-worker.js'
      - 'site/web/giscus-config.json'
      - 'site/web/search-index/**'
      - 'site/web/secret-dashboard*'
      - 'site/web/Karma/**'
      - 'site/web/Overseer/**'
      - 'site/scripts/build_app_bundle.py'
      - 'site/scripts/build_site.py'
      - 'site/scripts/build_search_index.py'
      - 'site/scripts/build_karma_history.py'
      - 'site/web/pdfjs/**'
      - 'site/web/notebook/**'
      - '**/*.ipynb'
      - 'site/tests/**'
      - '.github/workflows/viewer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r site/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      # Test the site as it will be published: app.js and cache stamps rebuilt from sources.
      - run: python site/scripts/build_site.py
      - run: python -m unittest discover -s site/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test site/tests/karma-engine.test.cjs site/tests/karma-animation.test.cjs site/tests/particles-layout.test.cjs
