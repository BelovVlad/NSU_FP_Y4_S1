name: Viewer regression tests

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/pdfjs/**'
      - 'docs/notebook/**'
      - '**/*.ipynb'
      - 'tests/**'
      - '.github/workflows/viewer-tests.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/pdfjs/**'
      - 'docs/notebook/**'
      - '**/*.ipynb'
      - 'tests/**'
      - '.github/workflows/viewer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
