name: Viewer regression tests

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/secret-dashboard.*'
      - 'Karma/**'
      - 'docs/app.*'
      - 'docs/sw.js'
      - 'docs/manifest.webmanifest'
      - 'docs/assets/app-*.png'
      - 'docs/search-worker.js'
      - 'docs/giscus-config.json'
      - 'docs/search-index/**'
      - '.github/scripts/build_search_index.py'
      - 'docs/pdfjs/**'
      - 'docs/notebook/**'
      - '**/*.ipynb'
      - 'tests/**'
      - '.github/workflows/viewer-tests.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/secret-dashboard.*'
      - 'Karma/**'
      - 'docs/app.*'
      - 'docs/sw.js'
      - 'docs/manifest.webmanifest'
      - 'docs/assets/app-*.png'
      - 'docs/search-worker.js'
      - 'docs/giscus-config.json'
      - 'docs/search-index/**'
      - '.github/scripts/build_search_index.py'
      - 'docs/pdfjs/**'
      - 'docs/notebook/**'
      - '**/*.ipynb'
      - 'tests/**'
      - '.github/workflows/viewer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/karma-engine.test.cjs tests/karma-animation.test.cjs
