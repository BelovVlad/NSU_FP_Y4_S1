name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NSU-FP-Android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSU-FP-Android-debug
          path: android-app/NSU-FP-Android-debug.apk
          if-no-files-found: error


      - name: Publish latest APK
        shell: bash
        run: |
          cd ..
          git pull --rebase origin main
          mkdir -p docs/android
          cp android-app/app/build/outputs/apk/debug/app-debug.apk docs/android/NSU-FP.apk
          cat > docs/android/version.json <<'EOF'
          {
            "versionCode": 9,
            "versionName": "1.7",
            "apkUrl": "https://raw.githubusercontent.com/BelovVlad/NSU_FP_Y4_S1/main/docs/android/NSU-FP.apk",
            "requiresReinstallBelow": 6
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/android/NSU-FP.apk docs/android/version.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Android APK 1.7 [skip ci]"
            git push origin HEAD:main
          fi
