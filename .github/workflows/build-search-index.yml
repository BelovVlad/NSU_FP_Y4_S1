name: Build search index

on:
  push:
    branches: [main]
    paths:
      - '**/*.pdf'
      - '**/*.ipynb'
      - '.github/scripts/build_search_index.py'
      - '.github/scripts/build_course_graph.py'
      - '.github/workflows/build-search-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pymupdf
      - run: python .github/scripts/build_search_index.py
      - run: python .github/scripts/build_course_graph.py

      - name: Commit generated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index
          if git diff --cached --quiet; then
            echo "Generated data unchanged"
          else
            git commit -m "Update generated site data"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
