name: Build search index
# Site search metadata, Karma history and the app bundle are regenerated from source files.

on:
  push:
    branches: [main]
    paths:
      - '**/*.pdf'
      - '**/*.ipynb'
      - '**/*.tex'
      - 'Karma/rules.json'
      - 'docs/app-core.js'
      - '.github/scripts/build_app_bundle.py'
      - '.github/scripts/build_search_index.py'
      - '.github/scripts/build_karma_history.py'
      - 'Karma/rules.json'
      - '.github/workflows/build-search-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf
      - run: python .github/scripts/build_app_bundle.py
      - run: python .github/scripts/build_search_index.py
      - run: python .github/scripts/build_karma_history.py
      - name: Commit generated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.js docs/search-index
          if git diff --cached --quiet; then
            echo "Generated site data unchanged"
          else
            git commit -m "Update generated site data"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
