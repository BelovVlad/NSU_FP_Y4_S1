<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NSU FP · 4 курс</title>
<style>
:root{
  --bg:#080d12;--bg2:#0b1117;--side:#0a0f14;--panel:#0e151c;--panel2:#121a22;
  --line:#25303a;--line2:#1b252e;--text:#f1ede7;--text2:#c9c2b9;--muted:#7e8892;
  --cream:#ead4b7;--warm:#b78b62;--accent:#d64c50;--accent2:#7f242b;--soft:rgba(214,76,80,.14);
  --sideW:242px;--gap:14px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
button,input,select{font:inherit}button{color:inherit}a{color:inherit}
button,a,input,select{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.shell{min-height:100vh}
.sidebar{
  position:fixed;inset:0 auto 0 0;z-index:50;width:var(--sideW);display:flex;flex-direction:column;
  padding:20px 16px;border-right:1px solid var(--line2);
  background:
    radial-gradient(420px 270px at 25% 91%,rgba(121,67,38,.14),transparent 65%),
    linear-gradient(180deg,#090e13 0%,#0a1015 70%,#0b0f12 100%);
}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 20px;border-bottom:1px solid var(--line2)}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(214,76,80,.36);border-radius:10px;background:var(--soft);color:#ff666b}
.brand-mark svg{width:25px;height:25px}
.brand-title{font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:700;color:var(--cream);letter-spacing:.02em}
.brand-sub{margin-top:1px;color:var(--muted);font-size:11px}
.main-nav{padding:19px 0 13px}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:11px;height:40px;margin:2px 0;padding:0 12px;
  border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;text-align:left
}
.nav-btn:hover{background:rgba(255,255,255,.025);color:var(--text)}
.nav-btn.active{border-color:rgba(214,76,80,.2);background:linear-gradient(90deg,rgba(214,76,80,.24),rgba(214,76,80,.12));color:#f5d7d2}
.nav-ico{width:18px;text-align:center;color:var(--cream);opacity:.9}
.subjects-label{padding:15px 12px 7px;border-top:1px solid var(--line2);color:#67717b;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.subject-nav{min-height:0;flex:1;overflow:auto;padding:0 0 10px}
.subject-btn{
  width:100%;height:36px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:#c7bfb4;
  text-align:left;cursor:pointer;font-size:14px
}
.subject-btn:hover{background:rgba(255,255,255,.025);color:#fff}
.subject-btn.active{background:linear-gradient(90deg,rgba(214,76,80,.35),rgba(127,36,43,.32));color:#f7e1d4;box-shadow:inset 2px 0 0 var(--accent)}
.sidebar-bottom{padding:14px 8px 2px;border-top:1px solid var(--line2)}
.repo-link{display:flex;align-items:center;justify-content:space-between;color:#8d969f;text-decoration:none;font-size:12px}
.repo-link:hover{color:var(--cream)}
.app{min-height:100vh;margin-left:var(--sideW)}
.topbar{
  position:sticky;top:0;z-index:30;height:68px;display:grid;grid-template-columns:minmax(250px,680px) 1fr auto;
  align-items:center;gap:18px;padding:0 28px;border-bottom:1px solid rgba(37,48,58,.68);
  background:rgba(8,13,18,.9);backdrop-filter:blur(16px)
}
.menu-btn{display:none}
.searchbox{position:relative}
.searchbox input{
  width:100%;height:40px;padding:0 76px 0 40px;border:1px solid var(--line);border-radius:8px;outline:0;
  background:#0d141b;color:var(--text);font-size:13px
}
.searchbox input:focus{border-color:rgba(214,76,80,.58);box-shadow:0 0 0 3px rgba(214,76,80,.08)}
.searchbox .glass{position:absolute;left:13px;top:9px;color:#a1a8af}
.kbd{position:absolute;right:9px;top:8px;padding:3px 7px;border:1px solid #303943;border-radius:5px;background:#151c23;color:#9da5ad;font-size:10px}
.top-meta{justify-self:end;color:#6f7a84;font-size:12px}
.ghost-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#0d141b;cursor:pointer}
.main{padding:0 18px 52px}
.hero{
  position:relative;min-height:164px;margin:0 -18px 0;padding:22px 28px 20px;overflow:hidden;border-bottom:1px solid var(--line2);
  background:
    radial-gradient(520px 220px at 90% 25%,rgba(122,65,34,.17),transparent 62%),
    linear-gradient(180deg,rgba(12,18,24,.92),rgba(8,13,18,.35))
}
.breadcrumbs{display:flex;gap:8px;align-items:center;color:#7f8891;font-size:12px}
.breadcrumbs .sep{opacity:.45}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:17px}
.hero-copy{position:relative;z-index:2;max-width:calc(100% - 500px)}
.hero h1{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--cream);font-size:36px;line-height:1;letter-spacing:.01em}
.hero-sub{margin-top:8px;color:#a9a39d;font-family:Georgia,"Times New Roman",serif;font-size:15px}
.hero-art{position:absolute;right:24px;top:10px;width:455px;height:144px;overflow:hidden;border:1px solid rgba(183,139,98,.18);border-radius:10px;opacity:.92;pointer-events:none;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.hero-art img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 56%;filter:grayscale(.15) sepia(.38) saturate(.92) brightness(.68) contrast(1.18)}
.hero-art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,13,18,.96) 0%,rgba(8,13,18,.52) 18%,rgba(8,13,18,.06) 45%,rgba(112,35,42,.18) 100%),linear-gradient(180deg,rgba(234,212,183,.04),rgba(0,0,0,.18));box-shadow:inset 0 0 32px rgba(0,0,0,.32)}
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;flex:none;height:39px;padding:0 16px;border:0;background:transparent;color:#969da4;cursor:pointer;font-size:12px
}
.tab:hover{color:var(--text)}
.tab.active{color:#f1ded0}
.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.workspace{display:grid;grid-template-columns:minmax(430px,1.08fr) minmax(390px,.92fr);gap:14px;margin-top:14px}
.panel{border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#0d141b,#0b1218);overflow:hidden}
.list-panel{min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 11px}
.panel-title{margin:0;font-family:Georgia,"Times New Roman",serif;color:#eadbc9;font-size:19px}
.panel-count{display:inline-grid;place-items:center;min-width:27px;height:27px;margin-left:6px;padding:0 7px;border-radius:999px;background:#1b232b;color:#bfc5ca;font-family:Inter,sans-serif;font-size:11px}
.sort-select{
  height:34px;padding:0 30px 0 10px;border:1px solid var(--line);border-radius:7px;background:#111920;color:#b5bdc4;font-size:11px;outline:0
}
.file-list{padding:0 13px 13px}
.file-row{
  display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:61px;padding:9px 10px;
  border-bottom:1px solid var(--line2);border-radius:7px;cursor:pointer;transition:background .12s,border-color .12s
}
.file-row:last-child{border-bottom-color:transparent}
.file-row:hover{background:#111921}
.file-row.active{background:linear-gradient(90deg,rgba(127,36,43,.55),rgba(93,30,34,.33));box-shadow:inset 2px 0 0 var(--accent)}
.file-ico{width:28px;height:34px;display:grid;place-items:center;color:#ff5e62;font-size:18px}.entry-no{font-size:11px;font-weight:800;letter-spacing:.04em;color:#e8b3a8}
.file-main{min-width:0}
.file-name{overflow:hidden;color:#f0ece7;font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.file-desc{margin-top:3px;overflow:hidden;color:#77818b;font-size:10.5px;text-overflow:ellipsis;white-space:nowrap}
.file-side{text-align:right;white-space:nowrap}
.file-date{color:#8d969e;font-size:10.5px}
.file-size{margin-top:4px;color:#606b75;font-size:10px}
.empty{padding:38px 20px;color:#78828b;text-align:center}
.extra{margin-top:12px;padding:14px 16px 16px}
.extra-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.extra-card{display:flex;align-items:center;gap:11px;min-height:70px;padding:12px;border:1px solid var(--line2);border-radius:8px;background:#0e151b;color:#d2cec8;cursor:pointer}
.extra-card:hover{border-color:#39434d;background:#111922}
.extra-icon{font-size:22px;color:#e05256}.extra-title{font-size:12px}.extra-sub{margin-top:3px;color:#69737d;font-size:10px}
.preview-panel{min-width:0;align-self:start;position:sticky;top:82px}
.preview-head{padding:15px 16px 10px}
.preview-kicker{color:#8d969e;font-family:Georgia,"Times New Roman",serif;font-size:13px}
.preview-title{margin:3px 0 0;font-family:Georgia,"Times New Roman",serif;color:#f0dfcb;font-size:20px;line-height:1.2}
.preview-date{float:right;color:#6f7a84;font-family:Inter,sans-serif;font-size:10px;font-weight:400}
.preview-tabs{display:flex;padding:0 12px;border-bottom:1px solid var(--line2)}
.preview-tab{height:36px;padding:0 12px;border:0;background:transparent;color:#858e97;font-size:10.5px;cursor:pointer}
.preview-tab.active{border-bottom:2px solid var(--accent);background:rgba(214,76,80,.08);color:#ead6ca}
.preview-frame-wrap{height:500px;padding:10px;background:#0a1016}
.preview-frame{width:100%;height:100%;border:1px solid #202a33;border-radius:7px;background:#101820}
.preview-placeholder{height:100%;display:grid;place-items:center;padding:36px;text-align:center;color:#737e88}
.preview-placeholder .big{font-family:Georgia,"Times New Roman",serif;color:#cbb79f;font-size:22px}
.preview-placeholder .small{margin-top:8px;color:#6b757e;font-size:12px}
.preview-info{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line2)}
.info-box{padding:13px 14px;min-height:118px}
.info-box+ .info-box{border-left:1px solid var(--line2)}
.info-title{margin-bottom:9px;color:#b9c0c6;font-size:11px;font-weight:700}
.info-row{display:flex;justify-content:space-between;gap:10px;margin:5px 0;color:#69747e;font-size:10px}
.info-row span:last-child{color:#aeb5bb;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:4px 7px;border:1px solid rgba(214,76,80,.22);border-radius:999px;background:rgba(214,76,80,.1);color:#d8b7af;font-size:9px}
.preview-actions{display:flex;gap:8px;padding:0 14px 14px}
.action{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#111920;color:#b9c0c6;text-decoration:none;font-size:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.action.primary{border-color:rgba(214,76,80,.36);background:rgba(214,76,80,.17);color:#f0d6cf}
.action:hover{filter:brightness(1.13)}
.search-view{max-width:1180px;margin:14px auto 0}
.search-title{margin:0 0 5px;font-family:Georgia,"Times New Roman",serif;color:var(--cream);font-size:28px}
.search-note{margin-bottom:14px;color:#727d87;font-size:12px}
.search-result{padding:13px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.search-result:hover{background:#111921}
.search-result-title{color:#ece7e1;font-size:13px;font-weight:700}
.search-result-meta{margin-top:3px;color:#767f88;font-size:10px}
.search-snippet{margin-top:7px;color:#a8aeb3;font-size:11px;line-height:1.5}
mark{padding:0 2px;border-radius:2px;background:rgba(214,76,80,.25);color:#ffd7d2}
.home-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}
.welcome{padding:20px}
.welcome h2{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--cream);font-size:28px}
.welcome p{margin:7px 0 0;color:#848e97;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
.stat{padding:13px;border:1px solid var(--line2);border-radius:8px;background:#0f171e}
.stat-num{font-family:Georgia,"Times New Roman",serif;color:#efe1d0;font-size:22px}.stat-label{margin-top:2px;color:#6d7780;font-size:9px}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}
.course-card{padding:12px;border:1px solid var(--line2);border-radius:8px;background:#0e151b;cursor:pointer}
.course-card:hover{border-color:#3a444e;background:#111a21}
.course-code{color:#f0dbca;font-weight:750;font-size:12px}.course-name{margin-top:4px;color:#6e7881;font-size:9.5px;line-height:1.35}
.recent{padding:17px}.recent-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer}.recent-row:last-child{border-bottom:0}
.recent-name{color:#dcd8d2;font-size:11px}.recent-meta,.recent-date{margin-top:2px;color:#69747d;font-size:9.5px}
.mobile-overlay{display:none}
@media(max-width:1180px){
  .workspace{grid-template-columns:minmax(400px,1fr) minmax(340px,.8fr)}
  .hero-art{width:390px}.hero-copy{max-width:calc(100% - 410px)}.preview-frame-wrap{height:430px}
}
@media(max-width:900px){
  :root{--sideW:232px}
  .workspace{display:block}.preview-panel{position:static;margin-top:12px}.hero-art{width:320px;opacity:.62}.hero-copy{max-width:calc(100% - 300px)}
  .preview-frame-wrap{height:520px}.home-grid{grid-template-columns:1fr}
}
@media(max-width:720px){
  .sidebar{transform:translateX(-100%);transition:transform .18s ease;box-shadow:22px 0 50px rgba(0,0,0,.5)}
  .sidebar.open{transform:none}.mobile-overlay{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.5)}.mobile-overlay.show{display:block}
  .app{margin-left:0}.topbar{height:58px;grid-template-columns:auto 1fr auto;padding:0 10px;gap:8px}.menu-btn{display:block;width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#0d141b;color:#d9d1c8}
  .top-meta,.kbd{display:none}.searchbox input{height:38px;padding-right:12px}.main{padding:0 10px 28px}
  .hero{min-height:140px;margin:0 -10px;padding:17px 13px}.hero h1{font-size:30px}.hero-art{display:none}.hero-copy{max-width:none}
  .tabs{margin-top:16px}.tab{padding:0 12px}
  .workspace{margin-top:10px}.panel-head{padding:12px}.file-list{padding:0 7px 7px}.file-row{grid-template-columns:30px minmax(0,1fr);padding:9px 7px}.file-side{display:none}
  .preview-panel{display:none}.extra-grid{grid-template-columns:1fr}.home-grid{margin-top:10px}.stats{grid-template-columns:repeat(2,1fr)}.course-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="overlay" class="mobile-overlay"></div>
<div class="shell">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3">
          <circle cx="32" cy="32" r="5" fill="currentColor" stroke="none"/>
          <ellipse cx="32" cy="32" rx="25" ry="10"/><ellipse cx="32" cy="32" rx="25" ry="10" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="25" ry="10" transform="rotate(120 32 32)"/>
        </svg>
      </div>
      <div><div class="brand-title">NSU FP</div><div class="brand-sub">4 курс · 1 семестр</div></div>
    </div>

    <div class="main-nav">
      <button class="nav-btn" data-view="home"><span class="nav-ico">⌂</span>Главная</button>
      <button class="nav-btn active" data-view="subjects"><span class="nav-ico">▣</span>Предметы</button>
      <button class="nav-btn" data-view="search"><span class="nav-ico">⌕</span>Поиск</button>
      <button class="nav-btn" data-view="literature"><span class="nav-ico">⌘</span>Литература</button>
      <button class="nav-btn" data-view="tasks"><span class="nav-ico">□</span>Задачи</button>
      <button class="nav-btn" data-view="archive"><span class="nav-ico">▤</span>Архив</button>
    </div>

    <div class="subjects-label">Предметы</div>
    <nav id="subjectNav" class="subject-nav"></nav>
    <div class="sidebar-bottom">
      <a class="repo-link" href="https://github.com/BelovVlad/NSU_FP_Y4_S1" target="_blank" rel="noopener"><span>GitHub</span><span>↗</span></a>
    </div>
  </aside>

  <div class="app">
    <header class="topbar">
      <button id="menuBtn" class="menu-btn" type="button">☰</button>
      <div class="searchbox"><span class="glass">⌕</span><input id="globalSearch" type="search" autocomplete="off" placeholder="Поиск по лекциям, задачам, формулам…"><span class="kbd">Ctrl + K</span></div>
      <div class="top-meta">NSU · Physics</div>
      <button id="homeBtn" class="ghost-btn" title="Главная">⌂</button>
    </header>
    <main id="main" class="main"></main>
  </div>
</div>

<script>
const OWNER='BelovVlad',REPO='NSU_FP_Y4_S1',BRANCH='main';
const ORDER=['ОВФ','СВЧ','ТДиСФ','ФКСВ','ФЭЧ','ФиХАиМ','База'];
const META={
  'ОВФ':{name:'Основы вычислительной физики',lecturer:'Усов Э. В.'},
  'СВЧ':{name:'СВЧ'},
  'ТДиСФ':{name:'Термодинамика и статистическая физика',lecturer:'Грабовский В. В.',seminarist:'Глинский В. В.'},
  'ФКСВ':{name:'Физика конденсированного состояния вещества',lecturer:'Шварц Б. А.',seminarist:'Махмудиан М. М.'},
  'ФЭЧ':{name:'Физика атомного ядра и элементарных частиц',lecturer:'Шварц Б. А.',seminarist:'Винокурова А. Н.'},
  'ФиХАиМ':{name:'Физика и химия атомов и молекул',lecturer:'Горбунов О. А.',seminarist:'Горбунов О. А.'},
  'База':{name:'База знаний'}
};
const HERO_IMAGE='assets/nsu-academic-hero.webp';
const FILES=[
{% for file in site.static_files %}
  {% assign ext = file.extname | downcase %}
  {% unless file.path contains '/LaTeX/' %}
    {% if ext == '.pdf' or ext == '.ipynb' %}
      {path:{{ file.path | remove_first:'/' | jsonify }},name:{{ file.name | jsonify }},ext:{{ ext | jsonify }}},
    {% endif %}
  {% endunless %}
{% endfor %}
];

const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const state={view:'subjects',subject:'ФиХАиМ',section:'',selected:null,selectedEntry:null,meta:new Map(),structure:{groups:[]},searchData:null,searchBusy:false,sort:'date'};
const main=$('#main'),subjectNav=$('#subjectNav'),searchInput=$('#globalSearch'),sidebar=$('#sidebar'),overlay=$('#overlay');

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function encPath(p){return p.split('/').map(encodeURIComponent).join('/')}
function subjectOf(f){return f.path.split('/')[0]}
function rawSection(f){
  const p=f.path.split('/')[1]||'Материалы';
  return p.replace(/^\d+[_ .-]*/,'').replace(/_/g,' ');
}
function sectionOf(f){
  const s=rawSection(f).toLowerCase();
  if(s.includes('лекц'))return 'Лекции';
  if(s.includes('семинар'))return 'Семинары';
  if(s.includes('лаборатор'))return 'Лабораторные';
  if(s.includes('месяч')||s.includes('задач'))return 'Задачи';
  if(s.includes('литерат'))return 'Литература';
  if(s.includes('практик'))return 'Практика';
  if(s.includes('теори'))return 'Теория';
  return rawSection(f);
}
function niceName(f){
  const stem=(f.name||f.path.split('/').pop()).replace(/\.(pdf|ipynb)$/i,'').replace(/_/g,' ');
  if(stem.toLowerCase()==='final'){
    const s=sectionOf(f);
    if(s==='Лекции')return 'Конспект лекций';
    if(s==='Семинары')return 'Семинары';
    if(s==='Задачи')return 'Месячные задания';
  }
  return stem;
}
function fileMeta(f){return state.meta.get(f.path)||{}}
function fmtSize(n){
  n=Number(n)||0;if(!n)return '—';
  if(n<1024)return n+' Б';if(n<1048576)return (n/1024).toFixed(0)+' КБ';return (n/1048576).toFixed(n>10485760?0:1)+' МБ';
}
function fmtDate(s){
  if(!s)return '—';const d=new Date(s);if(Number.isNaN(d.getTime()))return '—';
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function updatedValue(f){const m=fileMeta(f);return m.updated_at||m.created_at||''}
function fileDesc(f){
  const bits=[sectionOf(f)];
  const p=f.path.split('/').slice(2,-1).map(x=>x.replace(/_/g,' ')).filter(Boolean);
  if(p.length)bits.push(p[p.length-1]);
  return bits.join(' · ');
}
function filesFor(subject,section){
  return FILES.filter(f=>subjectOf(f)===subject && (!section||sectionOf(f)===section));
}
function sectionsFor(subject){
  const set=[];filesFor(subject).forEach(f=>{const s=sectionOf(f);if(!set.includes(s))set.push(s)});
  const pref=['Лекции','Семинары','Лабораторные','Задачи','Литература','Практика','Теория'];
  return set.sort((a,b)=>(pref.indexOf(a)<0?99:pref.indexOf(a))-(pref.indexOf(b)<0?99:pref.indexOf(b))||a.localeCompare(b,'ru'));
}
function structuredGroup(subject,section){
  return (state.structure.groups||[]).find(g=>g.subject===subject&&g.section===section)||null;
}
function fileByPath(path){return FILES.find(f=>f.path===path)||null}
function sortedEntries(items){
  const out=(items||[]).slice();
  if(state.sort==='name')out.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||''),'ru'));
  else out.sort((a,b)=>(a.number||0)-(b.number||0));
  return out;
}
function githubUrl(f){return 'https://github.com/'+OWNER+'/'+REPO+'/blob/'+BRANCH+'/'+encPath(f.path)}
function nbviewerUrl(f){return 'https://nbviewer.org/github/'+OWNER+'/'+REPO+'/blob/'+BRANCH+'/'+encPath(f.path)}
function viewerUrl(f,page=0,titleOverride=''){
  let url='pdfjs/viewer.html?file='+encodeURIComponent(f.path)+'&subject='+encodeURIComponent(subjectOf(f))+'&title='+encodeURIComponent(titleOverride||niceName(f));
  if(page)url+='&page='+encodeURIComponent(page);
  if(fileMeta(f).version)url+='&v='+encodeURIComponent(fileMeta(f).version);
  return url;
}
function keywords(f){
  const source=(niceName(f)+' '+fileDesc(f)).replace(/[^\p{L}\p{N}]+/gu,' ').split(/\s+/).filter(x=>x.length>4);
  return [...new Set(source)].slice(0,4);
}

function setActiveNav(view){
  $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
}
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('show')}
function openMenu(){sidebar.classList.add('open');overlay.classList.add('show')}

function renderSubjectNav(){
  subjectNav.innerHTML=ORDER.filter(s=>FILES.some(f=>subjectOf(f)===s)).map(s=>'<button class="subject-btn'+(s===state.subject&&state.view==='subjects'?' active':'')+'" data-subject="'+esc(s)+'">'+esc(s)+'</button>').join('');
  $$('.subject-btn').forEach(b=>b.onclick=()=>{state.view='subjects';state.subject=b.dataset.subject;state.section='';state.selected=null;state.selectedEntry=null;setActiveNav('subjects');renderSubjectNav();render();closeMenu()});
}

function hero(subject){
  const meta=META[subject]||{name:subject};
  return '<section class="hero">'+
    '<div class="breadcrumbs"><span>Главная</span><span class="sep">›</span><span>'+esc(subject)+'</span></div>'+
    '<div class="hero-row"><div class="hero-copy"><h1>'+esc(subject)+'</h1><div class="hero-sub">'+esc(meta.name||subject)+'</div></div></div>'+
    '<div class="hero-art" aria-hidden="true"><img src="'+HERO_IMAGE+'" alt=""></div>'+
  '</section>';
}

function tabs(subject){
  const ss=sectionsFor(subject);
  if(!state.section||!ss.includes(state.section))state.section=ss[0]||'';
  return '<div class="tabs">'+ss.map(s=>'<button class="tab'+(s===state.section?' active':'')+'" data-section="'+esc(s)+'">'+esc(s)+'</button>').join('')+'</div>';
}

function sortedFiles(arr){
  const out=arr.slice();
  if(state.sort==='name')out.sort((a,b)=>niceName(a).localeCompare(niceName(b),'ru'));
  else out.sort((a,b)=>(new Date(updatedValue(b)||0))-(new Date(updatedValue(a)||0))||niceName(a).localeCompare(niceName(b),'ru'));
  return out;
}

function fileRows(files){
  if(!files.length)return '<div class="empty">В этом разделе пока нет материалов.</div>';
  return sortedFiles(files).map((f,i)=>{
    const m=fileMeta(f),active=state.selected&&state.selected.path===f.path;
    return '<div class="file-row'+(active?' active':'')+'" data-path="'+esc(f.path)+'">'+
      '<div class="file-ico">'+(f.ext==='.pdf'?'▤':'⌘')+'</div>'+
      '<div class="file-main"><div class="file-name">'+esc(niceName(f))+'</div><div class="file-desc">'+esc(fileDesc(f))+'</div></div>'+
      '<div class="file-side"><div class="file-date">'+esc(fmtDate(m.updated_at||m.created_at))+'</div><div class="file-size">'+esc(fmtSize(m.size))+'</div></div>'+
    '</div>';
  }).join('');
}
function entryRows(group){
  const items=sortedEntries(group?.items||[]);
  if(!items.length)return '<div class="empty">Структура этого раздела пока не найдена.</div>';
  return items.map(item=>{
    const active=state.selectedEntry&&state.selectedEntry.id===item.id;
    const range=item.page?(item.end_page&&item.end_page!==item.page?'стр. '+item.page+'–'+item.end_page:'стр. '+item.page):'страница уточняется';
    return '<div class="file-row'+(active?' active':'')+'" data-entry="'+esc(item.id)+'">'+
      '<div class="file-ico"><span class="entry-no">'+String(item.number||'').padStart(2,'0')+'</span></div>'+
      '<div class="file-main"><div class="file-name">'+esc(item.title||'Без названия')+'</div><div class="file-desc">'+esc(item.subtitle||group.section)+'</div></div>'+
      '<div class="file-side"><div class="file-date">'+esc(fmtDate(item.date))+'</div><div class="file-size">'+esc(range)+'</div></div>'+
    '</div>';
  }).join('');
}

function preview(f,entry=null){
  if(!f)return '<aside class="panel preview-panel"><div class="preview-placeholder"><div><div class="big">Выберите материал</div><div class="small">Справа появится предпросмотр PDF и информация о файле.</div></div></div></aside>';
  const m=fileMeta(f),isPdf=f.ext==='.pdf';
  const displayTitle=entry?.title||niceName(f);
  const url=isPdf?viewerUrl(f,entry?.page||0,displayTitle):nbviewerUrl(f);
  const frame=isPdf?'<iframe class="preview-frame" src="'+esc(url)+'" loading="lazy" title="'+esc(displayTitle)+'"></iframe>':
    '<div class="preview-placeholder"><div><div class="big">Jupyter Notebook</div><div class="small">Интерактивный файл можно открыть через nbviewer или GitHub.</div></div></div>';
  const tags=keywords(f).map(k=>'<span class="tag">'+esc(k)+'</span>').join('')||'<span class="tag">'+esc(sectionOf(f))+'</span>';
  const date=entry?.date||m.updated_at||m.created_at;
  const pageRange=entry?.page?(entry.end_page&&entry.end_page!==entry.page?entry.page+'–'+entry.end_page:String(entry.page)):'—';
  return '<aside class="panel preview-panel">'+
    '<div class="preview-head"><div class="preview-kicker">'+esc(entry?((entry.number?'№ '+entry.number+' · ':'')+sectionOf(f)):sectionOf(f))+'<span class="preview-date">'+esc(fmtDate(date))+'</span></div><h2 class="preview-title">'+esc(displayTitle)+'</h2>'+(entry?.subtitle?'<div class="file-desc" style="margin-top:6px">'+esc(entry.subtitle)+'</div>':'')+'</div>'+
    '<div class="preview-tabs"><button class="preview-tab active">Просмотр</button><button class="preview-tab">Информация</button><button class="preview-tab">Файл</button></div>'+
    '<div class="preview-frame-wrap">'+frame+'</div>'+
    '<div class="preview-info"><div class="info-box"><div class="info-title">Информация</div>'+
      '<div class="info-row"><span>Файл</span><span>'+esc(f.name||f.path.split('/').pop())+'</span></div>'+
      '<div class="info-row"><span>Размер</span><span>'+esc(fmtSize(m.size))+'</span></div>'+
      '<div class="info-row"><span>Страницы</span><span>'+esc(pageRange)+'</span></div>'+
      '<div class="info-row"><span>Обновлено</span><span>'+esc(fmtDate(date))+'</span></div></div>'+
      '<div class="info-box"><div class="info-title">Ключевые темы</div><div class="tags">'+tags+'</div></div></div>'+
    '<div class="preview-actions"><a class="action primary" href="'+esc(url)+'">Открыть'+(isPdf?' PDF':' notebook')+'</a><a class="action" target="_blank" rel="noopener" href="'+esc(githubUrl(f))+'">GitHub ↗</a></div>'+
  '</aside>';
}
function extraBlocks(subject){
  const groups=[
    ['Конспекты','Лекции','LaTeX, PDF','▤'],
    ['Практика','Семинары','Задачи и решения','□'],
    ['Литература','Литература','Статьи, книги','⌘']
  ];
  return '<section class="panel extra"><h2 class="panel-title">Дополнительные материалы</h2><div class="extra-grid">'+groups.map(g=>{
    const n=filesFor(subject,g[1]).length;
    return '<div class="extra-card" data-jump="'+esc(g[1])+'"><div class="extra-icon">'+g[3]+'</div><div><div class="extra-title">'+g[0]+'</div><div class="extra-sub">'+(n?n+' файл(ов)':'Пока пусто')+' · '+g[2]+'</div></div></div>';
  }).join('')+'</div></section>';
}

function renderSubject(){
  const firstSection=sectionsFor(state.subject)[0]||'';
  if(!state.section)state.section=firstSection;
  const group=structuredGroup(state.subject,state.section);
  const files=filesFor(state.subject,state.section);
  let listHtml='',count=0,listTitle='Список материалов',previewFile=null;

  if(group&&group.items?.length){
    const pdfFile=fileByPath(group.pdf_path);
    count=group.items.length;
    listTitle=state.section==='Лекции'?'Список лекций':state.section==='Семинары'?'Список семинаров':'Список материалов';
    if(!state.selectedEntry||!group.items.some(i=>i.id===state.selectedEntry.id))state.selectedEntry=group.items[0];
    state.selected=pdfFile;
    previewFile=pdfFile;
    listHtml=entryRows(group);
  }else{
    state.selectedEntry=null;
    if(!state.selected||!files.some(f=>f.path===state.selected.path))state.selected=files[0]||null;
    previewFile=state.selected;
    count=files.length;
    listHtml=fileRows(files);
  }

  main.innerHTML=hero(state.subject)+
    '<div>'+tabs(state.subject)+'</div>'+
    '<div class="workspace"><div><section class="panel list-panel"><div class="panel-head"><h2 class="panel-title">'+esc(listTitle)+' <span class="panel-count">'+count+'</span></h2><select id="sortSelect" class="sort-select"><option value="date">По порядку</option><option value="name">По названию</option></select></div><div class="file-list">'+listHtml+'</div></section>'+extraBlocks(state.subject)+'</div>'+preview(previewFile,state.selectedEntry)+'</div>';

  const sort=$('#sortSelect');if(sort){sort.value=state.sort;sort.onchange=()=>{state.sort=sort.value;renderSubject()}}
  $$('.tab').forEach(b=>b.onclick=()=>{state.section=b.dataset.section;state.selected=null;state.selectedEntry=null;renderSubject()});
  $$('.file-row[data-entry]').forEach(r=>r.onclick=()=>{
    const item=(group?.items||[]).find(i=>i.id===r.dataset.entry);if(!item)return;
    state.selectedEntry=item;
    if(innerWidth<=720&&previewFile?.ext==='.pdf'){location.href=viewerUrl(previewFile,item.page||0,item.title);return}
    renderSubject();
  });
  $$('.file-row[data-path]').forEach(r=>r.onclick=()=>{
    const f=FILES.find(x=>x.path===r.dataset.path);if(!f)return;
    if(innerWidth<=720&&f.ext==='.pdf'){location.href=viewerUrl(f);return}
    state.selected=f;state.selectedEntry=null;renderSubject();
  });
  $$('.extra-card').forEach(c=>c.onclick=()=>{const s=c.dataset.jump;if(sectionsFor(state.subject).includes(s)){state.section=s;state.selected=null;state.selectedEntry=null;renderSubject()}});
}
function countBySection(name){return FILES.filter(f=>sectionOf(f)===name).length}
function renderHome(){
  const subjectCount=ORDER.filter(s=>FILES.some(f=>subjectOf(f)===s)).length;
  const recent=FILES.slice().sort((a,b)=>(new Date(updatedValue(b)||0))-(new Date(updatedValue(a)||0))).slice(0,7);
  main.innerHTML='<div class="home-grid">'+
    '<section class="panel welcome"><h2>Материалы 4 курса</h2><p>Физический факультет НГУ · 1 семестр</p>'+
      '<div class="stats"><div class="stat"><div class="stat-num">'+subjectCount+'</div><div class="stat-label">предметов</div></div><div class="stat"><div class="stat-num">'+countBySection('Лекции')+'</div><div class="stat-label">лекционных файлов</div></div><div class="stat"><div class="stat-num">'+countBySection('Семинары')+'</div><div class="stat-label">семинаров</div></div><div class="stat"><div class="stat-num">'+FILES.length+'</div><div class="stat-label">всего материалов</div></div></div>'+
      '<div class="course-grid">'+ORDER.filter(s=>FILES.some(f=>subjectOf(f)===s)).map(s=>'<div class="course-card" data-subject="'+esc(s)+'"><div class="course-code">'+esc(s)+'</div><div class="course-name">'+esc((META[s]||{}).name||s)+'</div></div>').join('')+'</div>'+
    '</section>'+
    '<section class="panel recent"><h2 class="panel-title">Недавно обновлено</h2>'+recent.map(f=>'<div class="recent-row" data-path="'+esc(f.path)+'"><div><div class="recent-name">'+esc(niceName(f))+'</div><div class="recent-meta">'+esc(subjectOf(f)+' · '+sectionOf(f))+'</div></div><div class="recent-date">'+esc(fmtDate(updatedValue(f)))+'</div></div>').join('')+'</section>'+
  '</div>';
  $$('.course-card').forEach(c=>c.onclick=()=>{state.view='subjects';state.subject=c.dataset.subject;state.section='';state.selected=null;state.selectedEntry=null;setActiveNav('subjects');renderSubjectNav();render()});
  $$('.recent-row').forEach(r=>r.onclick=()=>{const f=FILES.find(x=>x.path===r.dataset.path);if(!f)return;state.view='subjects';state.subject=subjectOf(f);state.section=sectionOf(f);state.selected=f;setActiveNav('subjects');renderSubjectNav();render()});
}

async function ensureSearch(){
  if(state.searchData)return state.searchData;
  if(state.searchBusy)return null;
  state.searchBusy=true;
  try{
    const man=await fetch('search-index/manifest.json',{cache:'no-store'}).then(r=>r.json());
    const shards=await Promise.all((man.shards||[]).map(s=>fetch('search-index/'+s.file,{cache:'force-cache'}).then(r=>r.json()).catch(()=>({records:[]}))));
    state.searchData=shards.flatMap(s=>s.records||[]);
  }catch(e){state.searchData=[]}
  state.searchBusy=false;return state.searchData;
}
function hi(text,q){
  const s=esc(text||'');if(!q)return s;
  const safe=q.replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&');
  try{return s.replace(new RegExp('('+safe+')','ig'),'<mark>$1</mark>')}catch{return s}
}
async function runSearch(q){
  q=(q||'').trim();state.view='search';setActiveNav('search');renderSubjectNav();
  main.innerHTML='<section class="search-view"><h1 class="search-title">Поиск</h1><div class="search-note">'+(q?'Ищем «'+esc(q)+'»':'Введите запрос в строке сверху.')+'</div><div class="panel" id="searchResults"><div class="empty">'+(q.length<2?'Минимум 2 символа.':'Поиск…')+'</div></div></section>';
  if(q.length<2)return;
  const needle=q.toLocaleLowerCase('ru-RU');
  let hits=[];
  FILES.forEach(f=>{
    const hay=(niceName(f)+' '+f.path+' '+sectionOf(f)).toLocaleLowerCase('ru-RU');
    if(hay.includes(needle))hits.push({f,page:0,snippet:fileDesc(f),score:3});
  });
  if(q.length>=3){
    const idx=await ensureSearch();
    if(idx){
      idx.forEach(r=>{
        let first=null;
        for(const p of (r.pages||[])){
          const text=String(p.t||''),at=text.toLocaleLowerCase('ru-RU').indexOf(needle);
          if(at>=0){first={page:p.n||0,snippet:text.slice(Math.max(0,at-90),at+needle.length+150)};break}
        }
        if(first&&!hits.some(h=>h.f.path===r.path)){
          const f=FILES.find(x=>x.path===r.path);if(f)hits.push({f,page:first.page,snippet:first.snippet,score:2});
        }
      });
    }
  }
  hits=hits.sort((a,b)=>b.score-a.score||niceName(a.f).localeCompare(niceName(b.f),'ru')).slice(0,100);
  const box=$('#searchResults');if(!box)return;
  box.innerHTML=hits.length?hits.map(h=>'<div class="search-result" data-path="'+esc(h.f.path)+'" data-page="'+h.page+'"><div class="search-result-title">'+hi(niceName(h.f),q)+'</div><div class="search-result-meta">'+esc(subjectOf(h.f)+' · '+sectionOf(h.f))+(h.page?' · стр. '+h.page:'')+'</div><div class="search-snippet">'+hi(h.snippet,q)+'</div></div>').join(''):'<div class="empty">Совпадений не найдено.</div>';
  $$('.search-result').forEach(r=>r.onclick=()=>{const f=FILES.find(x=>x.path===r.dataset.path);if(!f)return;state.view='subjects';state.subject=subjectOf(f);state.section=sectionOf(f);state.selected=f;setActiveNav('subjects');renderSubjectNav();render()});
}

function renderFiltered(title,predicate){
  const list=FILES.filter(predicate);
  main.innerHTML='<section class="search-view"><h1 class="search-title">'+esc(title)+'</h1><div class="search-note">'+list.length+' файл(ов)</div><div class="panel">'+fileRows(list)+'</div></section>';
  $$('.file-row').forEach(r=>r.onclick=()=>{const f=FILES.find(x=>x.path===r.dataset.path);if(!f)return;state.view='subjects';state.subject=subjectOf(f);state.section=sectionOf(f);state.selected=f;setActiveNav('subjects');renderSubjectNav();render()});
}

function render(){
  if(state.view==='home')renderHome();
  else if(state.view==='subjects')renderSubject();
  else if(state.view==='search')runSearch(searchInput.value);
  else if(state.view==='literature')renderFiltered('Литература',f=>sectionOf(f)==='Литература');
  else if(state.view==='tasks')renderFiltered('Задачи',f=>sectionOf(f)==='Задачи'||sectionOf(f)==='Семинары');
  else if(state.view==='archive')renderFiltered('Все материалы',()=>true);
}

async function loadMeta(){
  try{
    const [data,structure]=await Promise.all([
      fetch('search-index/files.json',{cache:'no-store'}).then(r=>r.json()),
      fetch('search-index/structure.json',{cache:'no-store'}).then(r=>r.ok?r.json():({groups:[]})).catch(()=>({groups:[]}))
    ]);
    (data.files||[]).forEach(x=>state.meta.set(x.path,x));
    state.structure=structure||{groups:[]};
  }catch(e){}
  render();
}

$$('.nav-btn').forEach(b=>b.onclick=()=>{
  state.view=b.dataset.view;setActiveNav(state.view);renderSubjectNav();
  if(state.view==='search'){searchInput.focus();runSearch(searchInput.value)}else render();
  closeMenu();
});
$('#homeBtn').onclick=()=>{state.view='home';setActiveNav('home');renderSubjectNav();render()};
$('#menuBtn').onclick=openMenu;overlay.onclick=closeMenu;
searchInput.addEventListener('input',()=>{if(searchInput.value.trim()){state.view='search';setActiveNav('search');runSearch(searchInput.value)}else if(state.view==='search')runSearch('')});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchInput.focus();searchInput.select()}});
renderSubjectNav();render();loadMeta();
</script>
