<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080d12">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NSU FP">
<link rel="icon" type="image/png" sizes="192x192" href="assets/app-192.png?v=f299e7a63c">
<link rel="apple-touch-icon" href="assets/app-192.png?v=f299e7a63c">
<link rel="manifest" href="manifest.webmanifest?v=6bddccb735">
<title>NSU FP · 4 курс</title>
<link rel="stylesheet" href="site.css?v=93c5fe9e27">
<link rel="stylesheet" href="knowledge.css?v=5db485695e">
<link rel="stylesheet" href="app.css?v=4e2e52a233">
<link rel="stylesheet" href="Overseer/overseer.css?v=3c70ee01aa">
<script defer src="annotations-store.js?v=67333490cd"></script>
<script defer src="app.js?v=b0bec72a78"></script>
<script defer src="Overseer/overseer.js?v=c6c82cab8a"></script>
</head>
<body>
<div id="overlay" class="mobile-overlay"></div>
<div id="musicGlitch" class="music-glitch" aria-hidden="true">
  <span class="music-glitch-band band-a"></span>
  <span class="music-glitch-band band-b"></span>
  <span class="music-glitch-band band-c"></span>
</div>
<div class="shell">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="secretAcademicTrigger" role="button" tabindex="0" aria-label="Эмблема NSU FP">
        <img src="assets/nsu-fp-emblem.webp" alt="">
      </div>
      <div><div class="brand-title">NSU FP</div><div class="brand-sub">4 курс · 1 семестр</div></div>
    </div>

    <div class="main-nav">
      <button class="nav-btn active" data-view="home"><span class="nav-ico" data-icon="home" aria-hidden="true"></span>Главная</button>
      <button class="nav-btn" data-view="subjects"><span class="nav-ico" data-icon="subjects" aria-hidden="true"></span>Предметы</button>
      <button class="nav-btn" data-view="literature"><span class="nav-ico" data-icon="literature" aria-hidden="true"></span>Литература</button>
      <button class="nav-btn" data-view="archive"><span class="nav-ico" data-icon="archive" aria-hidden="true"></span>Архив</button>
    </div>

    <div class="subjects-label">Предметы</div>
    <nav id="subjectNav" class="subject-nav"></nav>
    <div class="music-control">
      <div class="music-row">
        <button id="musicToggle" class="music-toggle" type="button" aria-pressed="false" aria-label="Включить музыку" title="Включить музыку">
          <span class="music-pearl-shell" aria-hidden="true">
            <img class="music-pearl music-pearl-play" src="assets/1.png" alt="">
            <img class="music-pearl music-pearl-pause" src="assets/2.png" alt="">
          </span>
        </button>
        <span class="music-copy"><span class="music-label">Атмосфера</span></span>
      </div>
      <audio id="siteMusic" preload="none" loop></audio>
    </div>
    <div class="sidebar-bottom">
      <button id="offlineFiles" type="button" hidden>Сохранённые PDF</button>
      <a class="repo-link" href="https://github.com/BelovVlad/NSU_FP_Y4_S1" target="_blank" rel="noopener"><span>GitHub</span><span data-icon="external" aria-hidden="true"></span></a>
    </div>
  </aside>

  <div class="app">
    <header class="topbar">
      <button id="menuBtn" class="menu-btn" type="button" title="Меню" aria-label="Открыть меню"><span data-icon="menu" aria-hidden="true"></span></button>
      <div class="searchbox"><span class="glass" data-icon="search" aria-hidden="true"></span><input id="globalSearch" type="search" autocomplete="off" placeholder="Поиск по лекциям, задачам, формулам…"><span class="kbd">Ctrl + K</span></div>
      <div class="top-meta">NSU · Physics</div>
      <div class="topbar-actions"><button id="homeBtn" class="ghost-btn" title="Главная" aria-label="Главная"><span data-icon="home" aria-hidden="true"></span></button><button id="appSettings" class="ghost-btn" type="button" title="Приложение и данные" aria-label="Приложение и данные"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><polygon points="20.912,10.747 20.912,13.253 18.986,13.742 18.172,15.708 19.188,17.416 17.416,19.188 15.708,18.172 13.742,18.986 13.253,20.912 10.747,20.912 10.258,18.986 8.292,18.172 6.584,19.188 4.812,17.416 5.828,15.708 5.014,13.742 3.088,13.253 3.088,10.747 5.014,10.258 5.828,8.292 4.812,6.584 6.584,4.812 8.292,5.828 10.258,5.014 10.747,3.088 13.253,3.088 13.742,5.014 15.708,5.828 17.416,4.812 19.188,6.584 18.172,8.292 18.986,10.258"/><circle cx="12" cy="12" r="3.2"/></svg></button></div>
    </header>
    <main id="main" class="main"></main>
  </div>
</div>


<div id="pdfFullscreen" class="pdf-fullscreen" aria-hidden="true">
  <div class="music-glitch music-glitch-pdf" aria-hidden="true">
    <span class="music-glitch-band band-a"></span>
    <span class="music-glitch-band band-b"></span>
    <span class="music-glitch-band band-c"></span>
  </div>
  <div id="pdfFullscreenLoader" class="pdf-fullscreen-loader" aria-hidden="true">
    <div class="pdf-loader-core">
      <div class="pdf-loader-ring"></div>
      <div id="pdfFullscreenLoaderText" class="pdf-loader-text">Открываю PDF…</div>
      <div class="pdf-loader-sub">Подготавливаю страницу</div>
    </div>
  </div>
  <iframe id="pdfFullscreenFrame" class="pdf-fullscreen-frame" title="PDF" allow="fullscreen" allowfullscreen></iframe>
</div>

<script src="site.js?v=b288eeb3d9"></script>
</body>
</html>
