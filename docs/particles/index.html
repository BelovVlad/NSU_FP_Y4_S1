<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070c11">
<title>Карта частиц · NSU FP</title>
<style>
:root{--bg:#070c11;--panel:#0b1219;--panel2:#101922;--line:#25313c;--text:#f4eee8;--muted:#7e8a95;--rose:#f44767;--blue:#3989ff;--green:#41d67c;--purple:#8f55ff;--gold:#f2b83e;--orange:#f2783f;--violet:#bd55ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.app{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr) 300px;grid-template-rows:62px minmax(0,1fr);background:radial-gradient(900px 600px at 50% 50%,rgba(19,43,58,.14),transparent 68%),#070c11}.top{grid-column:1/-1;display:grid;grid-template-columns:230px minmax(240px,1fr) 300px;align-items:center;border-bottom:1px solid var(--line);background:rgba(7,12,17,.92);backdrop-filter:blur(14px);z-index:20}.brand{height:100%;display:flex;align-items:center;gap:12px;padding:0 18px;border-right:1px solid var(--line)}.back{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#0d151d;font-size:22px}.brand h1{margin:0;font:700 20px Georgia,serif}.brand small{display:block;color:var(--muted);margin-top:2px}.search{padding:0 18px}.searchbox{position:relative;max-width:720px;margin:auto}.searchbox input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:#0c141c;padding:0 44px 0 42px;outline:0;font-size:13px}.searchbox input:focus{border-color:#a1364c;box-shadow:0 0 0 3px rgba(244,71,103,.08)}.searchbox:before{content:'⌕';position:absolute;left:14px;top:8px;color:#8995a0;font-size:21px}.resultcount{position:absolute;right:12px;top:10px;color:#697682;font-size:11px}.top-actions{height:100%;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 12px;border-left:1px solid var(--line)}.iconbtn{height:38px;min-width:38px;border:1px solid var(--line);border-radius:9px;background:#0d151d;padding:0 11px}.left{grid-column:1;grid-row:2;padding:15px 12px;border-right:1px solid var(--line);background:linear-gradient(180deg,#090f15,#080d12);overflow:auto}.side-title{margin:2px 8px 10px;color:#b7c0c8;font-size:12px;font-weight:800}.filter{width:100%;height:39px;display:flex;align-items:center;gap:10px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:#9ba6ae;text-align:left}.filter:hover{background:#111a22}.filter.active{background:rgba(244,71,103,.12);color:#ffdce2}.dot{width:10px;height:10px;border-radius:50%;background:var(--c,#888);box-shadow:0 0 12px color-mix(in srgb,var(--c,#888) 55%,transparent)}.sep{height:1px;background:var(--line);margin:14px 5px}.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;color:#9ba6ae;font-size:12px}.toggle input{accent-color:#df3d5a}.legend{padding:8px 10px;color:#7e8a95;font-size:11px;line-height:1.6}.legend-row{display:flex;align-items:center;gap:8px;margin:5px 0}.line-sample{width:28px;height:2px;background:var(--c)}.canvas-wrap{grid-column:2;grid-row:2;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 50%,rgba(35,68,86,.10),transparent 45%)}#world{position:absolute;inset:0;width:100%;height:100%;cursor:grab}#world.dragging{cursor:grabbing}.hud{position:absolute;left:14px;bottom:14px;display:flex;gap:7px;z-index:8}.hud button{height:36px;min-width:38px;border:1px solid var(--line);border-radius:9px;background:rgba(10,17,24,.91)}.tip{position:absolute;right:14px;bottom:14px;padding:8px 10px;border:1px solid rgba(62,78,91,.8);border-radius:9px;background:rgba(9,15,21,.82);color:#71808c;font-size:10px;pointer-events:none}.right{grid-column:3;grid-row:2;border-left:1px solid var(--line);background:linear-gradient(180deg,#090f15,#080d12);overflow:auto}.details{padding:17px 16px 24px}.details-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.symbol{font:700 38px Georgia,serif}.name{margin-top:3px;color:#89959f;font-size:12px}.close-detail{display:none;width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#0d151d}.tabs{display:flex;margin:16px 0 14px;border-bottom:1px solid var(--line)}.tab{height:34px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:#74818c;font-size:11px}.tab.active{border-color:#e33f5c;color:#f5d6db}.props{display:grid;grid-template-columns:104px 1fr;gap:8px 10px;font-size:11px}.props dt{color:#6f7d88}.props dd{margin:0;color:#d5d9dc;overflow-wrap:anywhere}.decays{margin-top:18px}.decays h3{font:600 15px Georgia,serif;margin:0 0 8px}.decay{display:flex;justify-content:space-between;gap:12px;padding:8px 9px;border-bottom:1px solid #18232c;font-size:11px}.decay span:last-child{color:#8fa0ac}.mobile-tools{display:none}.sheet-handle{display:none}.group-label{font:700 17px Georgia,serif;fill:#dce6ee;paint-order:stroke;stroke:#071018;stroke-width:5px}.node text{font-family:Georgia,serif;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}.node circle{stroke-width:2;transition:r .12s,opacity .12s,filter .12s}.node.dim{opacity:.13}.node.related circle{filter:drop-shadow(0 0 11px rgba(255,255,255,.22))}.node.selected circle{stroke:#fff;stroke-width:3.5;filter:drop-shadow(0 0 14px rgba(255,255,255,.34))}.edge{fill:none;stroke-width:2;opacity:.18;vector-effect:non-scaling-stroke;transition:opacity .12s}.edge.active{opacity:.9;stroke-width:2.8}.edge.dim{opacity:.025}.group-hull{fill-opacity:.045;stroke-width:1.6;stroke-opacity:.52;vector-effect:non-scaling-stroke}.group-hull.hidden-group{opacity:.08}.group-node-hidden{display:none}.bridge-glow{filter:drop-shadow(0 0 12px rgba(255,198,64,.25))}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:58px minmax(0,1fr)}.top{grid-template-columns:auto minmax(0,1fr) auto}.brand{border-right:0;padding:0 10px}.brand h1{font-size:16px}.brand small{display:none}.search{padding:0 5px}.top-actions{border-left:0;padding:0 8px}.left{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(82vw,320px);padding-top:max(18px,env(safe-area-inset-top));transform:translateX(-103%);transition:.18s;box-shadow:25px 0 55px rgba(0,0,0,.45)}.left.open{transform:none}.canvas-wrap{grid-column:1;grid-row:2}.right{position:fixed;z-index:45;left:0;right:0;bottom:0;top:auto;max-height:min(72dvh,650px);border-left:0;border-top:1px solid #3a4650;border-radius:18px 18px 0 0;transform:translateY(105%);transition:.2s;box-shadow:0 -18px 55px rgba(0,0,0,.58);padding-bottom:env(safe-area-inset-bottom)}.right.open{transform:none}.details{padding:10px 16px 20px}.sheet-handle{display:block;width:42px;height:4px;margin:0 auto 10px;border-radius:3px;background:#46515a}.close-detail{display:block}.mobile-tools{display:inline-flex}.hide-phone{display:none}.hud{bottom:max(12px,env(safe-area-inset-bottom));left:10px}.tip{display:none}.resultcount{display:none}.searchbox input{padding-right:10px}.overlay{position:fixed;z-index:35;inset:0;display:none;background:rgba(0,0,0,.5)}.overlay.show{display:block}}
@media(max-width:520px){.brand h1{display:none}.back{width:38px}.top-actions{gap:4px}.iconbtn{padding:0 9px}.search{padding:0 2px}.searchbox input{font-size:12px}.props{grid-template-columns:96px 1fr}.symbol{font-size:34px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><button class="back" type="button" id="backBtn" aria-label="Назад">‹</button><div><h1>Карта частиц</h1><small id="datasetVersion">PDG 2024</small></div></div>
  <div class="search"><div class="searchbox"><input id="search" type="search" autocomplete="off" placeholder="π⁰, J/ψ, 443, proton, Σ⁻ …"><span id="resultCount" class="resultcount"></span></div></div>
  <div class="top-actions"><button id="filtersBtn" class="iconbtn mobile-tools" type="button">Фильтры</button><button id="centerBtn" class="iconbtn" type="button" title="Показать всю карту">⌖</button></div>
</header>
<aside id="filters" class="left">
  <div class="side-title">Отображение</div>
  <button class="filter active" type="button" data-group="all"><span class="dot" style="--c:#e64b65"></span>Все частицы</button>
  <div id="groupFilters"></div>
  <div class="sep"></div><div class="side-title">Связи</div>
  <label class="toggle">Сильное (QCD)<input type="checkbox" data-edge="strong" checked></label>
  <label class="toggle">Электромагнитное<input type="checkbox" data-edge="em" checked></label>
  <label class="toggle">Слабое<input type="checkbox" data-edge="weak" checked></label>
  <label class="toggle">Состав / семейство<input type="checkbox" data-edge="composition" checked></label>
  <label class="toggle">Смешивание<input type="checkbox" data-edge="mixing" checked></label>
  <div class="sep"></div><div class="legend"><b>Управление</b><br>Перетаскивание — двигать карту<br>Колесо / щипок — масштаб<br>Клик по узлу — свойства и локальные связи</div>
</aside>
<main id="canvasWrap" class="canvas-wrap">
  <svg id="world" viewBox="0 0 1800 1250" role="img" aria-label="Интерактивная карта частиц"><defs>
    <radialGradient id="nodeRose"><stop offset="0" stop-color="#ff8496"/><stop offset=".58" stop-color="#df274a"/><stop offset="1" stop-color="#7f0d25"/></radialGradient>
    <radialGradient id="nodeBlue"><stop offset="0" stop-color="#8cc1ff"/><stop offset=".58" stop-color="#286edb"/><stop offset="1" stop-color="#0d2e75"/></radialGradient>
    <radialGradient id="nodeGreen"><stop offset="0" stop-color="#8cf2a7"/><stop offset=".58" stop-color="#22b95e"/><stop offset="1" stop-color="#0a632e"/></radialGradient>
    <radialGradient id="nodePurple"><stop offset="0" stop-color="#c5a0ff"/><stop offset=".58" stop-color="#7841d9"/><stop offset="1" stop-color="#351178"/></radialGradient>
    <radialGradient id="nodeGold"><stop offset="0" stop-color="#ffe499"/><stop offset=".58" stop-color="#da9f20"/><stop offset="1" stop-color="#70420b"/></radialGradient>
    <radialGradient id="nodeOrange"><stop offset="0" stop-color="#ffba8e"/><stop offset=".58" stop-color="#db5c29"/><stop offset="1" stop-color="#77250c"/></radialGradient>
    <radialGradient id="nodeViolet"><stop offset="0" stop-color="#dea3ff"/><stop offset=".58" stop-color="#9a42d7"/><stop offset="1" stop-color="#4b126d"/></radialGradient>
    <marker id="arrowStrong" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#ff385a"/></marker>
    <marker id="arrowEm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#41a4ff"/></marker>
    <marker id="arrowWeak" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#43d97e"/></marker>
  </defs><g id="viewport"><g id="hulls"></g><g id="edges"></g><g id="nodes"></g></g></svg>
  <div class="hud"><button id="minus" type="button">−</button><button id="plus" type="button">+</button><button id="reset" type="button">100%</button></div><div class="tip">Выберите частицу — карта оставит только связанные переходы</div>
</main>
<aside id="details" class="right"><div class="details"><div class="sheet-handle"></div><div class="details-head"><div><div id="detailSymbol" class="symbol">π⁰</div><div id="detailName" class="name">neutral pion</div></div><button id="closeDetail" class="close-detail" type="button">×</button></div><div class="tabs"><button class="tab active" type="button">Свойства</button><button class="tab" type="button">Распады</button><button class="tab" type="button">Связи</button></div><dl id="props" class="props"></dl><div id="decays" class="decays"></div></div></aside>
<div id="overlay" class="overlay"></div>
</div>
<script src="particles.js?v=1"></script>
<script>
(()=>{'use strict';const D=window.PARTICLE_DATA;if(!D)return;const $=s=>document.querySelector(s),svg=$('#world'),vp=$('#viewport'),nodesG=$('#nodes'),edgesG=$('#edges'),hullsG=$('#hulls'),search=$('#search'),details=$('#details'),filters=$('#filters'),overlay=$('#overlay');$('#datasetVersion').textContent=D.version;const byId=new Map(D.particles.map(p=>[p.id,p]));const colors={rose:'#f44767',orange:'#f2783f',violet:'#bd55ff',gold:'#f2b83e',blue:'#3989ff',green:'#41d67c',purple:'#8f55ff'};const fills={rose:'url(#nodeRose)',orange:'url(#nodeOrange)',violet:'url(#nodeViolet)',gold:'url(#nodeGold)',blue:'url(#nodeBlue)',green:'url(#nodeGreen)',purple:'url(#nodePurple)'};const edgeColors={strong:'#ff385a',em:'#41a4ff',weak:'#43d97e',composition:'#a96bff',mixing:'#ffae65',family:'#bec8d2'};let selected='pi0',activeGroup='all',scale=1,tx=0,ty=0,drag=null,pinch=null,enabledEdges=new Set(['strong','em','weak','composition','mixing','family']);
function svgEl(n,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}
function render(){hullsG.replaceChildren();edgesG.replaceChildren();nodesG.replaceChildren();D.groups.forEach(g=>{const hull=svgEl('ellipse',{cx:g.cx,cy:g.cy,rx:g.rx,ry:g.ry,class:'group-hull',fill:colors[g.tone],stroke:colors[g.tone]});hullsG.append(hull);const t=svgEl('text',{x:g.cx,y:g.cy-g.ry+26,class:'group-label','text-anchor':'middle'});t.textContent=g.label;hullsG.append(t)});D.edges.forEach(e=>{const a=byId.get(e.from),b=byId.get(e.to);if(!a||!b)return;const path=svgEl('path',{class:'edge',stroke:edgeColors[e.kind]||'#9aa',d:`M${a.x},${a.y} Q${(a.x+b.x)/2 + (a.y-b.y)*.08},${(a.y+b.y)/2 + (b.x-a.x)*.08} ${b.x},${b.y}`,'data-id':e.id,'data-from':e.from,'data-to':e.to,'data-kind':e.kind});if(['strong','em','weak'].includes(e.kind))path.setAttribute('marker-end',`url(#arrow${e.kind==='strong'?'Strong':e.kind==='em'?'Em':'Weak'})`);if(e.kind==='mixing')path.setAttribute('stroke-dasharray','8 6');if(e.kind==='composition')path.setAttribute('stroke-dasharray','3 5');edgesG.append(path)});D.particles.forEach(p=>{const g=svgEl('g',{class:'node','data-id':p.id,role:'button',tabindex:'0'});const group=D.groups.find(x=>x.id===p.group);const c=svgEl('circle',{cx:p.x,cy:p.y,r:p.r,fill:fills[group?.tone||'rose'],stroke:colors[group?.tone||'rose']});const t=svgEl('text',{x:p.x,y:p.y,'font-size':Math.max(18,p.r*.78)});t.textContent=p.symbol;g.append(c,t);g.addEventListener('click',ev=>{ev.stopPropagation();select(p.id,true)});g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(p.id,true)}});nodesG.append(g)});applyState()}
function connected(id){const s=new Set([id]);D.edges.forEach(e=>{if(!enabledEdges.has(e.kind)&&e.kind!=='family')return;if(e.from===id)s.add(e.to);if(e.to===id)s.add(e.from)});return s}
function applyState(){const rel=selected?connected(selected):new Set();document.querySelectorAll('.node').forEach(n=>{const p=byId.get(n.dataset.id),groupOk=activeGroup==='all'||p.group===activeGroup;n.classList.toggle('group-node-hidden',!groupOk);n.classList.toggle('selected',n.dataset.id===selected);n.classList.toggle('related',rel.has(n.dataset.id)&&n.dataset.id!==selected);n.classList.toggle('dim',!!selected&&!rel.has(n.dataset.id))});document.querySelectorAll('.edge').forEach(e=>{const enabled=enabledEdges.has(e.dataset.kind)||e.dataset.kind==='family';const groupOk=activeGroup==='all'||byId.get(e.dataset.from)?.group===activeGroup||byId.get(e.dataset.to)?.group===activeGroup;const hit=selected&&(e.dataset.from===selected||e.dataset.to===selected);e.style.display=enabled&&groupOk?'':'none';e.classList.toggle('active',!!hit);e.classList.toggle('dim',!!selected&&!hit)});document.querySelectorAll('.group-hull').forEach((h,i)=>h.classList.toggle('hidden-group',activeGroup!=='all'&&D.groups[i]?.id!==activeGroup))}
function select(id,open=false){const p=byId.get(id);if(!p)return;selected=id;$('#detailSymbol').textContent=p.symbol;$('#detailName').textContent=`${p.name} · ${p.ru}`;const group=D.groups.find(g=>g.id===p.group);const rows=[['Символ',p.symbol],['Название',p.ru],['PDG ID',p.pdg],['Класс',group?.label||p.group],['Масса',p.mass],['Заряд',p.charge],['Спин J',p.spin],['Чётность P',p.parity||'—'],['C-чётность',p.cparity||'—'],['Кварковый состав',p.quarks],['Время жизни / ширина',p.lifetime]];$('#props').innerHTML=rows.map(([a,b])=>`<dt>${a}</dt><dd>${String(b??'—')}</dd>`).join('');$('#decays').innerHTML='<h3>Основные распады</h3>'+((p.decays||[]).length?p.decays.map(x=>`<div class="decay"><span>${x[0]}</span><span>${x[1]}</span></div>`).join(''):'<div class="decay"><span>Стабильна / каналы не указаны</span></div>');applyState();if(open&&matchMedia('(max-width:900px)').matches){details.classList.add('open');overlay.classList.add('show')} }
function applyTransform(){vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);$('#reset').textContent=Math.round(scale*100)+'%'}
function fit(){const box=$('#canvasWrap').getBoundingClientRect(),sx=box.width/1800,sy=box.height/1250;scale=Math.min(sx,sy)*.94;tx=(box.width-1800*scale)/2;ty=(box.height-1250*scale)/2;applyTransform()}
function zoomAt(f,cx,cy){const ns=Math.max(.22,Math.min(3.2,scale*f));const wx=(cx-tx)/scale,wy=(cy-ty)/scale;tx=cx-wx*ns;ty=cy-wy*ns;scale=ns;applyTransform()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;svg.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty};svg.classList.add('dragging')});svg.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;applyTransform()});const end=e=>{if(drag?.id===e.pointerId){drag=null;svg.classList.remove('dragging')}};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
let touches=new Map();svg.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const v=[...touches.values()];pinch={dist:Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),scale,tx,ty,cx:(v[0].x+v[1].x)/2,cy:(v[0].y+v[1].y)/2}}}});svg.addEventListener('pointermove',e=>{if(e.pointerType==='touch'&&touches.has(e.pointerId)){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&touches.size===2){const v=[...touches.values()],dist=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),r=svg.getBoundingClientRect();scale=pinch.scale;tx=pinch.tx;ty=pinch.ty;zoomAt(dist/pinch.dist,pinch.cx-r.left,pinch.cy-r.top)}}});['pointerup','pointercancel'].forEach(n=>svg.addEventListener(n,e=>{touches.delete(e.pointerId);if(touches.size<2)pinch=null}));
const groupFilters=$('#groupFilters');D.groups.forEach(g=>{const b=document.createElement('button');b.className='filter';b.dataset.group=g.id;b.innerHTML=`<span class="dot" style="--c:${colors[g.tone]}"></span>${g.label}`;groupFilters.append(b)});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{activeGroup=b.dataset.group;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));selected=null;applyState();if(activeGroup!=='all'){const g=D.groups.find(x=>x.id===activeGroup);if(g){const box=$('#canvasWrap').getBoundingClientRect();scale=Math.min(box.width/(g.rx*2.5),box.height/(g.ry*2.5));tx=box.width/2-g.cx*scale;ty=box.height/2-g.cy*scale;applyTransform()}}if(matchMedia('(max-width:900px)').matches){filters.classList.remove('open');overlay.classList.remove('show')}});document.querySelectorAll('[data-edge]').forEach(i=>i.onchange=()=>{i.checked?enabledEdges.add(i.dataset.edge):enabledEdges.delete(i.dataset.edge);applyState()});
search.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase('ru').replace(/ё/g,'е');if(!q){$('#resultCount').textContent='';selected=null;applyState();return}const hits=D.particles.filter(p=>[p.symbol,p.name,p.ru,p.pdg,...(p.aliases||[])].join(' ').toLocaleLowerCase('ru').replace(/ё/g,'е').includes(q));$('#resultCount').textContent=hits.length?hits.length+' найдено':'0';if(hits.length){const p=hits[0];select(p.id,false);const box=$('#canvasWrap').getBoundingClientRect();scale=Math.max(scale,.85);tx=box.width/2-p.x*scale;ty=box.height/2-p.y*scale;applyTransform()}});$('#plus').onclick=()=>zoomAt(1.2,$('#canvasWrap').clientWidth/2,$('#canvasWrap').clientHeight/2);$('#minus').onclick=()=>zoomAt(.83,$('#canvasWrap').clientWidth/2,$('#canvasWrap').clientHeight/2);$('#reset').onclick=fit;$('#centerBtn').onclick=fit;$('#filtersBtn').onclick=()=>{filters.classList.add('open');overlay.classList.add('show')};$('#closeDetail').onclick=()=>{details.classList.remove('open');overlay.classList.remove('show')};overlay.onclick=()=>{filters.classList.remove('open');details.classList.remove('open');overlay.classList.remove('show')};$('#backBtn').onclick=()=>{if(history.length>1)history.back();else location.href='../#subject=%D0%91%D0%B0%D0%B7%D0%B0'};window.addEventListener('resize',()=>{if(innerWidth>900)details.classList.remove('open')});render();fit();select('pi0',false)})();
</script>
</body></html>
