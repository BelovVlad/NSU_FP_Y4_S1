<title>PDF · ФФ НГУ</title>
<style>
:root{--bg:#0d1015;--pdf-bg:#1e1e1e;--bar:#12161c;--panel:#171c23;--line:#2b323d;--text:#eef1f5;--muted:#8993a1;--accent:#d45d68;--accent-soft:rgba(212,93,104,.14);--outlineW:320px}

body.theme-na19{
  --bg:#071112;--pdf-bg:#0a1718;--bar:#0c1a1b;--panel:#102123;--line:#31565a;
  --text:#eff8f6;--muted:#88aaa9;--accent:#53c8c5;--accent-soft:rgba(83,200,197,.14)
}
body.theme-na19x{
  --bg:#171b1e;--pdf-bg:#20262a;--bar:#252b30;--panel:#30373d;--line:#68757d;
  --text:#ffffff;--muted:#b9c3c8;--accent:#f7fbfd;--accent-soft:rgba(247,251,253,.14)
}
body.theme-na19 .search-panel,body.theme-na19 .outline-panel,body.theme-na19 .mobile-nav,body.theme-na19 .loading{
  background:rgba(12,26,27,.98)
}
body.theme-na19x .search-panel,body.theme-na19x .outline-panel,body.theme-na19x .mobile-nav,body.theme-na19x .loading{
  background:rgba(37,43,48,.98)
}
body.theme-na19 .page-input,body.theme-na19 .search-input,body.theme-na19 .zoom-edit{background:#0b1819}
body.theme-na19x .page-input,body.theme-na19x .search-input,body.theme-na19x .zoom-edit{background:#2d3439}
body.theme-na19 .outline-link.depth-0{background:#102123;border-color:#31565a}
body.theme-na19x .outline-link.depth-0{background:#30373d;border-color:#68757d}
body.theme-na19 .outline-link.depth-1{border-left-color:#396368;background:rgba(83,200,197,.025)}
body.theme-na19x .outline-link.depth-1{border-left-color:#78858d;background:rgba(255,255,255,.025)}

/* Native PWA/fullscreen backdrop */
html:fullscreen,html:fullscreen body{background:var(--bg)!important}
html:fullscreen::backdrop{background:var(--bg)!important}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.search-panel{position:fixed;z-index:35;top:58px;left:0;right:0;height:52px;display:none;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line);background:rgba(18,22,28,.98);box-shadow:0 6px 18px rgba(0,0,0,.22)}.search-panel.open{display:flex}.search-input{height:36px;min-width:120px;max-width:520px;flex:1;border:1px solid var(--line);border-radius:9px;background:#0f1318;color:var(--text);padding:0 11px;outline:none}.search-status{min-width:125px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search-panel .btn{height:36px}.search-close{font-size:18px}
.outline-panel{position:fixed;z-index:34;left:0;top:58px;bottom:0;width:var(--outlineW);display:flex;flex-direction:column;border-right:1px solid var(--line);background:rgba(18,22,28,.985);box-shadow:14px 0 34px rgba(0,0,0,.34);transform:translateX(-102%);transition:transform .18s ease}.outline-panel.open{transform:translateX(0)}.outline-head{height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}.outline-title{font-size:14px;font-weight:800}.outline-tree{min-height:0;flex:1;overflow:auto;padding:9px 8px 18px}.outline-empty{padding:18px 12px;color:var(--muted);font-size:13px;line-height:1.5}.outline-row{position:relative}.outline-link{width:100%;min-height:37px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;margin:1px 0;padding:7px 9px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;text-decoration:none;cursor:pointer;transition:background .12s ease,border-color .12s ease,color .12s ease}.outline-link:hover{background:rgba(255,255,255,.045)}.outline-link.active{background:var(--accent-soft)!important;box-shadow:inset 4px 0 0 var(--accent);color:var(--text)}.outline-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.outline-page{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}.outline-link.depth-0{min-height:44px;margin:8px 0 4px;padding:9px 10px;border:1px solid #313944;background:#1a2028}.outline-link.depth-0 .outline-label{font-size:13.5px;font-weight:800;letter-spacing:-.01em}.outline-link.depth-0 .outline-page{font-size:11px;font-weight:700;color:#aab3c0}.outline-link.depth-1{margin-left:10px;width:calc(100% - 10px);padding:8px 9px 8px 13px;border-left:2px solid #46505d;background:rgba(255,255,255,.018)}.outline-link.depth-1 .outline-label{font-size:12.5px;font-weight:680}.outline-link.depth-1 .outline-label::before{content:'› ';color:#768292;font-weight:900}.outline-link.depth-2{margin-left:24px;width:calc(100% - 24px);padding:7px 9px 7px 12px;border-left:1px solid #39424d;color:#d4dae2}.outline-link.depth-2 .outline-label{font-size:12px;font-weight:560}.outline-link.depth-2 .outline-label::before{content:'· ';color:#707b89;font-weight:900}.outline-link.depth-3{margin-left:38px;width:calc(100% - 38px);padding:6px 9px 6px 11px;border-left:1px dashed #343c46;color:#b9c1cc}.outline-link.depth-3 .outline-label{font-size:11.5px;font-weight:500}.outline-link.depth-3 .outline-label::before{content:'– ';color:#697482}.outline-backdrop{display:none}
.viewer{position:absolute;inset:58px 0 0;overflow:auto;background:var(--pdf-bg);transition:left .18s ease}.viewer{left:0}body.outline-open .viewer{left:var(--outlineW)}body.search-open .viewer{top:110px}.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:24px}.canvas-wrap{position:relative;line-height:0;box-shadow:0 8px 28px rgba(0,0,0,.5)}canvas{display:block;max-width:none;background:transparent;transition:filter .16s ease,background-color .16s ease;will-change:filter}
body.pdf-tone-black canvas{filter:invert(.92) hue-rotate(180deg) brightness(.94) contrast(.92) saturate(.88);background:#15191c}
body.pdf-tone-mine canvas{filter:url(#nsuPaletteFilter) contrast(.98) saturate(.94);background:#293133}
body.pdf-tone-mine .canvas-wrap{background:#293133}
.tone-switch{height:36px;display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#0f151b;overflow:hidden;flex:none}
.tone-switch[hidden]{display:none!important}
.canvas-wrap[hidden]{display:none}
.tone-btn{width:31px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.tone-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tone-btn.active{background:var(--panel);color:var(--cream,#ead4b7);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 34%,var(--line)),0 2px 8px rgba(0,0,0,.16)}
.tone-icon{width:16px;height:16px;display:block}
.tone-icon *{vector-effect:non-scaling-stroke}
.tone-icon-mine .mine-left{fill:#ff8fa3}.tone-icon-mine .mine-right{fill:#90e0ef}.tone-icon-mine .mine-line{stroke:#fff;stroke-width:1.2;fill:none;opacity:.88}
.pdf-tone-filters{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.highlight-layer,.annotation-layer{position:absolute;left:0;top:0;overflow:hidden}.highlight-layer{pointer-events:none}.annotation-layer{pointer-events:none;z-index:4}.pdf-link{position:absolute;display:block;pointer-events:auto;cursor:pointer;background:transparent;border:0;border-radius:2px;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:rgba(212,93,104,.18)}.pdf-link:hover{background:rgba(212,93,104,.10);box-shadow:inset 0 0 0 1px rgba(212,93,104,.26)}.pdf-link:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.pdf-link:active{background:rgba(212,93,104,.18)}.search-mark{position:absolute;background:rgba(255,210,64,.38);border:1px solid rgba(255,210,64,.62);border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.loading{position:fixed;left:50%;top:82px;z-index:50;transform:translateX(-50%);display:none;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(18,22,28,.95);color:var(--muted);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.28)}body.search-open .loading{top:134px}.loading.show{display:flex}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse .8s infinite alternate}@keyframes pulse{to{opacity:.3}}.error{max-width:680px;margin:80px auto;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--muted);line-height:1.6}.error strong{color:var(--text)}
.mobile-nav{display:none}
.page-jump{display:none}
/* Selectable PDF text layer */
.text-layer{position:absolute;inset:0;z-index:3;overflow:hidden;line-height:1;pointer-events:auto;user-select:text;-webkit-user-select:text}
.text-layer span{position:absolute;transform-origin:0 0;color:transparent;white-space:pre;cursor:text}
.text-layer ::selection{background:rgba(70,145,255,.34)}
.highlight-layer{z-index:2}
.annotation-layer{z-index:4}

/* Optional continuous scroll */
.continuous-pages{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;padding:0 0 28px}
.continuous-page{position:relative;min-width:120px;min-height:160px;background:var(--pdf-bg);box-shadow:0 8px 28px rgba(0,0,0,.5);line-height:0;contain:layout paint}
.continuous-page canvas{display:block}
.continuous-page .text-layer{z-index:3}
body.pdf-tone-black .continuous-page canvas{filter:invert(.92) hue-rotate(180deg) brightness(.94) contrast(.92) saturate(.88)}
body.pdf-tone-mine .continuous-page canvas{filter:url(#nsuPaletteFilter) contrast(.98) saturate(.94)}
body.continuous-mode .stage{display:block;padding:18px 20px}
body.continuous-mode .canvas-wrap{display:none!important}
.view-mode-btn.active{border-color:var(--accent);background:var(--accent-soft)}

</style>

<body>
<svg class="pdf-tone-filters" aria-hidden="true" focusable="false">
  <defs>
    <filter id="nsuPaletteFilter" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <!-- First rotate hues so the second, inverse-like mapping keeps coloured figures recognisable. -->
      <feColorMatrix type="hueRotate" values="180" result="hue"/>
      <!-- Exact grayscale endpoints: black -> #FFFFFF, white -> #293133 (colors.tex: pag/rbg). -->
      <feColorMatrix in="hue" type="matrix" values="
        -0.839216 0 0 0 1
        0 -0.807843 0 0 1
        0 0 -0.800000 0 1
        0 0 0 1 0"/>
    </filter>
  </defs>
</svg>
<header class="toolbar" aria-label="Управление документом">

  </div>
  <div class="reader-actions">
    <button id="outlineToggle" class="btn icon" type="button" title="Оглавление" aria-label="Оглавление" aria-expanded="false" aria-controls="outlinePanel"><span data-viewer-icon="outline"></span></button>
    <button id="searchToggle" class="btn icon" type="button" title="Поиск по PDF" aria-label="Поиск по PDF" aria-expanded="false" aria-controls="searchPanel"><span data-viewer-icon="search"></span></button>

      <label class="control-label" for="page">Страница</label>

      <label class="zoom-edit" title="Масштаб от 35 до 400%"><input id="zoom" class="zoom-input" type="number" min="35" max="400" step="1" value="100" inputmode="numeric" aria-label="Масштаб в процентах"><span>%</span></label>
      <button id="fit" class="btn rail-button" type="button" title="По ширине страницы" aria-label="По ширине страницы"><span data-viewer-icon="fit"></span><span class="tool-caption">По ширине</span></button>

    <div class="tone-switch" id="toneSwitch" role="group" aria-label="Цветовой режим PDF" hidden>

        <svg class="tone-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.2A8.7 8.7 0 0 1 8.8 3.8 8.8 8.8 0 1 0 20.2 15.2Z" fill="currentColor"/></svg>

    <button id="saveOffline" class="btn rail-button" type="button" title="Сохранить весь PDF на устройстве (до 150 МБ)" disabled>Без интернета</button>

  </div>
</header>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

const OWNER='BelovVlad',REPO='NSU_FP_Y4_S1',BRANCH='main';
const params=new URLSearchParams(location.search);
function currentMaterialPath(path){
  if(!path)return path;
  const parts=path.split('/');
  const labNames={
    'lab_1_2026.pdf':'Лаба 1 — Ферритовый циркулятор.pdf',
    'lab_2.pdf':'Лаба 2 — Волноводный направленный ответвитель.pdf',
    'lab_3_2010.pdf':'Лаба 3 — Измерение мощности в диапазоне СВЧ.pdf',
    'lab_4.pdf':'Лаба 4 — Измерение сопротивлений волноводной измерительной линией.pdf',
    'lab_5.pdf':'Лаба 5 — Взаимные четырёхполюсники без потерь.pdf',
    'lab_6_2026.pdf':'Лаба 6 — Волноводные диафрагмы. Измерения импедометром.pdf',
    'lab_7_20206.pdf':'Лаба 7 — Добротность объёмного резонатора.pdf',
    'lab_8.pdf':'Лаба 8 — Поля в объёмном резонаторе. Метод малого возмущающего тела.pdf',
    'lab_9_2010.pdf':'Лаба 9 — Рупорные и линзовые антенны.pdf'
  };
  if(parts.length===3&&parts[0]==='СВЧ'&&parts[1]==='02_Литература'&&Object.hasOwn(labNames,parts[2])){
    return `${parts[0]}/${parts[1]}/${labNames[parts[2]]}`;
  }
  const kind=parts[1]?.match(/^\d+_(Лекции|Семинары|Месячные_задания)$/)?.[1];
  if(parts.length===3&&parts[2]==='final.pdf'&&kind&&['ОВФ','ТДиСФ','ФКСВ','ФЭЧ','ФиХАиМ'].includes(parts[0])){
    return `${parts[0]}/${parts[1]}/${parts[0]}_${kind}.pdf`;
  }
  return path;
}
const raw=currentMaterialPath(params.get('file'));
const subject=params.get('subject')||'';
const titleParam=params.get('title')||'';
const pageParam=Number(params.get('page')||0);
const findParam=params.get('find')||'';
const versionParam=params.get('v')||'';
const themeParam=params.get('theme')||'';
const embedParam=params.get('embed')==='1';
if(embedParam)document.body.classList.add('embed-view');
const landscapePhoneQuery=window.matchMedia('(orientation:landscape) and (max-height:600px) and (pointer:coarse)');
const portraitPhoneQuery=window.matchMedia('(orientation:portrait) and (max-width:760px) and (pointer:coarse)');
const phoneStripQuery=window.matchMedia('(orientation:portrait) and (max-width:760px) and (pointer:coarse), (orientation:landscape) and (max-height:600px) and (pointer:coarse)');
const compactQuery=window.matchMedia(embedParam

  if(q!==searchQuery){
    searchQuery=q;
    searchPage=pageNum;

    searchSource='auto';
  }

  searchBusy=true;

  searchStatus.textContent='Ищу…';

  try{
    await loadIndexedSearchPages();
    if(token!==searchToken)return;

    let sources;
    if(searchSource==='index'||searchSource==='pdf')sources=[searchSource];
    else sources=indexedSearchAvailable?['index','pdf']:['pdf'];

    let found=null;
    for(const source of sources){
      found=await scanSearchSource(direction,q,token,source);
      if(token!==searchToken)return;
      if(found)break;

      searchSource=found.source;
      searchPage=found.page;
      searchOccurrence=found.occ;
      pageNum=found.page;
      await renderPage();
      if(token!==searchToken)return;
      searchStatus.textContent=`${found.occ+1}/${found.count} на стр. ${found.page} · ${found.source==='index'?'индекс':'PDF'}`;

  }
  zoomLabel.value=String(Math.round(wheelZoomTargetScale*100));
  clearTimeout(wheelZoomTimer);
  wheelZoomTimer=setTimeout(finishWheelZoom,90);
}
window.addEventListener('wheel',handleWheelZoom,{passive:false,capture:true});

function touchDistance(touches){const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;return Math.hypot(dx,dy)}
function touchMidpoint(touches){return{x:(touches[0].clientX+touches[1].clientX)/2,y:(touches[0].clientY+touches[1].clientY)/2}}
let pinchState=null,pinchPreviewRaf=0;
function paintPinchPreview(){
  pinchPreviewRaf=0;
  if(!pinchState)return;
  const ratio=pinchState.targetScale/pinchState.startScale;
  if(pinchState.continuous&&continuousRoot)continuousRoot.style.transform='scale('+ratio+')';
  else canvasWrap.style.transform='scale('+ratio+')';
}
viewer.addEventListener('touchstart',e=>{
  if(!pdf||e.touches.length!==2)return;
  e.preventDefault();closePageJump();fitWidth=false;gestureActive=true;lockReaderChrome(1000);
  const mid=touchMidpoint(e.touches),distance=touchDistance(e.touches);
  if(distance<8)return;

  if(continuousMode&&continuousRoot){
    const rect=continuousRoot.getBoundingClientRect();
    const anchor=continuousAnchorFromClient(mid.y);
    pinchState={startDistance:distance,startScale:scale,targetScale:scale,anchor,continuous:true};
    continuousRoot.classList.add('pinch-preview');
    continuousRoot.style.transformOrigin=(mid.x-rect.left)+'px '+(mid.y-rect.top)+'px';
    return;
  }

  const rect=canvasWrap.getBoundingClientRect();
  if(rect.width<1||rect.height<1)return;
  pinchState={
    startDistance:distance,startScale:scale,targetScale:scale,continuous:false,
    anchor:{x:Math.max(0,Math.min(1,(mid.x-rect.left)/rect.width)),y:Math.max(0,Math.min(1,(mid.y-rect.top)/rect.height)),clientX:mid.x,clientY:mid.y}
  };
  canvasWrap.classList.add('pinch-preview');
  canvasWrap.style.transformOrigin=(mid.x-rect.left)+'px '+(mid.y-rect.top)+'px';
},{passive:false});
viewer.addEventListener('touchmove',e=>{
  if(!pinchState||e.touches.length<2)return;
  e.preventDefault();
  const distance=touchDistance(e.touches);if(distance<8)return;
  pinchState.targetScale=clampScale(pinchState.startScale*distance/pinchState.startDistance);
  zoomLabel.value=String(Math.round(pinchState.targetScale*100));
  if(!pinchPreviewRaf)pinchPreviewRaf=requestAnimationFrame(paintPinchPreview);
},{passive:false});
function finishPinch(e){
  if(!pinchState||(e.touches&&e.touches.length>=2))return;
  const nextScale=pinchState.targetScale,anchor=pinchState.anchor,wasContinuous=pinchState.continuous;
  pinchState=null;
  if(pinchPreviewRaf){cancelAnimationFrame(pinchPreviewRaf);pinchPreviewRaf=0}
  canvasWrap.classList.remove('pinch-preview');canvasWrap.style.transform='';canvasWrap.style.transformOrigin='';
  continuousRoot?.classList.remove('pinch-preview');
  if(continuousRoot){continuousRoot.style.transform='';continuousRoot.style.transformOrigin=''}
  gestureActive=false;lockReaderChrome(700);
  if(Math.abs(nextScale-scale)<.005){updateControls();return}
  if(wasContinuous&&continuousMode)commitContinuousScale(nextScale,anchor,false);
  else{scale=clampScale(nextScale);updateControls();void renderPage({anchor})}
}
viewer.addEventListener('touchend',finishPinch,{passive:true});
viewer.addEventListener('touchcancel',finishPinch,{passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',()=>{if(pageJump.classList.contains('open'))syncKeyboardOffset()});
  window.visualViewport.addEventListener('scroll',()=>{if(pageJump.classList.contains('open'))syncKeyboardOffset()});
}
window.addEventListener('orientationchange',()=>{
  lockReaderChrome(1100);
  closeTools();
  closePageJump();
  setReaderChromeHidden(false);
  setTimeout(()=>{if(pageJump.classList.contains('open'))syncKeyboardOffset()},120);
});
// A taller embedded preview needs no new canvas: keep its page and scroll position.
// Width changes still require fitting the document again.
let resizeTimer;
let viewerWidth=viewer.clientWidth;
new ResizeObserver(()=>{
  if(viewer.clientWidth===viewerWidth)return;
  viewerWidth=viewer.clientWidth;
  lockReaderChrome(900);
  if(!pdf||!fitWidth||gestureActive)return;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(!pdf||!fitWidth||gestureActive)return;
    lockReaderChrome(650);
    if(continuousMode)void fitContinuousToWidth(continuousCenterAnchor());
    else void renderPage();
  },260);
}).observe(viewer);
open();
</script>
</body>
</html>
