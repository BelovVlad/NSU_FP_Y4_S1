<body>
<header class="toolbar">
  <div class="left"><button id="back" class="btn" type="button">← <span class="back-text">Материалы</span></button><button id="outlineToggle" class="btn icon" type="button" title="Оглавление" aria-label="Оглавление"><span class="outline-icon">☰</span></button><div id="title" class="title">PDF</div></div>
  <div class="controls">
    <button id="prev" class="btn icon" type="button" title="Предыдущая страница">‹</button>
    <input id="page" class="page-input" type="number" min="1" value="1" aria-label="Номер страницы">
    <span id="total" class="page-total">/ —</span>
    <button id="next" class="btn icon" type="button" title="Следующая страница">›</button>
    <button id="zoomOut" class="btn icon" type="button" title="Уменьшить">−</button>
    <span id="zoom" class="zoom-label">100%</span>
    <button id="zoomIn" class="btn icon" type="button" title="Увеличить">+</button>
    <button id="fit" class="btn" type="button">По ширине</button>
  </div>
  <div class="right"><button id="searchToggle" class="btn icon search-toggle" type="button" title="Поиск по PDF" aria-label="Поиск по PDF"><span class="search-icon">⌕</span></button><a id="direct" class="btn direct-link" href="#" target="_blank" rel="noopener">Файл ↗</a></div>
</header>

<div id="searchPanel" class="search-panel" role="search">
  <input id="searchInput" class="search-input" type="search" autocomplete="off" placeholder="Поиск по PDF…" aria-label="Поиск по PDF">
  <button id="searchPrev" class="btn icon search-prev" type="button" title="Предыдущее совпадение">↑</button>
  <button id="searchNext" class="btn icon search-next" type="button" title="Следующее совпадение">↓</button>
  <span id="searchStatus" class="search-status">Enter — найти</span>
  <button id="searchClose" class="btn icon search-close" type="button" title="Закрыть поиск">×</button>
</div>

<aside id="outlinePanel" class="outline-panel" aria-label="Оглавление PDF">
  <div class="outline-head"><span class="outline-title">Оглавление</span><button id="outlineClose" class="btn icon" type="button" aria-label="Закрыть оглавление">×</button></div>
  <div id="outlineTree" class="outline-tree"><div class="outline-empty">Оглавление загрузится при открытии панели.</div></div>
</aside>
<div id="outlineBackdrop" class="outline-backdrop"></div>

<div id="loading" class="loading"><span class="dot"></span><span id="loadingText">Загрузка страницы…</span></div>
<main id="viewer" class="viewer"><div id="stage" class="stage"><div class="canvas-wrap"><canvas id="canvas"></canvas><div id="highlightLayer" class="highlight-layer"></div><div id="annotationLayer" class="annotation-layer"></div></div></div></main>

<nav class="mobile-nav" aria-label="Навигация по PDF">
  <button id="mPrev" class="m-btn" type="button" title="Предыдущая страница">‹</button>
  <button id="mPageInfo" class="m-page-info" type="button" title="Перейти к странице" aria-label="Перейти к странице" aria-expanded="false">1 / —</button>
  <button id="mNext" class="m-btn" type="button" title="Следующая страница">›</button>
</nav>
<div id="pageJump" class="page-jump" aria-hidden="true">
  <form id="pageJumpForm" class="page-jump-form">
    <span class="page-jump-label">Стр.</span>
    <input id="pageJumpInput" class="page-jump-input" type="number" min="1" value="1" inputmode="numeric" aria-label="Номер страницы">
    <span id="pageJumpTotal" class="page-jump-total">/ —</span>
    <button class="page-jump-go" type="submit">Перейти</button>
    <button id="pageJumpClose" class="page-jump-close" type="button" aria-label="Закрыть выбор страницы">×</button>
  </form>
</div>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

const OWNER='BelovVlad',REPO='NSU_FP_Y4_S1',BRANCH='main';
const params=new URLSearchParams(location.search);
function currentMaterialPath(path){
  if(!path)return path;
  const parts=path.split('/');
  const labNames={
    'lab_1_2026.pdf':'Лаба 1 — Ферритовый циркулятор.pdf',
    'lab_2.pdf':'Лаба 2 — Волноводный направленный ответвитель.pdf',
    'lab_3_2010.pdf':'Лаба 3 — Измерение мощности в диапазоне СВЧ.pdf',
    'lab_4.pdf':'Лаба 4 — Измерение сопротивлений волноводной измерительной линией.pdf',
    'lab_5.pdf':'Лаба 5 — Взаимные четырёхполюсники без потерь.pdf',
    'lab_6_2026.pdf':'Лаба 6 — Волноводные диафрагмы. Измерения импедометром.pdf',
    'lab_7_20206.pdf':'Лаба 7 — Добротность объёмного резонатора.pdf',
    'lab_8.pdf':'Лаба 8 — Поля в объёмном резонаторе. Метод малого возмущающего тела.pdf',
    'lab_9_2010.pdf':'Лаба 9 — Рупорные и линзовые антенны.pdf'
  };
  if(parts.length===3&&parts[0]==='СВЧ'&&parts[1]==='02_Литература'&&Object.hasOwn(labNames,parts[2])){
    return `${parts[0]}/${parts[1]}/${labNames[parts[2]]}`;
  }
  const kind=parts[1]?.match(/^\d+_(Лекции|Семинары|Месячные_задания)$/)?.[1];
  if(parts.length===3&&parts[2]==='final.pdf'&&kind&&['ОВФ','ТДиСФ','ФКСВ','ФЭЧ','ФиХАиМ'].includes(parts[0])){
    return `${parts[0]}/${parts[1]}/${parts[0]}_${kind}.pdf`;
  }
  return path;
}
const raw=currentMaterialPath(params.get('file'));
const subject=params.get('subject')||'';

const pageCache=new Map(),warmedPages=new Set(),textCache=new Map(),annotationCache=new Map();
let indexedSearchPromise=null,indexedSearchPages=null,indexedSearchAvailable=false;

}

function closeSearch(){searchToken++;searchBusy=false;searchPanel.classList.remove('open');document.body.classList.remove('search-open');searchStatus.textContent='Enter — найти';clearHighlights()}

async function resolvePdfUrl(path){
  const local=new URL('../../'+path.replace(/^\/+/,''),location.href);if(versionParam)local.searchParams.set('v',versionParam);const localUrl=local.href;
  try{
    const head=await fetch(localUrl,{method:'HEAD',cache:'no-store'});

    if(size>0&&size<1024){
      const text=await fetch(localUrl,{cache:'no-store'}).then(r=>r.text());
      if(text.startsWith('version https://git-lfs.github.com/spec/v1')){const media=new URL(`https://media.githubusercontent.com/media/${OWNER}/${REPO}/${BRANCH}/${encPath(path)}`);if(versionParam)media.searchParams.set('v',versionParam);return media.href}
    }
  }catch{}

}

async function getCachedPage(n){if(pageCache.has(n))return pageCache.get(n);const page=await pdf.getPage(n);pageCache.set(n,page);return page}
function trimPageCache(center){for(const [n,page] of pageCache){if(Math.abs(n-center)>1){try{page.cleanup()}catch{}pageCache.delete(n);warmedPages.delete(n)}}}

async function loadIndexedSearchPages(){
  if(indexedSearchPages)return indexedSearchPages;
  if(indexedSearchPromise)return indexedSearchPromise;

  indexedSearchPromise=(async()=>{
    try{
      const manifestUrl=new URL('../search-index/manifest.json',location.href);
      const manifest=await fetch(manifestUrl,{cache:'force-cache'}).then(r=>{
        if(!r.ok)throw new Error('search manifest '+r.status);
        return r.json();
      });

      const rawSubject=(raw||'').split('/')[0]||'';
      const wantedSubject=subject||rawSubject;
      let shards=(manifest.shards||[]).slice();
      const preferred=shards.filter(x=>x.subject===wantedSubject);
      if(preferred.length){
        shards=[...preferred,...shards.filter(x=>x.subject!==wantedSubject)];
      }

      for(const shard of shards){
        const shardUrl=new URL('../search-index/'+shard.file,location.href);
        const data=await fetch(shardUrl,{cache:'force-cache'}).then(r=>{
          if(!r.ok)throw new Error('search shard '+r.status);
          return r.json();
        });
        const record=(data.records||[]).find(r=>r.path===raw);
        if(!record)continue;

        const pages=new Map();
        for(const p of record.pages||[]){
          const n=Number(p.n);
          if(!Number.isFinite(n)||n<1)continue;
          pages.set(n,normalizeText(p.t||''));
        }
        indexedSearchPages=pages;
        indexedSearchAvailable=pages.size>0;
        return pages;
      }
    }catch(err){
      console.warn('Indexed PDF search unavailable, falling back to PDF text layer.',err);
    }

    indexedSearchPages=new Map();
    indexedSearchAvailable=false;
    return indexedSearchPages;
  })();

  return indexedSearchPromise;
}

async function getSearchTextForPage(n){
  const pages=await loadIndexedSearchPages();
  if(pages.has(n))return pages.get(n);
  const data=await getPageSearchData(n);
  return data.text;
}

async function getPageSearchData(n){
  if(textCache.has(n))return textCache.get(n);
  const cached=pageCache.get(n),page=cached||await pdf.getPage(n),content=await page.getTextContent(),items=content.items.filter(i=>i.str);
  const data={text:normalizeText(items.map(i=>i.str).join(' ')),items};textCache.set(n,data);
  if(!cached&&Math.abs(n-pageNum)>1){try{page.cleanup()}catch{}}
  return data;
}

async function drawSearchHighlights(page,viewport){
  clearHighlights();if(!searchQuery||searchPage!==pageNum)return;
  try{
    const data=await getPageSearchData(pageNum);if(searchPage!==pageNum)return;
    highlightLayer.style.width=`${viewport.width}px`;highlightLayer.style.height=`${viewport.height}px`;
    const tokens=searchQuery.split(' ').filter(t=>t.length>1);
    for(const item of data.items){
      const s=normalizeText(item.str);if(!s)continue;
      const hit=s.includes(searchQuery)||(searchQuery.includes(' ')&&tokens.some(t=>s.includes(t)));if(!hit)continue;
      const tx=pdfjsLib.Util.transform(viewport.transform,item.transform),fontHeight=Math.max(2,Math.hypot(tx[2],tx[3])),width=Math.max(3,(item.width||0)*viewport.scale),angle=Math.atan2(tx[1],tx[0]);
      const mark=document.createElement('div');mark.className='search-mark';mark.style.left=`${tx[4]}px`;mark.style.top=`${tx[5]-fontHeight}px`;mark.style.width=`${width}px`;mark.style.height=`${fontHeight}px`;mark.style.transformOrigin='0 0';if(Math.abs(angle)>.001)mark.style.transform=`rotate(${angle}rad)`;highlightLayer.appendChild(mark);
    }

}

async function getPageAnnotations(page){
  if(annotationCache.has(page.pageNumber))return annotationCache.get(page.pageNumber);
  const annotations=await page.getAnnotations({intent:'display'});annotationCache.set(page.pageNumber,annotations);return annotations;
}

async function destinationPage(dest){
  if(!pdf||!dest)return null;
  let explicit=dest;
  if(typeof explicit==='string')explicit=await pdf.getDestination(explicit);
  if(!Array.isArray(explicit)||!explicit.length)return null;
  const ref=explicit[0];
  if(Number.isInteger(ref))return Math.max(1,Math.min(pdf.numPages,ref+1));
  if(ref&&typeof ref==='object'){
    try{return (await pdf.getPageIndex(ref))+1}catch{return null}
  }
  return null;
}

async function followInternalLink(dest){const n=await destinationPage(dest);if(!n)return;pageNum=n;await renderPage()}
function followNamedAction(action){if(!pdf)return;if(action==='NextPage')return go(1);if(action==='PrevPage')return go(-1);if(action==='FirstPage'){pageNum=1;return renderPage()}if(action==='LastPage'){pageNum=pdf.numPages;return renderPage()}}

async function renderAnnotations(page,viewport){
  clearAnnotations();annotationLayer.style.width=`${viewport.width}px`;annotationLayer.style.height=`${viewport.height}px`;
  let annotations=[];try{annotations=await getPageAnnotations(page)}catch{return}
  if(page.pageNumber!==pageNum)return;
  for(const a of annotations){

    const rect=viewport.convertToViewportRectangle(a.rect),left=Math.min(rect[0],rect[2]),top=Math.min(rect[1],rect[3]),width=Math.abs(rect[0]-rect[2]),height=Math.abs(rect[1]-rect[3]);

    const link=document.createElement('a');link.className='pdf-link';link.style.left=`${left}px`;link.style.top=`${top}px`;link.style.width=`${width}px`;link.style.height=`${height}px`;link.setAttribute('aria-label','Перейти по ссылке');
    if(a.url){link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';link.title=a.url}
    else if(a.dest){link.href='#';link.title='Перейти к разделу';link.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();void followInternalLink(a.dest)})}
    else if(a.action){link.href='#';link.title='Перейти';link.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();followNamedAction(a.action)})}

function renderOutlineNodes(items,container,depth=0){

    const entry={button:link,page:null};outlineEntries.push(entry);
    if(item.url){link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';page.textContent='↗'}

async function loadOutline(){outlineLoaded=true;outlineEntries=[];outlineTree.innerHTML='<div class="outline-empty">Загружаю структуру документа…</div>';try{const items=await pdf.getOutline();outlineTree.replaceChildren();if(!items?.length){outlineTree.innerHTML='<div class="outline-empty">В этом PDF нет встроенных закладок. Кликабельные ссылки внутри самого PDF при этом продолжают работать.</div>';return}renderOutlineNodes(items,outlineTree,0);updateOutlineActive()}catch{outlineTree.innerHTML='<div class="outline-empty">Не удалось прочитать встроенное оглавление.</div>'}}

async function scanSearchSource(direction,q,token,source){
  let n=searchPage||pageNum,first=true;
  for(let checked=0;checked<pdf.numPages;checked++){
    let text='';
    if(source==='index'){
      const pages=await loadIndexedSearchPages();
      text=pages.get(n)||'';
    }else{
      text=(await getPageSearchData(n)).text;
    }
    if(token!==searchToken)return null;

    const matches=findMatches(text,q);
    let occ=-1;
    if(first&&n===searchPage){
      if(direction>0){
        const candidate=searchOccurrence+1;
        if(candidate<matches.length)occ=candidate;
      }else{
        const candidate=Number.isFinite(searchOccurrence)?searchOccurrence-1:matches.length-1;
        if(candidate>=0&&candidate<matches.length)occ=candidate;
      }
    }else if(matches.length){
      occ=direction>0?0:matches.length-1;
    }

    if(occ>=0)return{page:n,occ,count:matches.length,source};

    n+=direction;
    if(n<1)n=pdf.numPages;
    if(n>pdf.numPages)n=1;
    first=false;
  }
  return null;
}

async function searchStep(direction){
  if(!pdf||searchBusy)return;
  const q=normalizeText(searchInput.value);
  if(!q){searchStatus.textContent='Введите текст';searchInput.focus();return}

  if(q!==searchQuery){
    searchQuery=q;
    searchPage=pageNum;
    searchOccurrence=direction>0?-1:Number.POSITIVE_INFINITY;
    searchSource='auto';
  }

  searchBusy=true;
  const token=++searchToken;
  searchStatus.textContent='Ищу…';

  try{
    await loadIndexedSearchPages();
    if(token!==searchToken)return;

    let sources;
    if(searchSource==='index'||searchSource==='pdf')sources=[searchSource];
    else sources=indexedSearchAvailable?['index','pdf']:['pdf'];

    let found=null;
    for(const source of sources){
      found=await scanSearchSource(direction,q,token,source);
      if(token!==searchToken)return;
      if(found)break;

      // If the generated index has no occurrence, restore the old PDF.js
      // text search instead of incorrectly reporting "not found".
      if(searchSource!=='auto')break;
      searchOccurrence=direction>0?-1:Number.POSITIVE_INFINITY;
    }

    if(found){
      searchSource=found.source;
      searchPage=found.page;
      searchOccurrence=found.occ;
      pageNum=found.page;
      await renderPage();
      if(token!==searchToken)return;
      searchStatus.textContent=`${found.occ+1}/${found.count} на стр. ${found.page} · ${found.source==='index'?'индекс':'PDF'}`;
      searchBusy=false;
      return;
    }

    if(token===searchToken){
      searchStatus.textContent='Не найдено';
      clearHighlights();
    }
  }catch(err){
    console.warn('PDF search error',err);
    if(token===searchToken)searchStatus.textContent='Ошибка поиска';
  }finally{
    if(token===searchToken)searchBusy=false;
  }
}

async function renderPage(options={}){
  if(!pdf)return;const target=pageNum,serial=++renderSerial;showLoading();clearAnnotations();if(renderTask){try{renderTask.cancel()}catch{}}
  try{
    const page=await getCachedPage(target);if(serial!==renderSerial)return;const base=page.getViewport({scale:1});const mobile=window.matchMedia('(max-width:760px)').matches;if(fitWidth){const available=Math.max(120,viewer.clientWidth-(mobile?20:52));scale=Math.min(2.4,available/(base.width*CSS_UNITS))}

    let ratio=Math.max(dpr,quality);

    canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=`${Math.floor(viewport.width)}px`;canvas.style.height=`${Math.floor(viewport.height)}px`;highlightLayer.style.width=annotationLayer.style.width=`${Math.floor(viewport.width)}px`;highlightLayer.style.height=annotationLayer.style.height=`${Math.floor(viewport.height)}px`;
    renderTask=page.render({canvasContext:ctx,viewport,transform:ratio===1?null:[ratio,0,0,ratio,0,0]});await renderTask.promise;if(serial!==renderSerial)return;renderTask=null;warmedPages.add(target);updateControls();savePage();hideLoading();

}

async function open(){
  if(!raw){fail('В ссылке не указан файл.');return}
  title.textContent=titleParam||decodeURIComponent(raw.split('/').pop());document.title=(titleParam||'PDF')+' · ФФ НГУ';showLoading('Проверяю файл…');
  try{
    pdfUrl=await resolvePdfUrl(raw);direct.href=pdfUrl;showLoading('Открываю документ…');const task=pdfjsLib.getDocument({url:pdfUrl,disableRange:false,disableStream:true,disableAutoFetch:true,rangeChunkSize:262144});task.onProgress=p=>{if(p.total&&p.loaded)loadingText.textContent=`Загрузка: ${Math.min(100,Math.round(p.loaded/p.total*100))}%`};
    pdf=await task.promise;pageNum=Math.min(pdf.numPages,Math.max(1,pageParam||rememberedPage()));searchPage=pageNum;scale=1;fitWidth=window.matchMedia('(max-width:760px)').matches;updateControls();void loadIndexedSearchPages();await renderPage();notifyParentPdfReady();if(findParam.trim()){searchInput.value=findParam;openSearch();resetSearch();void searchStep(1)}
  }catch(err){fail(err?.message||String(err))}

function go(delta){if(!pdf)return;const n=pageNum+delta;if(n<1||n>pdf.numPages)return;pageNum=n;renderPage()}

  if(window.parent!==window){

    return;
  }

function touchDistance(touches){const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;return Math.hypot(dx,dy)}
function touchMidpoint(touches){return{x:(touches[0].clientX+touches[1].clientX)/2,y:(touches[0].clientY+touches[1].clientY)/2}}
let pinchState=null;
viewer.addEventListener('touchstart',e=>{
  if(!pdf||e.touches.length!==2)return;

  canvasWrap.style.transform='scale('+(pinchState.targetScale/pinchState.startScale)+')';
},{passive:false});
function finishPinch(e){
  if(!pinchState||(e.touches&&e.touches.length>=2))return;
  const nextScale=pinchState.targetScale,anchor=pinchState.anchor;pinchState=null;
  canvasWrap.classList.remove('pinch-preview');canvasWrap.style.transform='';canvasWrap.style.transformOrigin='';
  if(Math.abs(nextScale-scale)<.005){updateControls();return}
  scale=nextScale;void renderPage({anchor});
}
viewer.addEventListener('touchend',finishPinch,{passive:true});
viewer.addEventListener('touchcancel',finishPinch,{passive:true});
