<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ФФ НГУ — 4 курс, 1 семестр</title>
  <style>
    :root{--bg:#0d1015;--side:#12161c;--panel:#171c23;--panel2:#1c222b;--line:#2b323d;--soft:#222933;--text:#eef1f5;--text2:#c7ced8;--muted:#8993a1;--accent:#d45d68;--accentSoft:rgba(212,93,104,.13);--sideW:292px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}button,input{font:inherit}button{color:inherit}a{color:inherit}.app{min-height:100vh}
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:var(--sideW);display:flex;flex-direction:column;padding:28px 18px 18px;border-right:1px solid var(--soft);background:var(--side)}
    .brand{padding:0 10px 22px;border-bottom:1px solid var(--soft)}.brand-kicker,.course-kicker{color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.brand-title{margin:7px 0 0;font-size:25px;line-height:1.12}.brand-sub{margin-top:7px;color:var(--muted);font-size:14px}
    .search-wrap{padding:20px 4px 14px}.search{width:100%;height:43px;padding:0 13px;border:1px solid var(--line);border-radius:10px;outline:none;background:#0f1318;color:var(--text)}.search::placeholder{color:#687281}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
    .nav-label{padding:4px 10px 8px;color:#687281;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.subject-nav{min-height:0;flex:1;overflow-y:auto;padding:0 4px}.subject-btn{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;margin:3px 0;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;cursor:pointer}.subject-btn:hover{background:rgba(255,255,255,.035)}.subject-btn.active{border-color:rgba(212,93,104,.25);background:var(--accentSoft)}.subject-short{overflow:hidden;font-weight:750;text-overflow:ellipsis;white-space:nowrap}.count{min-width:24px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted);font-size:11px;font-weight:800;text-align:center}.subject-btn.active .count{background:rgba(212,93,104,.2);color:#f09ca5}
    .sidebar-footer{padding:15px 4px 0;border-top:1px solid var(--soft)}.repo-link{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13px}.repo-link:hover{background:rgba(255,255,255,.035);color:var(--text2)}
    .main{min-height:100vh;margin-left:var(--sideW)}.content{width:min(920px,calc(100% - 64px));margin:0 auto;padding:62px 0 80px}.course-code{margin:10px 0 0;font-size:clamp(37px,6vw,58px);line-height:1.02;letter-spacing:-.045em}.course-name{max-width:760px;margin:13px 0 0;color:var(--text2);font-size:19px}.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.person{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.018);color:var(--muted);font-size:13px}.person strong{color:var(--text2)}
    .materials{margin-top:42px}.material-section{margin-top:36px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 11px}.section-title{margin:0;font-size:18px;letter-spacing:-.015em}.section-count{color:var(--muted);font-size:12px}.material-list{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.material-row{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:70px;padding:12px 17px;border:0;border-bottom:1px solid var(--soft);background:transparent;text-align:left;cursor:pointer;text-decoration:none}.material-row:last-child{border-bottom:0}.material-row:hover{background:var(--panel2)}.type{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--accentSoft);color:#f09ca5;font-size:11px;font-weight:900}.material-main{min-width:0}.material-name{display:block;overflow:hidden;font-weight:720;text-overflow:ellipsis;white-space:nowrap}.material-meta{display:block;overflow:hidden;margin-top:3px;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.arrow{color:#7d8795;font-size:19px}.material-row:hover .arrow{color:#f09ca5}.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
    .mobilebar{display:none}.viewer{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:#090b0f}.viewer.open{display:flex}.viewerbar{height:58px;flex:0 0 58px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:#11151b}.back,.direct{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#171c23;color:var(--text2);text-decoration:none;cursor:pointer}.back:hover,.direct:hover{border-color:rgba(212,93,104,.55);background:var(--accentSoft)}.viewer-title{overflow:hidden;color:var(--text2);font-size:14px;font-weight:700;text-align:center;text-overflow:ellipsis;white-space:nowrap}.frame{width:100%;min-height:0;flex:1;border:0;background:#202124}body.viewer-open{overflow:hidden}
    @media(max-width:820px){:root{--sideW:280px}.mobilebar{position:sticky;top:0;z-index:15;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--soft);background:rgba(13,16,21,.94);backdrop-filter:blur(10px)}.menubtn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer}.mobile-title{font-weight:750}.sidebar{transform:translateX(-100%);box-shadow:18px 0 50px rgba(0,0,0,.35);transition:transform .18s ease}.sidebar.mobile-open{transform:translateX(0)}.main{margin-left:0}.content{width:min(100% - 32px,760px);padding:36px 0 64px}.course-code{font-size:40px}.course-name{font-size:17px}.direct{display:none}.viewerbar{grid-template-columns:auto minmax(0,1fr)}.viewer-title{text-align:left}}
  </style>
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="brand-kicker">НГУ · Физический факультет</div><h1 class="brand-title">4 курс</h1><div class="brand-sub">1 семестр · 2026</div></div>
    <div class="search-wrap"><input id="search" class="search" type="search" placeholder="Поиск материалов…" autocomplete="off"></div>
    <div class="nav-label">Предметы</div><nav id="nav" class="subject-nav"></nav>
    <div class="sidebar-footer"><a class="repo-link" href="https://github.com/BelovVlad/NSU_Faculty_of_Physics-4th-year--1st-semester-" target="_blank" rel="noopener"><span>Репозиторий GitHub</span><span>↗</span></a></div>
  </aside>
  <main class="main"><div class="mobilebar"><button id="menu" class="menubtn" type="button">☰</button><div id="mobileTitle" class="mobile-title">Материалы</div></div><div id="content" class="content"></div></main>
</div>
<section id="viewer" class="viewer" aria-hidden="true"><div class="viewerbar"><button id="back" class="back" type="button">← Материалы</button><div id="viewerTitle" class="viewer-title">PDF</div><a id="direct" class="direct" href="#" target="_blank" rel="noopener">Открыть отдельно ↗</a></div><iframe id="frame" class="frame" title="Просмотр PDF"></iframe></section>
<script>
  const OWNER='BelovVlad',REPO='NSU_Faculty_of_Physics-4th-year--1st-semester-',BRANCH='main';
  const ORDER=['ОВФ','СВЧ','ТДиСФ','ФКСВ','ФЭЧ','ФиХАиМ','База'];
  const META={
    'ОВФ':{name:'Основы вычислительной физики',lecturer:'Усов Э. В.'},
    'СВЧ':{name:'СВЧ'},
    'ТДиСФ':{name:'Термодинамика и статистическая физика',lecturer:'Грабовский В. В.',seminarist:'Глинский В. В.'},
    'ФКСВ':{name:'ФКСВ',lecturer:'Шварц Б. А.',seminarist:'Махмудиан М. М.'},
    'ФЭЧ':{name:'Физика атомного ядра и элементарных частиц',lecturer:'Шварц Б. А.',seminarist:'Винокурова А. Н.'},
    'ФиХАиМ':{name:'Физика и химия атомов и молекул',lecturer:'Горбунов О. А.',seminarist:'Горбунов О. А.'},
    'База':{name:'База знаний'}
  };

  /* Этот список формирует Jekyll во время сборки GitHub Pages.
     Никакого обращения к api.github.com из браузера больше нет. */
  const FILES=[
  {% for file in site.static_files %}
    {% assign ext = file.extname | downcase %}
    {% if ext == '.pdf' or ext == '.ipynb' %}{{ file.path | jsonify }},{% endif %}
  {% endfor %}
  ].map(p=>p.replace(/^\/+/,''))
   .filter(p=>!p.includes('/LaTeX/')&&ORDER.includes(p.split('/')[0]));

  const SECTION_ORDER=['Лекции','Семинары','Лабораторные работы','Месячные задания','Литература','Практика','Теория','Материалы'];
  const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search'),sidebar=document.getElementById('sidebar'),menu=document.getElementById('menu'),mobileTitle=document.getElementById('mobileTitle');
  const viewer=document.getElementById('viewer'),frame=document.getElementById('frame'),viewerTitle=document.getElementById('viewerTitle'),back=document.getElementById('back'),direct=document.getElementById('direct');
  let current='ФиХАиМ',previousHash='';

  const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const ext=p=>(p.split('.').pop()||'').toLowerCase();
  const enc=p=>p.split('/').map(encodeURIComponent).join('/');
  const local=p=>'./'+enc(p);
  const subjectFiles=s=>FILES.filter(p=>p.split('/')[0]===s).sort((a,b)=>a.localeCompare(b,'ru',{numeric:true,sensitivity:'base'}));
  function cleanName(p){const parts=p.split('/'),name=parts.at(-1).replace(/\.[^.]+$/,''),sec=parts[1]||'';if(name.toLowerCase()==='final'){if(/лекц/i.test(sec))return'Конспект лекций';if(/семинар/i.test(sec))return'Семинары';if(/месяч/i.test(sec))return'Месячные задания';return'Итоговый материал'}if(name.toUpperCase()==='INDEX')return'Оглавление';return name.replaceAll('_',' ')}
  function sectionFor(p){const parts=p.split('/');if(parts.length<3)return'Материалы';const raw=(parts[1]||'').replace(/^\d+[_ .-]*/,'').replaceAll('_',' ').trim();if(/лекц/i.test(raw))return'Лекции';if(/семинар/i.test(raw))return'Семинары';if(/лаборатор/i.test(raw))return'Лабораторные работы';if(/месяч/i.test(raw))return'Месячные задания';if(/литерат/i.test(raw))return'Литература';if(/практик/i.test(raw))return'Практика';if(/теори/i.test(raw))return'Теория';return raw||'Материалы'}
  const rank=s=>{const i=SECTION_ORDER.indexOf(s);return i<0?999:i};

  function renderNav(){nav.innerHTML=ORDER.map(s=>{const n=subjectFiles(s).length;if(!n)return'';return`<button class="subject-btn ${s===current?'active':''}" data-subject="${esc(s)}"><span class="subject-short">${esc(s)}</span><span class="count">${n}</span></button>`}).join('');nav.querySelectorAll('.subject-btn').forEach(b=>b.onclick=()=>{selectSubject(b.dataset.subject);sidebar.classList.remove('mobile-open')})}
  function selectSubject(s,hash=true){if(!ORDER.includes(s))return;current=s;search.value='';renderNav();renderSubject(s);if(hash)history.replaceState(null,'',`#subject=${encodeURIComponent(s)}`)}
  function row(p){const e=ext(p),name=cleanName(p),meta=p.split('/').slice(1,-1).join(' / ').replace(/^\d+[_ .-]*/,'').replaceAll('_',' ');if(e==='pdf')return`<button class="material-row" data-pdf="${esc(p)}" data-title="${esc(name)}"><span class="type">PDF</span><span class="material-main"><span class="material-name">${esc(name)}</span><span class="material-meta">${esc(meta||'PDF')}</span></span><span class="arrow">→</span></button>`;const u=`https://nbviewer.org/github/${OWNER}/${REPO}/blob/${BRANCH}/${enc(p)}`;return`<a class="material-row" href="${u}" target="_blank" rel="noopener"><span class="type">NB</span><span class="material-main"><span class="material-name">${esc(name)}</span><span class="material-meta">Jupyter Notebook · nbviewer</span></span><span class="arrow">↗</span></a>`}
  function section(name,files){return`<section class="material-section"><div class="section-head"><h2 class="section-title">${esc(name)}</h2><span class="section-count">${files.length}</span></div><div class="material-list">${files.map(row).join('')}</div></section>`}
  function bindRows(){content.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>openPdf(b.dataset.pdf,b.dataset.title))}
  function renderSubject(s){const m=META[s]||{name:s},files=subjectFiles(s),groups=new Map();files.forEach(p=>{const k=sectionFor(p);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)});const people=[];if(m.lecturer)people.push(`<span class="person">Лектор <strong>${esc(m.lecturer)}</strong></span>`);if(m.seminarist)people.push(`<span class="person">Семинарист <strong>${esc(m.seminarist)}</strong></span>`);const sections=[...groups.entries()].sort((a,b)=>rank(a[0])-rank(b[0])||a[0].localeCompare(b[0],'ru')).map(([k,v])=>section(k,v)).join('');mobileTitle.textContent=s;content.innerHTML=`<header><div class="course-kicker">ФФ НГУ · 4 курс · 1 семестр</div><h1 class="course-code">${esc(s)}</h1><p class="course-name">${esc(m.name)}</p>${people.length?`<div class="people">${people.join('')}</div>`:''}</header><div class="materials">${sections||'<div class="empty">Материалов пока нет.</div>'}</div>`;bindRows()}
  function renderSearch(q){q=q.trim();if(!q){renderSubject(current);return}const low=q.toLocaleLowerCase('ru'),matches=FILES.filter(p=>{const s=p.split('/')[0],m=META[s]||{};return`${s} ${m.name||''} ${p} ${cleanName(p)}`.toLocaleLowerCase('ru').includes(low)}),by=new Map();matches.forEach(p=>{const s=p.split('/')[0];if(!by.has(s))by.set(s,[]);by.get(s).push(p)});mobileTitle.textContent='Поиск';const blocks=ORDER.filter(s=>by.has(s)).map(s=>section(`${s} · ${(META[s]||{}).name||s}`,by.get(s))).join('');content.innerHTML=`<header><div class="course-kicker">Поиск по материалам</div><h1 class="course-code">Результаты</h1><p class="course-name">Запрос: «${esc(q)}»</p></header><div class="materials">${blocks||'<div class="empty">Ничего не найдено.</div>'}</div>`;bindRows()}
  function openPdf(p,title,hash=true){previousHash=location.hash||`#subject=${encodeURIComponent(current)}`;const u=local(p);viewerTitle.textContent=title||cleanName(p);frame.src=u+'#view=FitH';direct.href=u;viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.body.classList.add('viewer-open');if(hash)history.pushState({pdf:p},'',`#pdf=${encodeURIComponent(p)}`)}
  function hidePdf(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');document.body.classList.remove('viewer-open');frame.src='about:blank'}
  function closePdf(){hidePdf();history.replaceState(null,'',previousHash&&!previousHash.startsWith('#pdf=')?previousHash:`#subject=${encodeURIComponent(current)}`)}
  function applyHash(){if(location.hash.startsWith('#pdf=')){const p=decodeURIComponent(location.hash.slice(5));if(FILES.includes(p)&&ext(p)==='pdf')openPdf(p,cleanName(p),false);return}hidePdf();if(location.hash.startsWith('#subject=')){const s=decodeURIComponent(location.hash.slice(9));if(ORDER.includes(s))selectSubject(s,false)}}

  search.addEventListener('input',()=>renderSearch(search.value));menu.addEventListener('click',()=>sidebar.classList.toggle('mobile-open'));back.addEventListener('click',closePdf);window.addEventListener('popstate',applyHash);window.addEventListener('hashchange',applyHash);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('open'))closePdf()});
  const fromHash=location.hash.startsWith('#subject=')?decodeURIComponent(location.hash.slice(9)):null;if(fromHash&&ORDER.includes(fromHash))current=fromHash;else if(!subjectFiles(current).length)current=ORDER.find(s=>subjectFiles(s).length)||'ФиХАиМ';renderNav();renderSubject(current);applyHash();
</script>
</body>
</html>
