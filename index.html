    .materials{margin-top:42px}.material-section{margin-top:36px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 11px}.section-title{margin:0;font-size:18px;letter-spacing:-.015em}.section-count{color:var(--muted);font-size:12px}.material-list{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.material-row{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:70px;padding:12px 17px;border:0;border-bottom:1px solid var(--soft);background:transparent;text-align:left;cursor:pointer;text-decoration:none}.material-row:last-child{border-bottom:0}.material-row:hover{background:var(--panel2)}.type{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--accentSoft);color:#f09ca5;font-size:11px;font-weight:900}.material-main{min-width:0}.material-name{display:block;overflow:hidden;font-weight:720;text-overflow:ellipsis;white-space:nowrap}.material-meta{display:block;overflow:hidden;margin-top:3px;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.arrow{color:#7d8795;font-size:19px}.material-row:hover .arrow{color:#f09ca5}.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

    .search-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.search-note{margin-top:8px;color:var(--muted);font-size:13px}.search-layout{display:grid;grid-template-columns:minmax(360px,.92fr) minmax(380px,1.08fr);gap:18px;margin-top:28px;align-items:start}.search-results{min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}.search-summary{padding:11px 14px;border-bottom:1px solid var(--soft);color:var(--muted);font-size:12px}.search-result{width:100%;display:block;padding:14px 15px;border:0;border-bottom:1px solid var(--soft);background:transparent;color:var(--text);text-align:left;cursor:pointer}.search-result:last-child{border-bottom:0}.search-result:hover{background:var(--panel2)}.search-result.active{background:var(--accentSoft);box-shadow:inset 3px 0 0 var(--accent)}.result-top{display:flex;align-items:center;gap:8px;min-width:0}.result-badge{flex:none;padding:2px 6px;border-radius:5px;background:var(--accentSoft);color:#f09ca5;font-size:10px;font-weight:900}.result-title{overflow:hidden;font-weight:750;text-overflow:ellipsis;white-space:nowrap}.result-loc{margin-top:4px;color:var(--muted);font-size:11px}.result-snippet{margin-top:8px;color:var(--text2);font-size:12px;line-height:1.48;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.result-snippet mark,.preview-text mark{padding:0 2px;border-radius:3px;background:rgba(212,93,104,.22);color:#ffd6da}.search-preview{position:sticky;top:18px;min-height:310px;max-height:calc(100vh - 36px);border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.preview-empty{display:grid;place-items:center;min-height:310px;padding:28px;color:var(--muted);text-align:center}.preview-body{display:flex;flex-direction:column;max-height:calc(100vh - 38px);padding:19px}.preview-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex:none}.preview-subject{color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.preview-title{margin:4px 0 0;font-size:20px;line-height:1.25}.preview-close{display:none}.preview-meta{margin-top:9px;color:var(--muted);font-size:12px;overflow-wrap:anywhere;flex:none}
    .preview-actions{display:flex;align-items:center;gap:10px;margin-top:12px;flex:none}.open-result{height:39px;padding:0 13px;border:1px solid rgba(212,93,104,.4);border-radius:9px;background:var(--accentSoft);color:#f1a0a8;font-weight:750;cursor:pointer}.open-result:hover{border-color:var(--accent);background:rgba(212,93,104,.2)}.index-state{color:var(--muted);font-size:12px}.preview-visual{position:relative;height:clamp(250px,52vh,500px);min-height:180px;margin-top:13px;overflow:hidden;border:1px solid var(--soft);border-radius:10px;background:#0f1318;flex:1 1 auto}.preview-page-stage{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}.preview-canvas-wrap{position:relative;flex:none;line-height:0;background:white;box-shadow:0 8px 26px rgba(0,0,0,.34)}.preview-canvas{display:block;background:white}.preview-hit-layer{position:absolute;inset:0;pointer-events:none}.preview-hit{position:absolute;border:1px solid rgba(212,93,104,.9);border-radius:2px;background:rgba(212,93,104,.28);box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 10px rgba(212,93,104,.32)}.preview-loading,.preview-error,.preview-await{width:100%;height:100%;min-height:180px;display:grid;place-items:center;padding:24px;color:var(--muted);font-size:13px;text-align:center}.preview-spinner{width:24px;height:24px;margin:0 auto 10px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.preview-text{margin-top:10px;padding:10px 12px;border:1px solid var(--soft);border-radius:10px;background:#11161c;color:var(--text2);font-size:11px;line-height:1.45;white-space:pre-wrap;max-height:74px;overflow:auto;flex:none}.search-loading{padding:30px;color:var(--muted);text-align:center}.search-loading::after{content:'…';animation:dots 1.2s steps(4,end) infinite}@keyframes dots{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}

    .mobilebar,.mobile-search-row{display:none}
    @media(max-width:820px){:root{--sideW:280px}.mobilebar{position:sticky;top:0;z-index:15;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--soft);background:rgba(13,16,21,.96);backdrop-filter:blur(10px)}.menubtn,.mobile-search-btn{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer}.mobile-title{min-width:0;flex:1;overflow:hidden;font-weight:750;text-overflow:ellipsis;white-space:nowrap}.mobile-search-row{position:sticky;top:56px;z-index:14;padding:8px 12px;border-bottom:1px solid var(--soft);background:rgba(13,16,21,.97)}body.mobile-search-open .mobile-search-row{display:block}.mobile-search-input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#0f1318;color:var(--text)}.mobile-search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}.sidebar{transform:translateX(-100%);box-shadow:18px 0 50px rgba(0,0,0,.35);transition:transform .18s ease}.sidebar.mobile-open{transform:translateX(0)}.main{margin-left:0}.content,.content.search-mode{width:min(100% - 24px,760px);padding:30px 0 64px}.course-code{font-size:40px}.course-name{font-size:17px}.search-head{display:block}.search-layout{display:block;margin-top:20px}.search-results{border-radius:12px}.search-preview{display:none;position:fixed;left:10px;right:10px;bottom:10px;top:auto;z-index:40;min-height:0;max-height:calc(100vh - 76px);overflow:hidden;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.65)}.search-preview.mobile-visible{display:block}.preview-empty{display:none}.preview-body{max-height:calc(100vh - 80px);padding:14px;overflow:auto}.preview-close{display:grid;place-items:center;width:34px;height:34px;flex:none;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);cursor:pointer}.preview-title{font-size:17px}.preview-meta{display:none}.preview-actions{margin-top:9px;position:sticky;top:-1px;z-index:3;padding:5px 0 7px;background:var(--panel)}.preview-visual{height:min(42vh,330px);min-height:165px;margin-top:7px;flex:none}.preview-page-stage{padding:7px}.preview-loading,.preview-error,.preview-await{min-height:165px;padding:12px}.preview-text{margin-top:8px;padding:9px 10px;font-size:10.5px;line-height:1.4;max-height:62px}.search-result{padding:12px}.result-snippet{-webkit-line-clamp:2}.search-note{font-size:12px}}

<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="brand-kicker">НГУ · Физический факультет</div><h1 class="brand-title">4 курс</h1><div class="brand-sub">1 семестр · 2026</div></div>
    <div class="search-wrap"><input id="search" class="search" type="search" placeholder="Поиск по всем материалам…" autocomplete="off"></div>
    <div class="nav-label">Предметы</div><nav id="nav" class="subject-nav"></nav>
    <div class="sidebar-footer"><a class="repo-link" href="https://github.com/BelovVlad/NSU_Faculty_of_Physics-4th-year--1st-semester-" target="_blank" rel="noopener"><span>Репозиторий GitHub</span><span>↗</span></a></div>
  </aside>
  <main class="main">
    <div class="mobilebar"><button id="menu" class="menubtn" type="button">☰</button><div id="mobileTitle" class="mobile-title">Материалы</div><button id="mobileSearchBtn" class="mobile-search-btn" type="button" aria-label="Поиск">⌕</button></div>
    <div class="mobile-search-row"><input id="mobileSearch" class="mobile-search-input" type="search" placeholder="Поиск по всем файлам…" autocomplete="off"></div>
    <div id="content" class="content"></div>
  </main>
</div>
<script>
  const OWNER='BelovVlad',REPO='NSU_Faculty_of_Physics-4th-year--1st-semester-',BRANCH='main';
  const ORDER=['ОВФ','СВЧ','ТДиСФ','ФКСВ','ФЭЧ','ФиХАиМ','База'];
  const META={
    'ОВФ':{name:'Основы вычислительной физики',lecturer:'Усов Э. В.'},
    'СВЧ':{name:'СВЧ'},
    'ТДиСФ':{name:'Термодинамика и статистическая физика',lecturer:'Грабовский В. В.',seminarist:'Глинский В. В.'},
    'ФКСВ':{name:'ФКСВ',lecturer:'Шварц Б. А.',seminarist:'Махмудиан М. М.'},
    'ФЭЧ':{name:'Физика атомного ядра и элементарных частиц',lecturer:'Шварц Б. А.',seminarist:'Винокурова А. Н.'},
    'ФиХАиМ':{name:'Физика и химия атомов и молекул',lecturer:'Горбунов О. А.',seminarist:'Горбунов О. А.'},
    'База':{name:'База знаний'}
  };
  const FILES=[
  {% for file in site.static_files %}
    {% assign ext = file.extname | downcase %}
    {% if ext == '.pdf' or ext == '.ipynb' %}{{ file.path | jsonify }},{% endif %}
  {% endfor %}
  ].map(p=>p.replace(/^\/+/,''))
   .filter(p=>!p.includes('/LaTeX/')&&ORDER.includes(p.split('/')[0]));

  const SECTION_ORDER=['Лекции','Семинары','Лабораторные работы','Месячные задания','Литература','Практика','Теория','Материалы'];
  const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search'),sidebar=document.getElementById('sidebar'),menu=document.getElementById('menu'),mobileTitle=document.getElementById('mobileTitle'),mobileSearchBtn=document.getElementById('mobileSearchBtn'),mobileSearch=document.getElementById('mobileSearch');
  let current='ФиХАиМ',searchTimer=null,searchRun=0,manifestPromise=null,allIndexPromise=null,lastResults=[];
  let pdfjsPromise=null,previewToken=0,autoPreviewTimer=null;
  const previewDocs=new Map();

  const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const ext=p=>(p.split('.').pop()||'').toLowerCase();
  const enc=p=>p.split('/').map(encodeURIComponent).join('/');
  const norm=s=>String(s||'').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').replace(/\s+/g,' ').trim();
  const subjectFiles=s=>FILES.filter(p=>p.split('/')[0]===s).sort((a,b)=>a.localeCompare(b,'ru',{numeric:true,sensitivity:'base'}));
  function cleanName(p){const parts=p.split('/'),name=parts.at(-1).replace(/\.[^.]+$/,''),sec=parts[1]||'';if(name.toLowerCase()==='final'){if(/лекц/i.test(sec))return'Конспект лекций';if(/семинар/i.test(sec))return'Семинары';if(/месяч/i.test(sec))return'Месячные задания';return'Итоговый материал'}if(name.toUpperCase()==='INDEX')return'Оглавление';return name.replaceAll('_',' ')}
  function sectionFor(p){const parts=p.split('/');if(parts.length<3)return'Материалы';const raw=(parts[1]||'').replace(/^\d+[_ .-]*/,'').replaceAll('_',' ').trim();if(/лекц/i.test(raw))return'Лекции';if(/семинар/i.test(raw))return'Семинары';if(/лаборатор/i.test(raw))return'Лабораторные работы';if(/месяч/i.test(raw))return'Месячные задания';if(/литерат/i.test(raw))return'Литература';if(/практик/i.test(raw))return'Практика';if(/теори/i.test(raw))return'Теория';return raw||'Материалы'}
  const rank=s=>{const i=SECTION_ORDER.indexOf(s);return i<0?999:i};

  function renderNav(){nav.innerHTML=ORDER.map(s=>{const n=subjectFiles(s).length;if(!n)return'';return`<button class="subject-btn ${s===current?'active':''}" data-subject="${esc(s)}"><span class="subject-short">${esc(s)}</span><span class="count">${n}</span></button>`}).join('');nav.querySelectorAll('.subject-btn').forEach(b=>b.onclick=()=>{selectSubject(b.dataset.subject);sidebar.classList.remove('mobile-open')})}
  function selectSubject(s,hash=true){if(!ORDER.includes(s))return;current=s;setSearchValue('');content.classList.remove('search-mode');document.body.classList.remove('mobile-search-open');clearTimeout(autoPreviewTimer);previewToken++;renderNav();renderSubject(s);if(hash)history.replaceState(null,'',`#subject=${encodeURIComponent(s)}`)}
  function row(p){const e=ext(p),name=cleanName(p),meta=p.split('/').slice(1,-1).join(' / ').replace(/^\d+[_ .-]*/,'').replaceAll('_',' ');if(e==='pdf')return`<button class="material-row" data-pdf="${esc(p)}" data-title="${esc(name)}"><span class="type">PDF</span><span class="material-main"><span class="material-name">${esc(name)}</span><span class="material-meta">${esc(meta||'PDF')}</span></span><span class="arrow">→</span></button>`;const u=`https://nbviewer.org/github/${OWNER}/${REPO}/blob/${BRANCH}/${enc(p)}`;return`<a class="material-row" href="${u}" target="_blank" rel="noopener"><span class="type">NB</span><span class="material-main"><span class="material-name">${esc(name)}</span><span class="material-meta">Jupyter Notebook · nbviewer</span></span><span class="arrow">↗</span></a>`}
  function section(name,files){return`<section class="material-section"><div class="section-head"><h2 class="section-title">${esc(name)}</h2><span class="section-count">${files.length}</span></div><div class="material-list">${files.map(row).join('')}</div></section>`}
  function openPdf(p,title,page=0,find=''){const pageArg=page?`&page=${page}`:'';const findArg=find?`&find=${encodeURIComponent(find)}`:'';location.href=`pdfjs/viewer.html?file=${encodeURIComponent(p)}&title=${encodeURIComponent(title||cleanName(p))}&subject=${encodeURIComponent(p.split('/')[0]||current)}${pageArg}${findArg}`}
  function bindRows(){content.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>openPdf(b.dataset.pdf,b.dataset.title))}
  function renderSubject(s){const m=META[s]||{name:s},files=subjectFiles(s),groups=new Map();files.forEach(p=>{const k=sectionFor(p);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)});const people=[];if(m.lecturer)people.push(`<span class="person">Лектор <strong>${esc(m.lecturer)}</strong></span>`);if(m.seminarist)people.push(`<span class="person">Семинарист <strong>${esc(m.seminarist)}</strong></span>`);const sections=[...groups.entries()].sort((a,b)=>rank(a[0])-rank(b[0])||a[0].localeCompare(b[0],'ru')).map(([k,v])=>section(k,v)).join('');mobileTitle.textContent=s;content.innerHTML=`<header><div class="course-kicker">ФФ НГУ · 4 курс · 1 семестр</div><h1 class="course-code">${esc(s)}</h1><p class="course-name">${esc(m.name)}</p>${people.length?`<div class="people">${people.join('')}</div>`:''}</header><div class="materials">${sections||'<div class="empty">Материалов пока нет.</div>'}</div>`;bindRows()}

  async function loadManifest(){if(!manifestPromise)manifestPromise=fetch('search-index/manifest.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('index unavailable');return r.json()});return manifestPromise}
  async function loadFullIndex(){if(!allIndexPromise)allIndexPromise=(async()=>{const m=await loadManifest();const parts=await Promise.all(m.shards.map(s=>fetch(`search-index/${s.file}`,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('index shard unavailable');return r.json()})));return{manifest:m,records:parts.flatMap(p=>p.records||[])}})();return allIndexPromise}

  function makeSnippet(text,q){const plain=String(text||'').replace(/\s+/g,' ').trim();if(!plain)return'';const low=norm(plain),needle=norm(q),terms=needle.split(' ').filter(Boolean);let at=needle?low.indexOf(needle):-1;if(at<0)for(const t of terms){at=low.indexOf(t);if(at>=0)break}if(at<0)at=0;const start=Math.max(0,at-145),end=Math.min(plain.length,at+Math.max(needle.length,20)+205);return`${start?'…':''}${plain.slice(start,end)}${end<plain.length?'…':''}`}
  function highlight(text,q){let html=esc(text);const terms=[...new Set(norm(q).split(' ').filter(t=>t.length>1))].sort((a,b)=>b.length-a.length);for(const t of terms){const safe=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');html=html.replace(new RegExp(`(${safe})`,'giu'),'<mark>$1</mark>')}return html}
  function scoreRecord(record,loc,q){const nq=norm(q),terms=nq.split(' ').filter(Boolean),title=norm(`${record.title} ${record.path} ${record.subject} ${record.section}`),text=norm(loc?.t||''),all=terms.every(t=>text.includes(t)||title.includes(t));if(!all)return-1;let score=0;if(text.includes(nq))score+=80;if(title.includes(nq))score+=100;for(const t of terms){if(title.includes(t))score+=15;if(text.includes(t))score+=5}return score}

  function metadataFallback(q){const nq=norm(q),terms=nq.split(' ').filter(Boolean);return FILES.map(p=>{const hay=norm(`${p} ${cleanName(p)} ${(META[p.split('/')[0]]||{}).name||''}`);if(!terms.every(t=>hay.includes(t)))return null;return{path:p,type:ext(p)==='pdf'?'pdf':'ipynb',title:cleanName(p),subject:p.split('/')[0],section:sectionFor(p),page:0,text:'Совпадение найдено в названии или пути файла.',score:20,indexed:false}}).filter(Boolean)}

  function searchRecords(records,q){const out=[];for(const r of records){const metaScore=scoreRecord(r,null,q);if(metaScore>=0)out.push({path:r.path,type:r.type,title:r.title,subject:r.subject,section:r.section,page:0,text:'Совпадение найдено в названии или пути файла.',score:metaScore,indexed:r.indexed});for(const loc of r.pages||[]){const score=scoreRecord(r,loc,q);if(score>=0)out.push({path:r.path,type:r.type,title:r.title,subject:r.subject,section:r.section,page:loc.n,text:makeSnippet(loc.t,q),score:score+(r.type==='pdf'?2:0),indexed:r.indexed})}}out.sort((a,b)=>b.score-a.score||a.subject.localeCompare(b.subject,'ru')||a.title.localeCompare(b.title,'ru'));const seen=new Set(),dedup=[];for(const r of out){const key=`${r.path}|${r.page}`;if(seen.has(key))continue;seen.add(key);dedup.push(r);if(dedup.length>=120)break}return dedup}

  function resultLabel(r){return r.type==='pdf'?(r.page?`стр. ${r.page}`:'PDF'):(r.page?`ячейка ${r.page}`:'Notebook')}
  function resultHtml(r,i,q){return`<button class="search-result${i===0?' active':''}" data-result="${i}"><div class="result-top"><span class="result-badge">${esc(r.subject)}</span><span class="result-title">${highlight(r.title,q)}</span></div><div class="result-loc">${esc(r.section)} · ${esc(resultLabel(r))}</div><div class="result-snippet">${highlight(r.text,q)}</div></button>`}
  function previewHtml(r,q){if(!r)return'<div class="preview-empty">Выберите результат слева — здесь появится найденный фрагмент.</div>';const visual=r.type==='pdf'&&r.page?'<div class="preview-visual"><div class="preview-await">Миниатюра нужной страницы загружается только для выбранного результата.</div></div>':'';return`<div class="preview-body"><div class="preview-header"><div><div class="preview-subject">${esc(r.subject)} · ${esc(r.section)} · ${esc(resultLabel(r))}</div><h2 class="preview-title">${esc(r.title)}</h2></div><button class="preview-close" type="button" aria-label="Закрыть">×</button></div><div class="preview-meta">${esc(r.path)}</div><div class="preview-actions"><button class="open-result" type="button">${r.type==='pdf'?(r.page?`Открыть страницу ${r.page}`:'Открыть PDF'):'Открыть notebook'}</button><span class="index-state">${r.type==='pdf'&&r.page?'Миниатюра: только выбранная страница':r.page?'Найдено внутри файла':'Совпадение по названию'}</span></div>${visual}<div class="preview-text">${highlight(r.text,q)}</div></div>`}

  async function getPdfJs(){if(!pdfjsPromise)pdfjsPromise=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';return m});return pdfjsPromise}
  async function resolvePreviewPdfUrl(path){const local=new URL(enc(path),location.href).href;try{const h=await fetch(local,{method:'HEAD',cache:'force-cache'});const len=Number(h.headers.get('content-length')||0);if(h.ok&&len>0&&len<2048){const t=await fetch(local,{cache:'force-cache'}).then(r=>r.text());if(t.startsWith('version https://git-lfs.github.com/spec/v1'))return`https://media.githubusercontent.com/media/${OWNER}/${REPO}/${BRANCH}/${enc(path)}`}}catch{}return local}
  async function getPreviewDocument(path){const cached=previewDocs.get(path);if(cached){cached.used=Date.now();return cached.doc}const lib=await getPdfJs(),url=await resolvePreviewPdfUrl(path),task=lib.getDocument({url,disableRange:false,disableStream:true,disableAutoFetch:true,rangeChunkSize:131072}),doc=await task.promise;previewDocs.set(path,{doc,used:Date.now()});if(previewDocs.size>2){const old=[...previewDocs.entries()].filter(([p])=>p!==path).sort((a,b)=>a[1].used-b[1].used)[0];if(old){previewDocs.delete(old[0]);old[1].doc.destroy().catch(()=>{})}}return doc}
  async function drawPreviewHits(page,viewport,layer,q,lib){const terms=[...new Set(norm(q).split(' ').filter(t=>t.length>1))];if(!terms.length)return;const tc=await page.getTextContent();let hits=0;for(const item of tc.items||[]){if(!item.str)continue;const s=norm(item.str);if(!terms.some(t=>s.includes(t)))continue;const tx=lib.Util.transform(viewport.transform,item.transform),fontH=Math.max(4,Math.hypot(tx[2],tx[3])),width=Math.max(5,(item.width||0)*viewport.scale);const left=tx[4],top=tx[5]-fontH;if(!Number.isFinite(left+top+width+fontH))continue;const el=document.createElement('span');el.className='preview-hit';el.style.left=`${Math.max(0,left-2)}px`;el.style.top=`${Math.max(0,top-1)}px`;el.style.width=`${Math.min(viewport.width-Math.max(0,left-2),width+4)}px`;el.style.height=`${fontH+2}px`;layer.appendChild(el);if(++hits>=28)break}}
  async function renderPdfThumbnail(r,q){if(!(r?.type==='pdf'&&r.page))return;const host=content.querySelector('.preview-visual');if(!host)return;const token=++previewToken;host.innerHTML='<div class="preview-loading"><div><div class="preview-spinner"></div>Загружаю только нужную страницу…</div></div>';try{const lib=await getPdfJs(),doc=await getPreviewDocument(r.path);if(token!==previewToken||!host.isConnected)return;const page=await doc.getPage(r.page),base=page.getViewport({scale:1}),maxW=Math.max(210,(host.clientWidth||560)-20),maxH=Math.max(160,(host.clientHeight||420)-20),scale=Math.max(.18,Math.min(1.15,maxW/base.width,maxH/base.height)),viewport=page.getViewport({scale}),dpr=Math.min(window.devicePixelRatio||1,1.5);host.innerHTML='<div class="preview-page-stage"><div class="preview-canvas-wrap"><canvas class="preview-canvas"></canvas><div class="preview-hit-layer"></div></div></div>';const canvas=host.querySelector('.preview-canvas'),wrap=host.querySelector('.preview-canvas-wrap'),layer=host.querySelector('.preview-hit-layer');canvas.width=Math.ceil(viewport.width*dpr);canvas.height=Math.ceil(viewport.height*dpr);canvas.style.width=`${viewport.width}px`;canvas.style.height=`${viewport.height}px`;wrap.style.width=layer.style.width=`${viewport.width}px`;wrap.style.height=layer.style.height=`${viewport.height}px`;const ctx=canvas.getContext('2d',{alpha:false});await page.render({canvasContext:ctx,viewport,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;if(token!==previewToken||!host.isConnected)return;await drawPreviewHits(page,viewport,layer,q,lib)}catch(err){if(token!==previewToken||!host.isConnected)return;host.innerHTML='<div class="preview-error">Не удалось построить миниатюру. Текстовый фрагмент ниже остаётся доступен.</div>'}}

  function bindSearchResults(q){const preview=content.querySelector('.search-preview');clearTimeout(autoPreviewTimer);content.querySelectorAll('.search-result').forEach(btn=>btn.onclick=()=>{clearTimeout(autoPreviewTimer);previewToken++;content.querySelectorAll('.search-result').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const r=lastResults[Number(btn.dataset.result)];preview.innerHTML=previewHtml(r,q);if(innerWidth<=820)preview.classList.add('mobile-visible');bindPreview(r,q,true)});if(lastResults[0]){preview.innerHTML=previewHtml(lastResults[0],q);bindPreview(lastResults[0],q,false);if(innerWidth>820&&lastResults[0].type==='pdf'&&lastResults[0].page){const expected=searchRun;autoPreviewTimer=setTimeout(()=>{if(expected===searchRun)renderPdfThumbnail(lastResults[0],q)},650)}}}
  function bindPreview(r,q,loadVisual=false){const preview=content.querySelector('.search-preview');const close=preview?.querySelector('.preview-close');if(close)close.onclick=()=>{previewToken++;preview.classList.remove('mobile-visible')};const open=preview?.querySelector('.open-result');if(open)open.onclick=()=>{if(r.type==='pdf')openPdf(r.path,r.title,r.page,q);else window.open(`https://nbviewer.org/github/${OWNER}/${REPO}/blob/${BRANCH}/${enc(r.path)}`,'_blank','noopener')};if(loadVisual&&r.type==='pdf'&&r.page)renderPdfThumbnail(r,q)}

  function renderSearchShell(q,status='Индексирую поиск…'){content.classList.add('search-mode');mobileTitle.textContent='Поиск';content.innerHTML=`<header class="search-head"><div><div class="course-kicker">Поиск по всем материалам</div><h1 class="course-code">Результаты</h1><p class="course-name">Запрос: «${esc(q)}»</p><div class="search-note">Поиск идёт по названиям и тексту PDF/ноутбуков. Для предпросмотра подгружается только выбранная страница PDF.</div></div></header><div class="search-layout"><div class="search-results"><div class="search-summary">${esc(status)}</div><div class="search-loading">Подготавливаю результаты</div></div><aside class="search-preview"><div class="preview-empty">Выберите результат — справа появится миниатюра найденной страницы.</div></aside></div>`}

  async function renderSearch(q){q=q.trim();const run=++searchRun;clearTimeout(autoPreviewTimer);previewToken++;if(!q){content.classList.remove('search-mode');renderSubject(current);return}renderSearchShell(q);let results=[],status='';if(norm(q).length<3){results=metadataFallback(q);status=`Найдено: ${results.length} · введите минимум 3 символа для поиска внутри файлов`;}else try{const data=await loadFullIndex();if(run!==searchRun)return;results=searchRecords(data.records,q);status=`Найдено: ${results.length}${results.length===120?'+' : ''} · полнотекстовый индекс`;}catch{if(run!==searchRun)return;results=metadataFallback(q);status=`Найдено: ${results.length} · полнотекстовый индекс ещё строится, пока поиск по названиям`;}lastResults=results;const box=content.querySelector('.search-results');if(!box)return;box.innerHTML=`<div class="search-summary">${esc(status)}</div>${results.length?results.map((r,i)=>resultHtml(r,i,q)).join(''):'<div class="empty">Ничего не найдено.</div>'}`;bindSearchResults(q)}

  function setSearchValue(v,source=null){if(source!==search)search.value=v;if(source!==mobileSearch)mobileSearch.value=v}
  function scheduleSearch(value,source){setSearchValue(value,source);clearTimeout(searchTimer);searchTimer=setTimeout(()=>renderSearch(value),220)}
  search.addEventListener('input',()=>scheduleSearch(search.value,search));mobileSearch.addEventListener('input',()=>scheduleSearch(mobileSearch.value,mobileSearch));
  menu.addEventListener('click',()=>sidebar.classList.toggle('mobile-open'));
  mobileSearchBtn.addEventListener('click',()=>{const open=document.body.classList.toggle('mobile-search-open');if(open)setTimeout(()=>mobileSearch.focus(),0)});
  const fromHash=location.hash.startsWith('#subject=')?decodeURIComponent(location.hash.slice(9)):null;if(fromHash&&ORDER.includes(fromHash))current=fromHash;else if(!subjectFiles(current).length)current=ORDER.find(s=>subjectFiles(s).length)||'ФиХАиМ';renderNav();renderSubject(current);
</script>
