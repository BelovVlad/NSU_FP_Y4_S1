<script>

  const ORDER=['ОВФ','СВЧ','ТДиСФ','ФКСВ','ФЭЧ','ФиХАиМ','База'];

    'ОВФ':{name:'Основы вычислительной физики',lecturer:'Усов Э. В.'},

  {% for file in site.static_files %}

  {% endfor %}
  ].map(p=>p.replace(/^\/+/,''))
   .filter(p=>!p.includes('/LaTeX/')&&ORDER.includes(p.split('/')[0]));

  const SECTION_ORDER=['Лекции','Семинары','Лабораторные работы','Месячные задания','Литература','Практика','Теория','Материалы'];
  const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search'),sidebar=document.getElementById('sidebar'),menu=document.getElementById('menu'),mobileTitle=document.getElementById('mobileTitle'),mobileSearchBtn=document.getElementById('mobileSearchBtn'),mobileSearch=document.getElementById('mobileSearch');
  let current='ФиХАиМ',searchTimer=null,searchRun=0,manifestPromise=null,allIndexPromise=null,fileMetaPromise=null,fileMetaMap=new Map(),rawResults=[],allGroups=[],visibleGroups=[],selectedGroup=0,selectedHit=0,lastQuery='',filterSubject='all',filterSection='all';
  let pdfjsPromise=null,previewToken=0,autoPreviewTimer=null;

  const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const ext=p=>(p.split('.').pop()||'').toLowerCase();
  const enc=p=>p.split('/').map(encodeURIComponent).join('/');
  const norm=s=>String(s||'').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').replace(/\s+/g,' ').trim();
  const subjectFiles=s=>FILES.filter(p=>p.split('/')[0]===s).sort((a,b)=>a.localeCompare(b,'ru',{numeric:true,sensitivity:'base'}));
  function cleanName(p){const parts=p.split('/'),name=parts.at(-1).replace(/\.[^.]+$/,''),sec=parts[1]||'';if(name.toLowerCase()==='final'){if(/лекц/i.test(sec))return'Конспект лекций';if(/семинар/i.test(sec))return'Семинары';if(/месяч/i.test(sec))return'Месячные задания';return'Итоговый материал'}if(name.toUpperCase()==='INDEX')return'Оглавление';return name.replaceAll('_',' ')}
  function sectionFor(p){const parts=p.split('/');if(parts.length<3)return'Материалы';const raw=(parts[1]||'').replace(/^\d+[_ .-]*/,'').replaceAll('_',' ').trim();if(/лекц/i.test(raw))return'Лекции';if(/семинар/i.test(raw))return'Семинары';if(/лаборатор/i.test(raw))return'Лабораторные работы';if(/месяч/i.test(raw))return'Месячные задания';if(/литерат/i.test(raw))return'Литература';if(/практик/i.test(raw))return'Практика';if(/теори/i.test(raw))return'Теория';return raw||'Материалы'}
  const rank=s=>{const i=SECTION_ORDER.indexOf(s);return i<0?999:i};
  const formatBytes=n=>{n=Number(n)||0;if(!n)return'';if(n<1024*1024)return`${Math.max(1,Math.round(n/1024))} КБ`;if(n<1024*1024*1024)return`${(n/1024/1024).toFixed(n<10*1024*1024?1:0)} МБ`;return`${(n/1024/1024/1024).toFixed(1)} ГБ`};
  const formatDate=s=>{if(!s)return'';const d=new Date(s);if(Number.isNaN(d.getTime()))return'';return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})};
  const isNew=s=>{if(!s)return false;const d=new Date(s);return Number.isFinite(d.getTime())&&Date.now()-d.getTime()<7*86400000&&Date.now()>=d.getTime()};

  async function loadFileMetadata(){if(!fileMetaPromise)fileMetaPromise=fetch('search-index/files.json',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('metadata unavailable');return r.json()}).then(data=>{fileMetaMap=new Map((data.files||[]).map(x=>[x.path,x]));return fileMetaMap}).catch(()=>fileMetaMap);return fileMetaPromise}
  function metaText(m,fallback=''){if(!m)return fallback;const parts=[];if(m.page_count)parts.push(`${m.page_count} стр.`);else if(m.cell_count)parts.push(`${m.cell_count} ячеек`);if(m.size)parts.push(formatBytes(m.size));if(m.updated_at)parts.push(`обн. ${formatDate(m.updated_at)}`);return [fallback,...parts].filter(Boolean).join(' · ')}
  async function enhanceMaterialMeta(){await loadFileMetadata();content.querySelectorAll('[data-meta-path]').forEach(el=>{const p=el.dataset.metaPath,m=fileMetaMap.get(p);if(!m)return;el.textContent=metaText(m,el.dataset.fallback||'');const line=el.closest('.material-main')?.querySelector('.material-name-line');if(line&&isNew(m.updated_at)&&!line.querySelector('.new-badge')){const badge=document.createElement('span');badge.className='new-badge';badge.textContent='NEW';line.appendChild(badge)}})}

  function renderNav(){nav.innerHTML=ORDER.map(s=>{const n=subjectFiles(s).length;if(!n)return'';return`<button class="subject-btn ${s===current?'active':''}" data-subject="${esc(s)}"><span class="subject-short">${esc(s)}</span><span class="count">${n}</span></button>`}).join('');nav.querySelectorAll('.subject-btn').forEach(b=>b.onclick=()=>{selectSubject(b.dataset.subject);sidebar.classList.remove('mobile-open')})}
  function selectSubject(s,hash=true){if(!ORDER.includes(s))return;current=s;setSearchValue('');content.classList.remove('search-mode');document.body.classList.remove('mobile-search-open');clearTimeout(autoPreviewTimer);previewToken++;renderNav();renderSubject(s);if(hash)history.replaceState(null,'',`#subject=${encodeURIComponent(s)}`)}
  function row(p){const e=ext(p),name=cleanName(p),fallback=p.split('/').slice(1,-1).join(' / ').replace(/^\d+[_ .-]*/,'').replaceAll('_',' ');const main=`<span class="material-main"><span class="material-name-line"><span class="material-name">${esc(name)}</span></span><span class="material-meta" data-meta-path="${esc(p)}" data-fallback="${esc(fallback||e.toUpperCase())}">${esc(fallback||e.toUpperCase())}</span></span>`;if(e==='pdf')return`<button class="material-row" data-pdf="${esc(p)}" data-title="${esc(name)}"><span class="type">PDF</span>${main}<span class="arrow">→</span></button>`;const u=`https://nbviewer.org/github/${OWNER}/${REPO}/blob/${BRANCH}/${enc(p)}`;return`<a class="material-row" href="${u}" target="_blank" rel="noopener"><span class="type">NB</span>${main}<span class="arrow">↗</span></a>`}
  function section(name,files){return`<section class="material-section"><div class="section-head"><h2 class="section-title">${esc(name)}</h2><span class="section-count">${files.length}</span></div><div class="material-list">${files.map(row).join('')}</div></section>`}
  function openPdf(p,title,page=0,find=''){const pageArg=page?`&page=${page}`:'';const findArg=find?`&find=${encodeURIComponent(find)}`:'';location.href=`pdfjs/viewer.html?file=${encodeURIComponent(p)}&title=${encodeURIComponent(title||cleanName(p))}&subject=${encodeURIComponent(p.split('/')[0]||current)}${pageArg}${findArg}`}
  function bindRows(){content.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>openPdf(b.dataset.pdf,b.dataset.title))}
  function renderSubject(s){const m=META[s]||{name:s},files=subjectFiles(s),groups=new Map();files.forEach(p=>{const k=sectionFor(p);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)});const people=[];if(m.lecturer)people.push(`<span class="person">Лектор <strong>${esc(m.lecturer)}</strong></span>`);if(m.seminarist)people.push(`<span class="person">Семинарист <strong>${esc(m.seminarist)}</strong></span>`);const sections=[...groups.entries()].sort((a,b)=>rank(a[0])-rank(b[0])||a[0].localeCompare(b[0],'ru')).map(([k,v])=>section(k,v)).join('');mobileTitle.textContent=s;content.innerHTML=`<header><div class="course-kicker">ФФ НГУ · 4 курс · 1 семестр</div><h1 class="course-code">${esc(s)}</h1><p class="course-name">${esc(m.name)}</p>${people.length?`<div class="people">${people.join('')}</div>`:''}</header><div class="materials">${sections||'<div class="empty">Материалов пока нет.</div>'}</div>`;bindRows();void enhanceMaterialMeta()}

  async function loadManifest(){if(!manifestPromise)manifestPromise=fetch('search-index/manifest.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('index unavailable');return r.json()});return manifestPromise}
  async function loadFullIndex(){if(!allIndexPromise)allIndexPromise=(async()=>{const m=await loadManifest();const parts=await Promise.all(m.shards.map(s=>fetch(`search-index/${s.file}`,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('index shard unavailable');return r.json()})));return{manifest:m,records:parts.flatMap(p=>p.records||[])}})();return allIndexPromise}

  function makeSnippet(text,q){const plain=String(text||'').replace(/\s+/g,' ').trim();if(!plain)return'';const low=norm(plain),needle=norm(q),terms=needle.split(' ').filter(Boolean);let at=needle?low.indexOf(needle):-1;if(at<0)for(const t of terms){at=low.indexOf(t);if(at>=0)break}if(at<0)at=0;const start=Math.max(0,at-145),end=Math.min(plain.length,at+Math.max(needle.length,20)+205);return`${start?'…':''}${plain.slice(start,end)}${end<plain.length?'…':''}`}
  function highlight(text,q){let html=esc(text);const terms=[...new Set(norm(q).split(' ').filter(t=>t.length>1))].sort((a,b)=>b.length-a.length);for(const t of terms){const safe=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');html=html.replace(new RegExp(`(${safe})`,'giu'),'<mark>$1</mark>')}return html}
  function scoreRecord(record,loc,q){const nq=norm(q),terms=nq.split(' ').filter(Boolean),title=norm(`${record.title} ${record.path} ${record.subject} ${record.section}`),text=norm(loc?.t||''),all=terms.every(t=>text.includes(t)||title.includes(t));if(!all)return-1;let score=0;if(text.includes(nq))score+=80;if(title.includes(nq))score+=100;for(const t of terms){if(title.includes(t))score+=15;if(text.includes(t))score+=5}return score}
  function hitFromRecord(r,loc,text,score){return{path:r.path,type:r.type,title:r.title,subject:r.subject,section:r.section,page:loc?.n||0,text,score,indexed:r.indexed,size:r.size,updated_at:r.updated_at,page_count:r.page_count,cell_count:r.cell_count}}
  async function metadataFallback(q){await loadFileMetadata();const terms=norm(q).split(' ').filter(Boolean);return FILES.map(p=>{const m=fileMetaMap.get(p)||{},hay=norm(`${p} ${cleanName(p)} ${(META[p.split('/')[0]]||{}).name||''}`);if(!terms.every(t=>hay.includes(t)))return null;return{path:p,type:ext(p)==='pdf'?'pdf':'ipynb',title:cleanName(p),subject:p.split('/')[0],section:sectionFor(p),page:0,text:'Совпадение найдено в названии или пути файла.',score:20,indexed:false,size:m.size,updated_at:m.updated_at,page_count:m.page_count,cell_count:m.cell_count}}).filter(Boolean)}
  function searchRecords(records,q){const out=[];for(const r of records){const metaScore=scoreRecord(r,null,q);if(metaScore>=0)out.push(hitFromRecord(r,null,'Совпадение найдено в названии или пути файла.',metaScore));for(const loc of r.pages||[]){const score=scoreRecord(r,loc,q);if(score>=0)out.push(hitFromRecord(r,loc,makeSnippet(loc.t,q),score+(r.type==='pdf'?2:0)))}}out.sort((a,b)=>b.score-a.score||a.subject.localeCompare(b.subject,'ru')||a.title.localeCompare(b.title,'ru'));const seen=new Set(),dedup=[];for(const r of out){const key=`${r.path}|${r.page}`;if(seen.has(key))continue;seen.add(key);dedup.push(r);if(dedup.length>=180)break}return dedup}

  function groupResults(results){const map=new Map();for(const hit of results){if(!map.has(hit.path))map.set(hit.path,{...hit,hits:[],score:hit.score});const g=map.get(hit.path);g.score=Math.max(g.score,hit.score);g.hits.push(hit)}const groups=[...map.values()];for(const g of groups){const pageHits=g.hits.filter(h=>h.page>0);if(pageHits.length)g.hits=pageHits;g.hits.sort((a,b)=>b.score-a.score||a.page-b.page)}groups.sort((a,b)=>b.score-a.score||a.subject.localeCompare(b.subject,'ru')||a.title.localeCompare(b.title,'ru'));return groups}
  function resultLabel(hit){return hit.type==='pdf'?(hit.page?`стр. ${hit.page}`:'PDF'):(hit.page?`ячейка ${hit.page}`:'Notebook')}
  function groupMeta(g){const parts=[g.section];if(g.page_count)parts.push(`${g.page_count} стр.`);else if(g.cell_count)parts.push(`${g.cell_count} ячеек`);if(g.size)parts.push(formatBytes(g.size));if(g.updated_at)parts.push(`обн. ${formatDate(g.updated_at)}`);return parts.filter(Boolean).join(' · ')}
  function groupHtml(g,i,q){const first=g.hits[0],pills=g.hits.slice(0,8).map((h,j)=>`<button class="page-hit${i===selectedGroup&&j===selectedHit?' active':''}" data-group="${i}" data-hit="${j}">${esc(resultLabel(h))}</button>`).join(''),more=g.hits.length>8?`<span class="more-hits">+${g.hits.length-8}</span>`:'';return`<div class="search-group${i===selectedGroup?' active':''}" data-group-card="${i}"><button class="group-main" data-group="${i}"><div class="group-top"><span class="result-badge">${esc(g.subject)}</span><span class="group-title">${highlight(g.title,q)}</span>${isNew(g.updated_at)?'<span class="new-badge">NEW</span>':''}<span class="hit-count">${g.hits.length} совп.</span></div><div class="group-meta">${esc(groupMeta(g))}</div><div class="group-snippet">${highlight(first?.text||'',q)}</div></button><div class="group-pages">${pills}${more}</div></div>`}
  function filtersHtml(){const sections=[...new Set(allGroups.map(g=>g.section).filter(Boolean))].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b,'ru')),subjects=ORDER.filter(s=>allGroups.some(g=>g.subject===s));const chips=(kind,values,currentValue)=>`<button class="filter-chip${currentValue==='all'?' active':''}" data-filter="${kind}" data-value="all">Все</button>${values.map(v=>`<button class="filter-chip${currentValue===v?' active':''}" data-filter="${kind}" data-value="${esc(v)}">${esc(v)}</button>`).join('')}`;return`<div class="search-filters"><div class="filter-row"><span class="filter-label">Раздел</span><div class="filter-scroll">${chips('section',sections,filterSection)}</div></div><div class="filter-row"><span class="filter-label">Предмет</span><div class="filter-scroll">${chips('subject',subjects,filterSubject)}</div></div></div>`}
  function previewHtml(g,hitIndex,q){if(!g)return'<div class="preview-empty">Выберите документ слева — здесь появится найденный фрагмент.</div>';const hit=g.hits[hitIndex]||g.hits[0],visual=hit.type==='pdf'&&hit.page?'<div class="preview-visual"><div class="preview-await">Миниатюра загружается только для выбранной страницы.</div></div>':'';return`<div class="preview-body"><div class="preview-header"><div><div class="preview-subject">${esc(hit.subject)} · ${esc(hit.section)} · ${esc(resultLabel(hit))}</div><h2 class="preview-title">${esc(hit.title)}</h2></div><button class="preview-close" type="button" aria-label="Закрыть">×</button></div><div class="preview-meta">${esc(hit.path)}${g.page_count?` · ${g.page_count} стр.`:''}${g.size?` · ${esc(formatBytes(g.size))}`:''}</div><div class="preview-toolbar"><button class="open-result" type="button">${hit.type==='pdf'?(hit.page?`Открыть стр. ${hit.page}`:'Открыть PDF'):'Открыть notebook'}</button><div class="hit-nav"><button class="hit-nav-btn prev-hit" type="button" title="Предыдущее совпадение">‹</button><span class="hit-position">${hitIndex+1} / ${g.hits.length}</span><button class="hit-nav-btn next-hit" type="button" title="Следующее совпадение">›</button></div></div>${visual}<div class="preview-text">${highlight(hit.text,q)}</div></div>`}

  async function getPdfJs(){if(!pdfjsPromise)pdfjsPromise=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';return m});return pdfjsPromise}
  async function resolvePreviewPdfUrl(path){const local=new URL(enc(path),location.href).href;try{const h=await fetch(local,{method:'HEAD',cache:'force-cache'});const len=Number(h.headers.get('content-length')||0);if(h.ok&&len>0&&len<2048){const t=await fetch(local,{cache:'force-cache'}).then(r=>r.text());if(t.startsWith('version https://git-lfs.github.com/spec/v1'))return`https://media.githubusercontent.com/media/${OWNER}/${REPO}/${BRANCH}/${enc(path)}`}}catch{}return local}
  async function getPreviewDocument(path){const cached=previewDocs.get(path);if(cached){cached.used=Date.now();return cached.doc}const lib=await getPdfJs(),url=await resolvePreviewPdfUrl(path),task=lib.getDocument({url,disableRange:false,disableStream:true,disableAutoFetch:true,rangeChunkSize:131072}),doc=await task.promise;previewDocs.set(path,{doc,used:Date.now()});if(previewDocs.size>2){const old=[...previewDocs.entries()].filter(([p])=>p!==path).sort((a,b)=>a[1].used-b[1].used)[0];if(old){previewDocs.delete(old[0]);old[1].doc.destroy().catch(()=>{})}}return doc}
  async function drawPreviewHits(page,viewport,layer,q,lib){const terms=[...new Set(norm(q).split(' ').filter(t=>t.length>1))];if(!terms.length)return;const tc=await page.getTextContent();let hits=0;for(const item of tc.items||[]){if(!item.str)continue;const s=norm(item.str);if(!terms.some(t=>s.includes(t)))continue;const tx=lib.Util.transform(viewport.transform,item.transform),fontH=Math.max(4,Math.hypot(tx[2],tx[3])),width=Math.max(5,(item.width||0)*viewport.scale),left=tx[4],top=tx[5]-fontH;if(!Number.isFinite(left+top+width+fontH))continue;const el=document.createElement('span');el.className='preview-hit';el.style.left=`${Math.max(0,left-2)}px`;el.style.top=`${Math.max(0,top-1)}px`;el.style.width=`${Math.min(viewport.width-Math.max(0,left-2),width+4)}px`;el.style.height=`${fontH+2}px`;layer.appendChild(el);if(++hits>=28)break}}
  async function renderPdfThumbnail(hit,q){if(!(hit?.type==='pdf'&&hit.page))return;const host=content.querySelector('.preview-visual');if(!host)return;const token=++previewToken;host.innerHTML='<div class="preview-loading"><div><div class="preview-spinner"></div>Загружаю только нужную страницу…</div></div>';try{const lib=await getPdfJs(),doc=await getPreviewDocument(hit.path);if(token!==previewToken||!host.isConnected)return;const page=await doc.getPage(hit.page),base=page.getViewport({scale:1}),mobile=innerWidth<=820,maxW=Math.max(280,(host.clientWidth||620)-12),maxH=Math.max(240,(host.clientHeight||520)-12),scale=mobile?Math.max(.35,Math.min(1.75,maxW/base.width)):Math.max(.24,Math.min(1.38,maxW/base.width,maxH/base.height)),viewport=page.getViewport({scale}),dpr=Math.min(window.devicePixelRatio||1,1.5);host.innerHTML='<div class="preview-page-stage"><div class="preview-canvas-wrap"><canvas class="preview-canvas"></canvas><div class="preview-hit-layer"></div></div></div>';const stage=host.querySelector('.preview-page-stage'),canvas=host.querySelector('.preview-canvas'),wrap=host.querySelector('.preview-canvas-wrap'),layer=host.querySelector('.preview-hit-layer');canvas.width=Math.ceil(viewport.width*dpr);canvas.height=Math.ceil(viewport.height*dpr);canvas.style.width=`${viewport.width}px`;canvas.style.height=`${viewport.height}px`;wrap.style.width=layer.style.width=`${viewport.width}px`;wrap.style.height=layer.style.height=`${viewport.height}px`;const ctx=canvas.getContext('2d',{alpha:false});await page.render({canvasContext:ctx,viewport,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;if(token!==previewToken||!host.isConnected)return;await drawPreviewHits(page,viewport,layer,q,lib);if(mobile){const first=layer.querySelector('.preview-hit');if(first)stage.scrollTop=Math.max(0,first.offsetTop-stage.clientHeight*.30)}}catch(err){if(token!==previewToken||!host.isConnected)return;host.innerHTML='<div class="preview-error">Не удалось построить миниатюру. Текстовый фрагмент ниже остаётся доступен.</div>'}}

  function bindFilters(q,status){content.querySelectorAll('.filter-chip').forEach(btn=>btn.onclick=()=>{const kind=btn.dataset.filter,value=btn.dataset.value;if(kind==='subject')filterSubject=value;else filterSection=value;selectedGroup=0;selectedHit=0;document.getElementById('filterHost').innerHTML=filtersHtml();renderFilteredResults(q,status)})}
  function bindGroupList(q){content.querySelectorAll('.group-main').forEach(btn=>btn.onclick=()=>selectHit(Number(btn.dataset.group),0,q,true));content.querySelectorAll('.page-hit').forEach(btn=>btn.onclick=e=>{e.stopPropagation();selectHit(Number(btn.dataset.group),Number(btn.dataset.hit),q,true)})}
  function bindPreview(g,q,loadVisual=false){const preview=content.querySelector('.search-preview'),hit=g?.hits[selectedHit];const close=preview?.querySelector('.preview-close');if(close)close.onclick=()=>{previewToken++;preview.classList.remove('mobile-visible')};const open=preview?.querySelector('.open-result');if(open)open.onclick=()=>{if(hit.type==='pdf')openPdf(hit.path,hit.title,hit.page,q);else window.open(`https://nbviewer.org/github/${OWNER}/${REPO}/blob/${BRANCH}/${enc(hit.path)}`,'_blank','noopener')};const prevBtn=preview?.querySelector('.prev-hit'),nextBtn=preview?.querySelector('.next-hit');if(prevBtn)prevBtn.onclick=()=>selectHit(selectedGroup,(selectedHit-1+g.hits.length)%g.hits.length,q,true);if(nextBtn)nextBtn.onclick=()=>selectHit(selectedGroup,(selectedHit+1)%g.hits.length,q,true);if(loadVisual&&hit?.type==='pdf'&&hit.page)renderPdfThumbnail(hit,q)}
  function selectHit(groupIndex,hitIndex,q,loadVisual){clearTimeout(autoPreviewTimer);previewToken++;selectedGroup=Math.max(0,Math.min(visibleGroups.length-1,groupIndex));const g=visibleGroups[selectedGroup];if(!g)return;selectedHit=Math.max(0,Math.min(g.hits.length-1,hitIndex));content.querySelectorAll('.search-group').forEach((el,i)=>el.classList.toggle('active',i===selectedGroup));content.querySelectorAll('.page-hit').forEach(el=>el.classList.toggle('active',Number(el.dataset.group)===selectedGroup&&Number(el.dataset.hit)===selectedHit));const preview=content.querySelector('.search-preview');preview.innerHTML=previewHtml(g,selectedHit,q);if(innerWidth<=820)preview.classList.add('mobile-visible');bindPreview(g,q,loadVisual)}
  function renderFilteredResults(q,status){visibleGroups=allGroups.filter(g=>(filterSubject==='all'||g.subject===filterSubject)&&(filterSection==='all'||g.section===filterSection));if(selectedGroup>=visibleGroups.length)selectedGroup=0;selectedHit=0;const totalHits=visibleGroups.reduce((n,g)=>n+g.hits.length,0),box=content.querySelector('.search-results');if(!box)return;box.innerHTML=`<div class="search-summary">${esc(status)} · ${visibleGroups.length} документов · ${totalHits} совпадений</div>${visibleGroups.length?visibleGroups.map((g,i)=>groupHtml(g,i,q)).join(''):'<div class="empty">По этим фильтрам ничего не найдено.</div>'}`;bindFilters(q,status);bindGroupList(q);const preview=content.querySelector('.search-preview');if(visibleGroups[0]){preview.innerHTML=previewHtml(visibleGroups[0],0,q);bindPreview(visibleGroups[0],q,false);if(innerWidth>820){const expected=searchRun;autoPreviewTimer=setTimeout(()=>{if(expected===searchRun&&visibleGroups[0]?.hits[0])renderPdfThumbnail(visibleGroups[0].hits[0],q)},600)}}else preview.innerHTML='<div class="preview-empty">Нет результатов для выбранных фильтров.</div>'}
  function renderSearchShell(q){content.classList.add('search-mode');mobileTitle.textContent='Поиск';content.innerHTML=`<header class="search-head"><div><div class="course-kicker">Поиск по всем материалам</div><h1 class="course-code">Результаты</h1><p class="course-name">Запрос: «${esc(q)}»</p><div class="search-note">Результаты сгруппированы по документам. Фильтры и переключение совпадений не загружают PDF; миниатюра подгружается только для выбранной страницы.</div></div></header><div id="filterHost"></div><div class="search-layout"><div class="search-results"><div class="search-summary">Подготавливаю результаты…</div><div class="search-loading">Ищу</div></div><aside class="search-preview"><div class="preview-empty">Выберите документ — справа появится миниатюра найденной страницы.</div></aside></div>`}
  async function renderSearch(q){q=q.trim();const run=++searchRun;clearTimeout(autoPreviewTimer);previewToken++;if(!q){content.classList.remove('search-mode');renderSubject(current);return}if(q!==lastQuery){filterSubject='all';filterSection='all';selectedGroup=0;selectedHit=0;lastQuery=q}renderSearchShell(q);let results=[],status='';if(norm(q).length<3){results=await metadataFallback(q);status='поиск по названиям';}else try{const data=await loadFullIndex();if(run!==searchRun)return;results=searchRecords(data.records,q);status='полнотекстовый индекс';}catch{if(run!==searchRun)return;results=await metadataFallback(q);status='индекс ещё строится, поиск по названиям';}if(run!==searchRun)return;rawResults=results;allGroups=groupResults(results);document.getElementById('filterHost').innerHTML=filtersHtml();renderFilteredResults(q,status)}

  function setSearchValue(v,source=null){if(source!==search)search.value=v;if(source!==mobileSearch)mobileSearch.value=v}
  function scheduleSearch(value,source){setSearchValue(value,source);clearTimeout(searchTimer);searchTimer=setTimeout(()=>renderSearch(value),220)}
  search.addEventListener('input',()=>scheduleSearch(search.value,search));mobileSearch.addEventListener('input',()=>scheduleSearch(mobileSearch.value,mobileSearch));
  menu.addEventListener('click',()=>sidebar.classList.toggle('mobile-open'));
  mobileSearchBtn.addEventListener('click',()=>{const open=document.body.classList.toggle('mobile-search-open');if(open)setTimeout(()=>mobileSearch.focus(),0)});
  const fromHash=location.hash.startsWith('#subject=')?decodeURIComponent(location.hash.slice(9)):null;if(fromHash&&ORDER.includes(fromHash))current=fromHash;else if(!subjectFiles(current).length)current=ORDER.find(s=>subjectFiles(s).length)||'ФиХАиМ';renderNav();renderSubject(current);void loadFileMetadata();
</script>
