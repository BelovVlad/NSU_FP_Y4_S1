<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#001a00">
  <title>ФФ НГУ — 4 курс, 1 семестр</title>
  <style>
    :root{
      --bg:#001a00;--side:#001500;--panel:#002600;--panel2:#003209;--line:#1a4d26;--soft:#103a1a;
      --text:#33ff66;--text2:#66ff8c;--muted:#29cc52;--dim:#168b36;--accent:#00ff41;
      --accentSoft:rgba(51,255,102,.10);--glow:rgba(51,255,102,.32);--sideW:292px;--statusH:30px
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{background:var(--bg);color:var(--text);font-family:"Consolas","Cascadia Mono","Liberation Mono","Courier New",monospace;line-height:1.5;text-shadow:0 0 3px rgba(51,255,102,.20)}
    ::selection{background:var(--text);color:var(--bg)}
    button,input{font:inherit}button{color:inherit}a{color:inherit}.app{min-height:100vh}
    .crt-overlay{position:fixed;inset:-5vh 0;z-index:999;pointer-events:none;background:radial-gradient(ellipse at center,transparent 54%,rgba(0,0,0,.13) 78%,rgba(0,0,0,.38) 100%),repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.20) 2px,rgba(0,0,0,.20) 3px)}
    .sidebar{position:fixed;inset:0 auto var(--statusH) 0;z-index:20;width:var(--sideW);display:flex;flex-direction:column;padding:25px 17px 16px;border-right:1px solid var(--line);background:linear-gradient(180deg,#001900 0%,var(--side) 100%);box-shadow:8px 0 30px rgba(0,0,0,.20)}
    .brand{padding:0 10px 20px;border-bottom:1px solid var(--line)}
    .brand-kicker,.course-kicker{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .brand-title{margin:8px 0 0;color:var(--text2);font-size:27px;line-height:1.12;letter-spacing:.04em;text-shadow:0 0 4px var(--glow),0 0 10px rgba(51,255,102,.12)}
    .brand-sub{margin-top:6px;color:var(--dim);font-size:13px;letter-spacing:.05em}
    .search-wrap{padding:18px 4px 14px}.search{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:2px;outline:none;background:#001200;color:var(--text);caret-color:var(--accent);box-shadow:inset 0 0 16px rgba(0,0,0,.25)}.search::placeholder{color:#177f32}.search:focus{border-color:var(--accent);box-shadow:0 0 0 1px rgba(0,255,65,.20),inset 0 0 16px rgba(0,0,0,.22)}
    .nav-label{padding:4px 10px 8px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.nav-label::before{content:':: '}
    .subject-nav{min-height:0;flex:1;overflow-y:auto;padding:0 4px;scrollbar-color:var(--line) #001200}.subject-btn{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;margin:2px 0;padding:10px 11px;border:1px solid transparent;border-radius:2px;background:transparent;text-align:left;cursor:pointer}.subject-btn:hover{border-color:var(--line);background:rgba(51,255,102,.035)}.subject-btn.active{border-color:var(--accent);background:var(--accentSoft);box-shadow:inset 3px 0 0 var(--accent),0 0 12px rgba(0,255,65,.05)}.subject-short{overflow:hidden;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.subject-short::before{content:'  ';white-space:pre}.subject-btn.active .subject-short::before{content:'> ';color:var(--accent)}.count{min-width:28px;padding:1px 6px;border:1px solid var(--line);border-radius:2px;background:#001500;color:var(--dim);font-size:11px;font-weight:700;text-align:center}.subject-btn.active .count{border-color:var(--accent);color:var(--text2);background:#002300}
    .sidebar-footer{padding:14px 4px 0;border-top:1px solid var(--line)}.repo-link{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border:1px solid transparent;border-radius:2px;color:var(--dim);text-decoration:none;font-size:12px}.repo-link:hover{border-color:var(--line);background:rgba(51,255,102,.035);color:var(--text)}
    .main{min-height:100vh;margin-left:var(--sideW)}.content{width:min(920px,calc(100% - 64px));margin:0 auto;padding:56px 0 calc(82px + var(--statusH))}.course-code{margin:10px 0 0;color:var(--text2);font-size:clamp(38px,6vw,59px);line-height:1.02;letter-spacing:-.025em;text-shadow:0 0 5px var(--glow),0 0 16px rgba(51,255,102,.10)}.course-code::before{content:'> ';color:var(--accent)}.course-name{max-width:760px;margin:13px 0 0;color:var(--text);font-size:18px}.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.person{display:inline-flex;gap:7px;align-items:center;padding:6px 9px;border:1px solid var(--line);border-radius:2px;background:#001800;color:var(--dim);font-size:12px}.person::before{content:'[';color:var(--accent)}.person::after{content:']';color:var(--accent)}.person strong{color:var(--text2);font-weight:600}
    .materials{margin-top:40px}.material-section{margin-top:34px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 9px;padding-bottom:7px;border-bottom:1px dashed var(--line)}.section-title{margin:0;color:var(--text2);font-size:17px;letter-spacing:.025em;text-transform:uppercase}.section-title::before{content:'> ';color:var(--accent)}.section-count{color:var(--dim);font-size:11px}.section-count::before{content:'['}.section-count::after{content:']'}
    .material-list{overflow:hidden;border:1px solid var(--line);border-radius:2px;background:rgba(0,38,0,.45);box-shadow:inset 0 0 28px rgba(0,0,0,.12)}.material-row{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:13px;min-height:66px;padding:10px 15px;border:0;border-bottom:1px solid var(--soft);background:transparent;color:var(--text);text-align:left;cursor:pointer;text-decoration:none}.material-row:last-child{border-bottom:0}.material-row:hover{background:rgba(51,255,102,.06);box-shadow:inset 3px 0 0 var(--accent)}.type{display:grid;place-items:center;width:42px;height:34px;border:1px solid var(--line);border-radius:2px;background:#001900;color:var(--muted);font-size:10px;font-weight:800}.type::before{content:'['}.type::after{content:']'}.material-main{min-width:0}.material-name{display:block;overflow:hidden;color:var(--text2);font-weight:650;text-overflow:ellipsis;white-space:nowrap}.material-meta{display:block;overflow:hidden;margin-top:3px;color:var(--dim);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.arrow{color:var(--dim);font-size:18px}.material-row:hover .arrow{color:var(--accent);text-shadow:0 0 5px var(--glow)}.empty{padding:27px;border:1px dashed var(--line);border-radius:2px;color:var(--dim);text-align:center}.empty::before{content:'[ '}.empty::after{content:' ]'}
    .status-line{position:fixed;z-index:1001;left:0;right:0;bottom:0;height:var(--statusH);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 13px;border-top:1px solid var(--line);background:#001100;color:var(--dim);font-size:11px;letter-spacing:.04em;text-shadow:none}.status-left{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status-right{color:var(--muted);white-space:nowrap}.cursor{display:inline-block;width:8px;height:13px;margin-left:5px;vertical-align:-2px;background:var(--accent);box-shadow:0 0 5px var(--glow);animation:blink 1.05s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}
    .mobilebar{display:none}
    @media(max-width:820px){:root{--sideW:280px;--statusH:27px}.mobilebar{position:sticky;top:0;z-index:15;height:56px;display:flex;align-items:center;gap:12px;padding:0 13px;border-bottom:1px solid var(--line);background:rgba(0,20,0,.97)}.menubtn{width:40px;height:38px;border:1px solid var(--line);border-radius:2px;background:#001900;color:var(--text);cursor:pointer}.menubtn:hover{border-color:var(--accent)}.mobile-title{overflow:hidden;color:var(--text2);font-weight:700;text-overflow:ellipsis;white-space:nowrap}.mobile-title::before{content:'> ';color:var(--accent)}.sidebar{transform:translateX(-100%);box-shadow:18px 0 50px rgba(0,0,0,.45);transition:transform .18s ease}.sidebar.mobile-open{transform:translateX(0)}.main{margin-left:0}.content{width:min(100% - 26px,760px);padding:31px 0 calc(62px + var(--statusH))}.course-code{font-size:38px}.course-name{font-size:16px}.material-row{grid-template-columns:39px minmax(0,1fr) auto;gap:10px;padding:9px 11px}.type{width:38px}.status-line{padding:0 9px;font-size:9px}.crt-overlay{opacity:.72}}
    @media(prefers-reduced-motion:reduce){.cursor{animation:none}}
    @media(forced-colors:active),(prefers-contrast:more){.crt-overlay{display:none}body{text-shadow:none}}
  </style>
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="brand-kicker">[NSU::PHYSICS]</div><h1 class="brand-title">4 COURSE</h1><div class="brand-sub">SEMESTER_01 · 2026</div></div>
    <div class="search-wrap"><input id="search" class="search" type="search" placeholder="> поиск материалов..." autocomplete="off"></div>
    <div class="nav-label">Предметы</div><nav id="nav" class="subject-nav"></nav>
    <div class="sidebar-footer"><a class="repo-link" href="https://github.com/BelovVlad/NSU_Faculty_of_Physics-4th-year--1st-semester-" target="_blank" rel="noopener"><span>GITHUB_REPOSITORY</span><span>↗</span></a></div>
  </aside>
  <main class="main"><div class="mobilebar"><button id="menu" class="menubtn" type="button">☰</button><div id="mobileTitle" class="mobile-title">Материалы</div></div><div id="content" class="content"></div></main>
</div>
<div class="crt-overlay" aria-hidden="true"></div>
<div class="status-line" aria-hidden="true"><span class="status-left">NSU_PHYSICS://COURSE_04/SEMESTER_01</span><span class="status-right">SYSTEM READY<span class="cursor"></span></span></div>
<script>
  const OWNER='BelovVlad',REPO='NSU_Faculty_of_Physics-4th-year--1st-semester-',BRANCH='main';
  const ORDER=['ОВФ','СВЧ','ТДиСФ','ФКСВ','ФЭЧ','ФиХАиМ','База'];
  const META={
    'ОВФ':{name:'Основы вычислительной физики',lecturer:'Усов Э. В.'},
    'СВЧ':{name:'СВЧ'},
    'ТДиСФ':{name:'Термодинамика и статистическая физика',lecturer:'Грабовский В. В.',seminarist:'Глинский В. В.'},
    'ФКСВ':{name:'ФКСВ',lecturer:'Шварц Б. А.',seminarist:'Махмудиан М. М.'},
    'ФЭЧ':{name:'Физика атомного ядра и элементарных частиц',lecturer:'Шварц Б. А.',seminarist:'Винокурова А. Н.'},
    'ФиХАиМ':{name:'Физика и химия атомов и молекул',lecturer:'Горбунов О. А.',seminarist:'Горбунов О. А.'},
    'База':{name:'База знаний'}
  };
  const FILES=[
  {% for file in site.static_files %}
    {% assign ext = file.extname | downcase %}
    {% if ext == '.pdf' or ext == '.ipynb' %}{{ file.path | jsonify }},{% endif %}
  {% endfor %}
  ].map(p=>p.replace(/^\/+/,''))
   .filter(p=>!p.includes('/LaTeX/')&&ORDER.includes(p.split('/')[0]));

  const SECTION_ORDER=['Лекции','Семинары','Лабораторные работы','Месячные задания','Литература','Практика','Теория','Материалы'];
  const nav=document.getElementById('nav'),content=document.getElementById('content'),search=document.getElementById('search'),sidebar=document.getElementById('sidebar'),menu=document.getElementById('menu'),mobileTitle=document.getElementById('mobileTitle');
  let current='ФиХАиМ';

  const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const ext=p=>(p.split('.').pop()||'').toLowerCase();
  const enc=p=>p.split('/').map(encodeURIComponent).join('/');
  const subjectFiles=s=>FILES.filter(p=>p.split('/')[0]===s).sort((a,b)=>a.localeCompare(b,'ru',{numeric:true,sensitivity:'base'}));
  function cleanName(p){const parts=p.split('/'),name=parts.at(-1).replace(/\.[^.]+$/,''),sec=parts[1]||'';if(name.toLowerCase()==='final'){if(/лекц/i.test(sec))return'Конспект лекций';if(/семинар/i.test(sec))return'Семинары';if(/месяч/i.test(sec))return'Месячные задания';return'Итоговый материал'}if(name.toUpperCase()==='INDEX')return'Оглавление';return name.replaceAll('_',' ')}
  function sectionFor(p){const parts=p.split('/');if(parts.length<3)return'Материалы';const raw=(parts[1]||'').replace(/^\d+[_ .-]*/,'').replaceAll('_',' ').trim();if(/лекц/i.test(raw))return'Лекции';if(/семинар/i.test(raw))return'Семинары';if(/лаборатор/i.test(raw))return'Лабораторные работы';if(/месяч/i.test(raw))return'Месячные задания';if(/литерат/i.test(raw))return'Литература';if(/практик/i.test(raw))return'Практика';if(/теори/i.test(raw))return'Теория';return raw||'Материалы'}
  const rank=s=>{const i=SECTION_ORDER.indexOf(s);return i<0?999:i};

  function renderNav(){nav.innerHTML=ORDER.map(s=>{const n=subjectFiles(s).length;if(!n)return'';return`<button class="subject-btn ${s===current?'active':''}" data-subject="${esc(s)}"><span class="subject-short">${esc(s)}</span><span class="count">${n}</span></button>`}).join('');nav.querySelectorAll('.subject-btn').forEach(b=>b.onclick=()=>{selectSubject(b.dataset.subject);sidebar.classList.remove('mobile-open')})}
  function selectSubject(s,hash=true){if(!ORDER.includes(s))return;current=s;search.value='';renderNav();renderSubject(s);if(hash)history.replaceState(null,'',`#subject=${encodeURIComponent(s)}`)}
  function row(p){const e=ext(p),name=cleanName(p),meta=p.split('/').slice(1,-1).join(' / ').replace(/^\d+[_ .-]*/,'').replaceAll('_',' ');if(e==='pdf')return`<button class="material-row" data-pdf="${esc(p)}" data-title="${esc(name)}"><span class="type">PDF</span><span class="material-main"><span class="material-name">${esc(name)}</span><span class="material-meta">${esc(meta||'PDF')}</span></span><span class="arrow">→</span></button>`;const u=`https://nbviewer.org/github/${OWNER}/${REPO}/blob/${BRANCH}/${enc(p)}`;return`<a class="material-row" href="${u}" target="_blank" rel="noopener"><span class="type">NB</span><span class="material-main"><span class="material-name">${esc(name)}</span><span class="material-meta">Jupyter Notebook · nbviewer</span></span><span class="arrow">↗</span></a>`}
  function section(name,files){return`<section class="material-section"><div class="section-head"><h2 class="section-title">${esc(name)}</h2><span class="section-count">${files.length}</span></div><div class="material-list">${files.map(row).join('')}</div></section>`}
  function openPdf(p,title){const url=`pdfjs/viewer.html?file=${encodeURIComponent(p)}&title=${encodeURIComponent(title||cleanName(p))}&subject=${encodeURIComponent(current)}`;location.href=url}
  function bindRows(){content.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>openPdf(b.dataset.pdf,b.dataset.title))}
  function renderSubject(s){const m=META[s]||{name:s},files=subjectFiles(s),groups=new Map();files.forEach(p=>{const k=sectionFor(p);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)});const people=[];if(m.lecturer)people.push(`<span class="person">Лектор <strong>${esc(m.lecturer)}</strong></span>`);if(m.seminarist)people.push(`<span class="person">Семинарист <strong>${esc(m.seminarist)}</strong></span>`);const sections=[...groups.entries()].sort((a,b)=>rank(a[0])-rank(b[0])||a[0].localeCompare(b[0],'ru')).map(([k,v])=>section(k,v)).join('');mobileTitle.textContent=s;content.innerHTML=`<header><div class="course-kicker">NSU/PHYSICS :: 4 COURSE :: SEMESTER_01</div><h1 class="course-code">${esc(s)}</h1><p class="course-name">${esc(m.name)}</p>${people.length?`<div class="people">${people.join('')}</div>`:''}</header><div class="materials">${sections||'<div class="empty">Материалов пока нет.</div>'}</div>`;bindRows()}
  function renderSearch(q){q=q.trim();if(!q){renderSubject(current);return}const low=q.toLocaleLowerCase('ru'),matches=FILES.filter(p=>{const s=p.split('/')[0],m=META[s]||{};return`${s} ${m.name||''} ${p} ${cleanName(p)}`.toLocaleLowerCase('ru').includes(low)}),by=new Map();matches.forEach(p=>{const s=p.split('/')[0];if(!by.has(s))by.set(s,[]);by.get(s).push(p)});mobileTitle.textContent='Поиск';const blocks=ORDER.filter(s=>by.has(s)).map(s=>section(`${s} · ${(META[s]||{}).name||s}`,by.get(s))).join('');content.innerHTML=`<header><div class="course-kicker">SEARCH://MATERIALS</div><h1 class="course-code">Результаты</h1><p class="course-name">Запрос: «${esc(q)}»</p></header><div class="materials">${blocks||'<div class="empty">Ничего не найдено.</div>'}</div>`;bindRows()}

  search.addEventListener('input',()=>renderSearch(search.value));menu.addEventListener('click',()=>sidebar.classList.toggle('mobile-open'));
  const fromHash=location.hash.startsWith('#subject=')?decodeURIComponent(location.hash.slice(9)):null;if(fromHash&&ORDER.includes(fromHash))current=fromHash;else if(!subjectFiles(current).length)current=ORDER.find(s=>subjectFiles(s).length)||'ФиХАиМ';renderNav();renderSubject(current);
</script>
</body>
</html>
