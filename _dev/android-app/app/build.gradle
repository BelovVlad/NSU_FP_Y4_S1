plugins {
    id 'com.android.application'
}

// The update key is kept out of git: CI restores it from repository secrets,
// local builds read the git-ignored keystore.properties. Without it the APK is
// signed with the debug key and cannot update an installed app.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) signingPropsFile.withInputStream { signingProps.load(it) }
def signingValue = { String key -> System.getenv(key) ?: signingProps.getProperty(key) }
def updateKeystore = signingValue('NSUFP_KEYSTORE')

android {
    namespace 'ru.nsu.fp'
    compileSdk 35

    signingConfigs {
        if (updateKeystore) {
            nsufp {
                storeFile rootProject.file(updateKeystore)
                storePassword signingValue('NSUFP_STORE_PASSWORD')
                keyAlias signingValue('NSUFP_KEY_ALIAS') ?: 'nsufp'
                keyPassword signingValue('NSUFP_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'ru.nsu.fp'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.10'
    }

    buildTypes {
        debug {
            if (updateKeystore) signingConfig signingConfigs.nsufp
        }
        release {
            if (updateKeystore) signingConfig signingConfigs.nsufp
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
